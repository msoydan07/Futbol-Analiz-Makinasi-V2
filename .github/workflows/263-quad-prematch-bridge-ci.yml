name: 263 quad T60 baseline/odds linkage acceptance - once
on:
  push:
    branches: [experiment/263-toplu-karsilastirma]
    paths:
      - 'experiments/263/quad_prematch_bridge_263.py'
      - 'experiments/263/test_quad_prematch_bridge_263.py'
      - '.github/workflows/263-quad-prematch-bridge-ci.yml'
permissions:
  contents: read
jobs:
  link-only:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install --disable-pip-version-check numpy==2.3.5 scipy==1.17.0
      - name: Seven focused connector tests, no old 880 model refit
        env:
          PYTHONPATH: experiments/263
        run: python -m unittest -v experiments/263/test_quad_prematch_bridge_263.py
