name: 263 previous-chat four-model value decision ONE batch
on:
  push:
    branches: [experiment/263-toplu-karsilastirma]
    paths:
      - 'experiments/263/four_model_value_policy_263.py'
      - 'experiments/263/test_four_model_value_policy_263.py'
      - 'experiments/263/market_quote_intake_263.py'
      - '.github/workflows/263-four-model-value-one-batch.yml'
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Pinned numerical dependencies only
        run: python -m pip install --disable-pip-version-check numpy==2.3.5 scipy==1.17.0
      - name: ONE combined decision plus quote intake acceptance
        env:
          PYTHONPATH: experiments/263
        run: |
          python -m unittest -v \
            experiments/263/test_four_model_value_policy_263.py \
            experiments/263/test_market_quote_intake_263.py
