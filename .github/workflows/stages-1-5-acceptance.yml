name: Asama 1-5 tek kabul denetimi
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - '.github/workflows/stages-1-5-acceptance.yml'
jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/01-kimlikler
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Kimlik testleri
        run: python -m unittest -q test_identity.py test_fixture_import.py
      - name: Veri ve kimlik hattini yeniden olustur
        run: |
          python collect_team_candidates.py
          python prepare_team_identity_review.py
          python audit_season_membership.py
          python import_provisional_teams.py
          python prepare_official_name_review.py
          python apply_official_team_names.py
          python verify_official_mappings.py
          python audit_identity_integrity.py
          python audit_fixture_candidates.py
          python import_real_fixtures.py
          python audit_result_quality.py
          python build_historical_results.py
      - name: xG bagimliligi
        run: python -m pip install soccerdata
      - name: xG ve eksik veri envanteri
        run: |
          python collect_understat_xg.py
          python build_understat_aliases.py
          python audit_understat_xg.py --understat-csv data/understat_matches.csv --aliases data/understat_reviewed_aliases.json
          python build_verified_xg_history.py
          python audit_missing_data_262.py
      - name: 2.6.2 veri eksikligi sayisal raporu
        run: python audit_262_data_readiness.py
      - name: Yedi gunluk fikstur kapi testleri
        run: python -m unittest -q test_verify_match_on_demand.py
      - name: TFF gercek mac detay sayfasi kanit testi
        run: python smoke_tff_official_detail.py
      - name: Ilk bes asama kabul raporu
        run: python audit_stages_1_5_acceptance.py
      - name: Kanit raporunu kaydet
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: stages-1-5-acceptance
          path: |
            data/tff_official_detail_smoke.json
            data/future_fixture_candidates.json
            data/262_data_readiness.json
            data/stages_1_5_acceptance.json
            data/historical_results_audit.json
            data/historical_verified_xg_report.json
            data/missing_data_inventory_262.json
          if-no-files-found: warn
