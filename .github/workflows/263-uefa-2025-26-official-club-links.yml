name: 263 UEFA 2025-26 official numeric team ID source link review only
on:
  push:
    branches: [experiment/263-toplu-karsilastirma]
    paths:
      - experiments/263/europe/uefa_2025_26_club_profile_provenance_263.py
      - experiments/263/europe/test_uefa_2025_26_club_profile_provenance_263.py
      - experiments/263/evidence/uefa_2025_26_article_club_links_web_review.json
      - .github/workflows/263-uefa-2025-26-official-club-links.yml
permissions:
  contents: read
  actions: read
jobs:
  official-link-review-only:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Obtain EXISTING accepted 132 only no UEFA network / no 288 reanalysis
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir -p prior_263
          gh run download 41480542512 --repo '${{ github.repository }}' -n 263-uefa-2025-26-cl-el-ten-league-single-coverage -D prior_263
          test -s prior_263/2025_26_cl_el_review_only_matches.json
      - name: Only NEW profile URL and 2025/26 identity security checks
        env:
          PYTHONPATH: experiments/263/europe
        run: python -m unittest -v experiments/263/europe/test_uefa_2025_26_club_profile_provenance_263.py
      - name: Compare 47 observed official profile link IDs with 132 accepted review candidates
        env:
          PYTHONPATH: experiments/263/europe
        run: python experiments/263/europe/uefa_2025_26_club_profile_provenance_263.py --union prior_263/2025_26_cl_el_review_only_matches.json
      - name: Upload sole profile-link evidence and 132 integrity overlay
        uses: actions/upload-artifact@v4
        with:
          name: 263-uefa-2025-26-official-club-id-link-review
          retention-days: 60
          if-no-files-found: error
          path: data/europe_staged_263/2025_26_official_profile_link_review/*.json
