name: 263 partial match one-batch training eligibility acceptance
on:
  push:
    branches: [experiment/263-toplu-karsilastirma]
    paths:
      - 'experiments/263/full_match_eligibility_263.py'
      - 'experiments/263/forward_quad.py'
      - 'experiments/263/forward_empirical_baseline_263.py'
      - 'experiments/263/test_full_match_eligibility_263.py'
      - 'data/staged_263/2026_10_31_ned1_abandoned_awarded_exception.json'
      - '.github/workflows/263-partial-match-eligibility-ci.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  accept:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Existing pinned model dependencies
        run: python -m pip install --disable-pip-version-check numpy==2.3.5 scipy==1.17.0
      - name: One targeted regression batch - do not rerun prior model comparisons
        env:
          PYTHONPATH: experiments/263
        run: |
          python -m unittest -v \
            experiments/263/test_full_match_eligibility_263.py \
            experiments/263/test_forward_empirical_baseline_263.py \
            experiments/263/test_forward_integrated_research_263.py
