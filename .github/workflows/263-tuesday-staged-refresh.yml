name: 263 Sali 10 lig otomatik veri yenileme - onizleme
on:
  schedule:
    - cron: '37 7 * * 2'
  workflow_dispatch:
permissions:
  contents: write
  actions: read
concurrency:
  group: 263-tuesday-data-stage
  cancel-in-progress: false
jobs:
  refresh-ten-league-staged-only:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - name: Checkout existing experimental code; main is scheduler only
        uses: actions/checkout@v4
        with:
          ref: experiment/263-toplu-karsilastirma
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Fixed numerical dependencies
        run: python -m pip install --disable-pip-version-check numpy==2.3.5 scipy==1.17.0
      - name: Fetch SHA-pinned immutable 4413-match archive
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p frozen_263
          gh run download 41251343847 --repo "$GITHUB_REPOSITORY" -n team-source-audit -D frozen_263
          echo '35c5e7b4e0fad45c592fd51cf094616f2ff60330ce52bcf21cd595968169f5a1  frozen_263/historical_results.csv' | sha256sum -c -
      - name: Existing ten-league two-season collection (no old experiments)
        shell: bash
        run: |
          set -euo pipefail
          python collect_team_candidates.py
          python prepare_team_identity_review.py
          python audit_season_membership.py
          python import_provisional_teams.py
          python prepare_official_name_review.py
          python apply_official_team_names.py
          python verify_official_mappings.py
          python audit_identity_integrity.py
          python audit_fixture_candidates.py
          python import_real_fixtures.py
          python audit_result_quality.py
          python build_historical_results.py
      - name: Immutable baseline, sources and row-level staged-only audit
        id: stage
        shell: bash
        run: |
          set -euo pipefail
          AS_OF="$(TZ=Europe/Istanbul date +%F)"
          python experiments/263/season_refresh_263.py \
            --base frozen_263/historical_results.csv \
            --identity-index experiments/263/evidence/identity_index_263.json \
            --refreshed-history data/historical_results.csv \
            --pipeline-audit data/historical_results_audit.json \
            --source-audit data/source_audit.csv \
            --as-of "$AS_OF" \
            --output data/staged_263
          python - <<'PY'
          import json,os
          from pathlib import Path
          x=json.loads(Path('data/staged_263/refresh_audit.json').read_text())
          assert x['status']=='STAGED_UNVERIFIED_SOURCE_FILES'
          assert x['independent_source_verification'] is False
          assert x['base_rows']==4413 and x['leagues_provided']==10
          assert x['total_rows']>=4413
          with open(os.environ['GITHUB_OUTPUT'],'a') as f:
              f.write('appended='+str(x['appended'])+'\n')
          print('STAGED_ONLY; appended=',x['appended'],'sha=',x['extended_history_sha256'])
          PY
      - name: Commit only new unverified staged source rows, never predictions
        if: steps.stage.outputs.appended != '0'
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A -- data/staged_263
          if ! git diff --cached --quiet; then
            git commit -m "data(263): stage Tuesday candidate, pending source review"
            git push origin HEAD:experiment/263-toplu-karsilastirma
          fi
      - name: Save audit even if data validation blocked
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: 263-tuesday-staged-data-audit
          if-no-files-found: warn
          retention-days: 30
          path: |
            data/staged_263/extended_history.csv
            data/staged_263/refresh_audit.json
            data/source_audit.csv
            data/historical_results_audit.json
            data/result_quality_report.json
            data/identity_integrity_report.json
