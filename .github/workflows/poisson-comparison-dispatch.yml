name: Poisson karsilastirma manuel baslat
on:
  workflow_dispatch:
    inputs:
      branch:
        description: 'Test edilecek gelistirme dali'
        required: true
        default: 'feature/01-kimlikler'
        type: choice
        options:
          - feature/01-kimlikler
jobs:
  compare:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - name: Secilen gelistirme dalini al
        uses: actions/checkout@v4
        with:
          ref: ${{ inputs.branch }}
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Matematiksel birim testleri
        run: python -m unittest -v test_experimental_poisson_baseline.py
      - name: Tarihsel veri hazirla
        run: |
          python collect_team_candidates.py
          python prepare_team_identity_review.py
          python audit_season_membership.py
          python import_provisional_teams.py
          python prepare_official_name_review.py
          python apply_official_team_names.py
          python verify_official_mappings.py
          python audit_identity_integrity.py
          python audit_fixture_candidates.py
          python import_real_fixtures.py
          python audit_result_quality.py
          python build_historical_results.py
      - name: Poisson ve lig ortalamasi karsilastirmasi
        run: python experimental_poisson_baseline.py
      - name: Rapor
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: poisson-league-comparison
          path: |
            data/poisson_baseline_backtest.json
            data/historical_results_audit.json
          if-no-files-found: warn
