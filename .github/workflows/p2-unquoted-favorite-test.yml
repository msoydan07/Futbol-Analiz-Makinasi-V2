name: P2 explicit unquoted favorite price integration
on:
  push:
    branches:
      - experiment/20261122-four-match-live-pdf-probe
    paths:
      - experiments/263/iddaa_pdf_first_quote_263.py
      - experiments/263/test_iddaa_pdf_unquoted_favorite_263.py
      - experiments/p1_market_intelligence/p2_market_alignment.py
      - experiments/p1_market_intelligence/test_p2_market_alignment.py
      - .github/workflows/p2-unquoted-favorite-test.yml
  workflow_dispatch:
permissions:
  contents: read
jobs:
  no-fabricated-odds:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install frozen-core numeric dependencies for existing bridge tests
        run: python -m pip install --disable-pip-version-check numpy==2.3.5 scipy==1.17.0 PyMuPDF==1.26.5 reportlab
      - name: P0 P1 P2 market mathematical and unquoted regressions
        env:
          PYTHONPATH: .:experiments/263:experiments/p1_market_intelligence
        run: python -m unittest discover -s experiments/p1_market_intelligence -p 'test_*.py' -v
      - name: Original-first-PDF snapshot explicit dash regression
        env:
          PYTHONPATH: .:experiments/263:experiments/p1_market_intelligence
        run: python -m unittest -v experiments/263/test_iddaa_pdf_unquoted_favorite_263.py
      - name: Main model-first and original price independent decision tests
        env:
          PYTHONPATH: .:experiments/263:experiments/p1_market_intelligence
        run: python -m unittest -v experiments/263/test_model_first_iddaa_bridge_263.py
