name: 263 Research - One pass 1269 only NEW FT result witnesses
on:
  push:
    branches:
      - research/263-13-lig-22-havuz-20261113
    paths:
      - .github/workflows/263-1269-new-only-FT-source-QA-once.yml
permissions:
  contents: write
jobs:
  seven_only_new_season_score_groups:
    runs-on: ubuntu-latest
    timeout-minutes: 7
    steps:
      - uses: actions/checkout@v4
      - name: Offline new 1269 frozen CSVs schema and alias selftest only
        run: python experiments/263/league_expansion/verify_1269_NEW_only_scored_FT_second_source_once.py --self-test
      - name: ONE per league light second-source fact witness read, report only no source table download retained
        shell: bash
        run: |
          python experiments/263/league_expansion/verify_1269_NEW_only_scored_FT_second_source_once.py --run > 1269_new_only_qa.log
          python - <<'PY'
          import os,json
          from pathlib import Path
          s=Path("1269_new_only_qa.log").read_text()
          d=json.loads(s.split("1269_SCORE_START",1)[1].split("1269_SCORE_END",1)[0])
          assert d["status"]=="ONE_PASS_ONLY_NEW_1269_RESULTS_7_SECOND_PROVIDER_FACT_WITNESSES_DONE__OR_FAIL_CLOSED_BY_GROUP",d
          assert d["new_1269_targeted"]==1269
          assert d["two_provider_FT_exact_date_home_away"]+d["FT_unmatched_or_conflicting_or_source_unavailable"]==1269
          assert d["new_training_approved"]==0
          Path("experiments/263/league_expansion/ccby_footballcharts_2025_26_regular_stage_novel_only/new1269_target_only_second_provider_FT_evidence_20261114.json").write_text(json.dumps(d,ensure_ascii=False,indent=2)+"\n")
          with open(os.environ["GITHUB_STEP_SUMMARY"],"a",encoding="utf-8") as f:
            f.write("## Only NEW 1269 historic league regular-stage scores, second provider fact witness\n")
            f.write("- Exact second-provider FT verified: "+str(d["two_provider_FT_exact_date_home_away"])+"\n")
            f.write("- Unmatched / different FT / provider unavailable (HOLD): "+str(d["FT_unmatched_or_conflicting_or_source_unavailable"])+"\n")
            for k,v in d["source_by_league"].items():
              f.write("- "+k+": "+str(v.get("score_verified",0))+" FT same out of "+str(v.get("new_targeted_keys",v.get("targeted_count","?")))+"\n")
            f.write("- No raw external scored CSVs retained, no prior matches rechecked, zero new training approvals.\n")
          PY
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: 263-1269-new-only-FT-QA-no-old-rerun
          path: |
            1269_new_only_qa.log
            experiments/263/league_expansion/ccby_footballcharts_2025_26_regular_stage_novel_only/new1269_target_only_second_provider_FT_evidence_20261114.json
          retention-days: 14
      - name: Commit only 1269 source-key checks no secondary score tables
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -- experiments/263/league_expansion/ccby_footballcharts_2025_26_regular_stage_novel_only/new1269_target_only_second_provider_FT_evidence_20261114.json
          if ! git diff --cached --quiet; then
            git commit -m "research(263): target ONLY 1269 new 2025/26 league regular FT second-witness keys, no old recheck"
            git push origin HEAD:research/263-13-lig-22-havuz-20261113
          fi
