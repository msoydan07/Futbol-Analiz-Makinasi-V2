name: 263 analysis-time odds snapshot - targeted tests
on:
  push:
    branches: [experiment/263-toplu-karsilastirma]
    paths:
      - 'experiments/263/classification_odds_263.py'
      - 'experiments/263/test_analysis_time_odds_263.py'
      - '.github/workflows/263-analysis-time-odds.yml'
permissions:
  contents: read
jobs:
  one-new-policy-suite:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Seven new time-of-analysis price policy checks
        env:
          PYTHONPATH: experiments/263
        run: python -m unittest -v experiments/263/test_analysis_time_odds_263.py
