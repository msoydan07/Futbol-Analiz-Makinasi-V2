name: "263 M4 xG private input and calibration gate"
on:
  push:
    branches: [research/263-xg-private-preflight-calibration-20261119]
  pull_request:
    branches: [experiment/263-toplu-karsilastirma]
permissions:
  contents: read
jobs:
  no-secret-leak-and-no-unproven-promotion:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Validate private CSV preflight, missing-data fallback, calibration thresholds and rights
        env:
          PYTHONPATH: experiments/263
        run: |
          python -m py_compile experiments/263/m4_xg_operational_gate_263.py
          python -m unittest -v experiments/263/test_m4_xg_operational_gate_263.py
      - name: Display only deterministic non-sensitive status
        run: echo 'GITHUB_ACTIONS_DOES_NOT_HAVE_CHATGPT_LIBRARY_XG_INPUT'
