name: "263 Data only - final 625 HOLD and pre-xG admission contract, no math"
on:
  push:
    branches:
      - research/263-13-lig-22-havuz-20261113
    paths:
      - .github/workflows/263-pre-xg-625-hold-and-data-admission-onepass.yml
      - experiments/263/league_expansion/pre_xg_625_hold_and_test_admission_20261114.py
permissions:
  contents: write
jobs:
  onepass-data-only:
    runs-on: ubuntu-latest
    timeout-minutes: 6
    steps:
      - uses: actions/checkout@v4
      - name: Synthetic fail-closed UTC leak and data rights contract test, no math
        run: python experiments/263/league_expansion/pre_xg_625_hold_and_test_admission_20261114.py --self-test
      - name: Reconcile existing 625 dispositions and 200 nonadditive corrections, no external fetch
        run: python experiments/263/league_expansion/pre_xg_625_hold_and_test_admission_20261114.py --run
      - name: Strict no-fit output invariants
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          p=Path("experiments/263/league_expansion/625_PRE_XG_DATA_ADMISSION_CONTRACT_20261114.json")
          x=json.loads(p.read_text(encoding="utf-8"))
          assert x["source_pointer_rows_unchanged"]==9460
          assert x["core_results_unchanged"]==4617
          assert x["research_score_fact_QA_PASS_LABEL_ONLY"]==4218
          assert x["research_HOLD"]==625
          assert sum(x["hold_disjoint_counts"].values())==625
          assert x["old_200_corrected_only_as_NONADDITIVE_reference"]==200
          assert x["source_rows_promoted_to_training"]==0
          assert not x["prediction_accuracy_rerun"] and not x["model_retrained"]
          assert not x["new_pilot"] and x["user_xg_workbook_unchanged"]
          assert x["no_automatic_model_ready_claim"]
          print("PASS 625 / 4218 / 4617, no new model or old QA replay")
          PY
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: 263-625-data-only-pre-xg-holds-and-admission-contract
          path: |
            experiments/263/league_expansion/625_PRE_XG_DATA_ADMISSION_CONTRACT_20261114.json
            experiments/263/league_expansion/625_PRE_XG_DATA_ADMISSION_CONTRACT_20261114.md
      - name: Commit ONLY 625 data-only report summaries, no source rows or training
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -- experiments/263/league_expansion/625_PRE_XG_DATA_ADMISSION_CONTRACT_20261114.json experiments/263/league_expansion/625_PRE_XG_DATA_ADMISSION_CONTRACT_20261114.md
          if ! git diff --cached --quiet; then
            git commit -m "research(data): freeze 625 hold decisions and xG-next pretest data admission"
            git push origin HEAD:research/263-13-lig-22-havuz-20261113
          fi
