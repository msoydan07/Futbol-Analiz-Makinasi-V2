name: 263 Research - One full 22x2 core and extension baseline audit and new ESP2 source label
on:
  push:
    branches:
      - research/263-13-lig-22-havuz-20261113
    paths:
      - .github/workflows/263-final-22x2-real-all-source-one-audit.yml
permissions:
  contents: write
jobs:
  final-factual-base-inventory-only:
    runs-on: ubuntu-latest
    timeout-minutes: 9
    steps:
      - uses: actions/checkout@v4
      - name: Structural 13 analysis plus 9 training and season guardrails
        run: python experiments/263/league_expansion/build_final_22x2_existing_main_research_inventory_once.py --self-test
      - name: Audit ALL ten original core league results AND existing 4505 expansion and only ESP2 new source metadata
        run: python experiments/263/league_expansion/build_final_22x2_existing_main_research_inventory_once.py --run --probe-esp2
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: 263-22x2-source-inventory-core-and-research-with-spanish-metadata
          path: experiments/263/league_expansion/22x2_full_production_plus_research_inventory_diagnostic_20261114.json
          retention-days: 14
      - name: Commit only new read-only summary not raw third-party source data
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -- experiments/263/league_expansion/22x2_full_production_plus_research_inventory_diagnostic_20261114.json
          if ! git diff --cached --quiet; then
            git commit -m "research(263): original 4617 core and 4505 extension 22x2 source count, Spanish original CC BY label only"
            git push origin HEAD:research/263-13-lig-22-havuz-20261113
          fi
