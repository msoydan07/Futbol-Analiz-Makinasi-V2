name: 263 dortlu ileri pilot - yalniz yeni kullanici mac istegi
on:
  push:
    branches: [experiment/263-toplu-karsilastirma]
    paths:
      - 'experiments/263/quad_requests/*.json'
permissions:
  contents: write
  actions: read
concurrency:
  group: quad-263-append-only
  cancel-in-progress: false
jobs:
  four-model-register:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Fixed numerical dependencies
        run: python -m pip install --disable-pip-version-check numpy==2.3.5 scipy==1.17.0
      - name: New intake-only tests (not old model acceptance)
        env:
          PYTHONPATH: experiments/263
        run: python -m unittest -v experiments/263/test_quad_request_intake.py
      - name: Identify NEW user-named requests only
        id: requests
        shell: bash
        run: |
          set -euo pipefail
          git diff-tree --no-commit-id --name-status -r HEAD -- experiments/263/quad_requests/ > /tmp/quad_delta.tsv
          if grep -Ev '^(A[[:space:]]+experiments/263/quad_requests/[A-Za-z0-9_-]+\.json|A[[:space:]]+experiments/263/quad_requests/README\.md)$' /tmp/quad_delta.tsv | grep -q .; then
            echo 'Only ADD of a fresh JSON request is permitted'; exit 1
          fi
          grep -E '^A[[:space:]]+experiments/263/quad_requests/[A-Za-z0-9_-]+\.json$' /tmp/quad_delta.tsv | cut -f2 > /tmp/quad_new_requests.txt || true
          if [ -s /tmp/quad_new_requests.txt ]; then
            test "$(wc -l < /tmp/quad_new_requests.txt)" -le 12
            echo 'has_requests=true' >> "$GITHUB_OUTPUT"
          else
            echo 'has_requests=false' >> "$GITHUB_OUTPUT"
            echo 'Bridge-only change: no fixture is invented or registered'
          fi
      - name: Retrieve immutable 4413-match baseline with SHA check
        if: steps.requests.outputs.has_requests == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p m4_quad_base
          gh run download 41251343847 --repo "$GITHUB_REPOSITORY" -n team-source-audit -D m4_quad_base
          echo '35c5e7b4e0fad45c592fd51cf094616f2ff60330ce52bcf21cd595968169f5a1  m4_quad_base/historical_results.csv' | sha256sum -c -
      - name: Single official-gated append-only B/C2/C3/M4 batch
        id: forward
        if: steps.requests.outputs.has_requests == 'true'
        continue-on-error: true
        env:
          PYTHONPATH: experiments/263
        shell: bash
        run: |
          set -euo pipefail
          python experiments/263/run_quad_requested_batch.py \
            --manifest /tmp/quad_new_requests.txt \
            --history data/quad_accepted_263/extended_history.csv \
            --baseline m4_quad_base/historical_results.csv \
            --source-acceptance data/quad_accepted_263/source_acceptance.json \
            --records forward_quad_263 \
            --report "experiments/263/quad_batch_reports/$GITHUB_SHA.json"
          python experiments/263/quad_prematch_bridge_263.py baseline \
            --report "experiments/263/quad_batch_reports/$GITHUB_SHA.json" \
            --history data/quad_accepted_263/extended_history.csv
      - name: Commit new pilot predictions or honest blocked report
        if: steps.requests.outputs.has_requests == 'true' && always()
        env:
          FORWARD_OUTCOME: ${{ steps.forward.outcome }}
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          if [ "$FORWARD_OUTCOME" = success ]; then
            python experiments/263/quad_prematch_bridge_263.py verify-baseline --report "experiments/263/quad_batch_reports/$GITHUB_SHA.json"
            git add -A -- forward_quad_263 experiments/263/quad_research_links experiments/263/quad_batch_reports
          else
            if [ -d experiments/263/quad_batch_reports ]; then git add -A -- experiments/263/quad_batch_reports; fi
          fi
          if ! git diff --cached --quiet; then
            git commit -m 'Record four-model forecast plus baseline/PAS or blocked evidence'
            if [ "$FORWARD_OUTCOME" = success ]; then
              python experiments/263/quad_prematch_bridge_263.py verify-baseline --report "experiments/263/quad_batch_reports/$GITHUB_SHA.json"
            fi
            git push origin "HEAD:$GITHUB_REF_NAME"
          fi
      - name: Preserve batch evidence
        if: steps.requests.outputs.has_requests == 'true' && always()
        uses: actions/upload-artifact@v4
        with:
          name: quad-263-forward-evidence
          if-no-files-found: warn
          path: |
            forward_quad_263/*/*.json
            experiments/263/quad_research_links/*/*/*.json
            experiments/263/quad_batch_reports/*.json
      - name: Reject zero registered predictions
        if: steps.requests.outputs.has_requests == 'true' && always()
        env:
          FORWARD_OUTCOME: ${{ steps.forward.outcome }}
        run: |
          test "$FORWARD_OUTCOME" = 'success' || {
            echo 'Batch blocked; inspect source acceptance and saved audit; no rerun without fix.'
            exit 1
          }
