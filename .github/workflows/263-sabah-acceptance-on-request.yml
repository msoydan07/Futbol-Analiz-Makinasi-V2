name: "263 gerçek 3 maç kabulü - ayrı mühür + mobil, odds kapalı"
on:
  push:
    branches: [experiment/263-toplu-karsilastirma]
    paths:
      - 'experiments/263/sabah_acceptance_requests/*.json'
permissions:
  contents: write
  actions: read
concurrency:
  group: quad-263-append-only
  cancel-in-progress: false
jobs:
  live-three-fixtures:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Fixed locked-model numerical dependencies
        run: python -m pip install --disable-pip-version-check numpy==2.3.5 scipy==1.17.0
      - name: Validate only ONE newly added named three-match request, same Turkey morning
        id: request
        shell: bash
        env:
          PYTHONPATH: .:experiments/263
        run: |
          set -euo pipefail
          git pull --ff-only origin "$GITHUB_REF_NAME"
          git diff-tree --no-commit-id --name-status -r "$GITHUB_SHA" -- experiments/263/sabah_acceptance_requests/ > /tmp/request_delta.tsv
          test "$(wc -l </tmp/request_delta.tsv)" -eq 1
          filename="$(cut -f2 /tmp/request_delta.tsv)"
          status="$(cut -f1 /tmp/request_delta.tsv)"
          test "$status" = "A"
          [[ "$filename" =~ ^experiments/263/sabah_acceptance_requests/[A-Za-z0-9_-]+\.json$ ]]
          export REQUEST_PATH="$filename"
          python - <<'PY'
          import json,os,re
          from pathlib import Path
          from datetime import datetime
          from zoneinfo import ZoneInfo
          from sabah_batch_263 import named
          source=os.environ["REQUEST_PATH"]
          payload=json.loads(Path(source).read_text(encoding="utf-8"))
          day=payload["day_turkey"]
          if not re.fullmatch(r"\d{4}-\d{2}-\d{2}",day):
              raise SystemExit("DAY_FORMAT_REJECTED")
          current=datetime.now(ZoneInfo("Europe/Istanbul"))
          if day!="2026-11-07" or day!=current.date().isoformat() or not 5<=current.hour<13:
              raise SystemExit("PAST_FUTURE_OR_NON_MORNING_ENGAGEMENT_FORBIDDEN")
          matches=named("acceptance3",day,source)
          expected={("ESP1","Valencia","Real Madrid"),
                    ("ENG1","Arsenal","Hull City"),
                    ("TUR1","Samsunspor","Konyaspor")}
          if {(x["league"],x["home"],x["away"]) for x in matches}!=expected:
              raise SystemExit("UNAUTHORIZED_OR_WRONG_THREE_FIXTURES")
          with open("/tmp/acceptance3_day","w") as f:f.write(day)
          with open("/tmp/acceptance3_request","w") as f:f.write(source)
          print("THREE_PREDECLARED_NAMED_MATCHES_APPROVED_ZERO_ODDS")
          PY
          echo "report=experiments/263/sabah_batch_reports/acceptance3_$GITHUB_RUN_ID.json" >> "$GITHUB_OUTPUT"
          echo "mobile=experiments/263/sabah_mobile_reports/acceptance3_$GITHUB_RUN_ID" >> "$GITHUB_OUTPUT"
          echo "receipt=experiments/263/sabah_acceptance_results/acceptance3_$GITHUB_RUN_ID.json" >> "$GITHUB_OUTPUT"
      - name: Fetch immutable 4,413 historical source from PINNED run
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          mkdir -p m4_quad_base
          gh run download 41251343847 --repo "$GITHUB_REPOSITORY" -n team-source-audit -D m4_quad_base
          echo '35c5e7b4e0fad45c592fd51cf094616f2ff60330ce52bcf21cd595968169f5a1  m4_quad_base/historical_results.csv' | sha256sum -c -
      - name: Exactly one live 3-match B C2 C3 M4 batch, old pilot files untouched
        shell: bash
        env:
          PYTHONPATH: .:experiments/263
          REPORT: ${{ steps.request.outputs.report }}
          MOBILE: ${{ steps.request.outputs.mobile }}
        run: |
          set -euo pipefail
          mkdir -p "$(dirname "$REPORT")"
          python experiments/263/sabah_batch_263.py \
            --cohort acceptance3 --day "$(cat /tmp/acceptance3_day)" \
            --input "$(cat /tmp/acceptance3_request)" \
            --history data/quad_accepted_263/extended_history.csv \
            --baseline m4_quad_base/historical_results.csv \
            --source-acceptance data/quad_accepted_263/source_acceptance.json \
            --report "$REPORT" --mobile /tmp/acceptance3_quick.md
          python experiments/263/sabah_mobile_screens_263.py \
            --report "$REPORT" --output-dir "$MOBILE"
      - name: Verify three real matches, honest B context failures, PAS and matching phone views before Git commit
        shell: bash
        env:
          PYTHONPATH: .:experiments/263
          REPORT: ${{ steps.request.outputs.report }}
          MOBILE: ${{ steps.request.outputs.mobile }}
          RECEIPT: ${{ steps.request.outputs.receipt }}
        run: |
          set -euo pipefail
          python experiments/263/sabah_acceptance_commit_guard_263.py \
            --report "$REPORT" --mobile "$MOBILE" --receipt "$RECEIPT"
      - name: Append-only Git commit and verify still PRE-KO before push
        id: commit
        shell: bash
        env:
          PYTHONPATH: .:experiments/263
          REPORT: ${{ steps.request.outputs.report }}
          MOBILE: ${{ steps.request.outputs.mobile }}
          RECEIPT: ${{ steps.request.outputs.receipt }}
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A -- forward_acceptance_263 \
            "experiments/263/sabah_research/acceptance3/$(cat /tmp/acceptance3_day)" \
            "$REPORT" "$MOBILE" "$RECEIPT"
          if git diff --cached --name-only | grep -E '^(forward_quad_263|forward_morning_263)/'; then
            echo "LEGACY_PILOT_MODIFICATION_REJECTED";exit 1
          fi
          test "$(git diff --cached --name-only | grep -c '^forward_acceptance_263/' || true)" -eq 3
          python experiments/263/sabah_acceptance_commit_guard_263.py \
            --report "$REPORT" --mobile "$MOBILE" --receipt "$RECEIPT" --check-existing
          git diff --cached --quiet && { echo "ZERO_NEW_RECORDS_REJECTED"; exit 1; }
          git commit -m "Seal 3 actual prematch four-model acceptance forecasts and matching phone views"
          git pull --rebase origin "$GITHUB_REF_NAME"
          python experiments/263/sabah_acceptance_commit_guard_263.py \
            --report "$REPORT" --mobile "$MOBILE" --receipt "$RECEIPT" --check-existing
          git push origin "HEAD:$GITHUB_REF_NAME"
          git fetch origin "$GITHUB_REF_NAME"
          git merge-base --is-ancestor HEAD "origin/$GITHUB_REF_NAME"
          for path in "$REPORT" "$MOBILE/summary.md" "$RECEIPT"; do
            git cat-file -e "origin/$GITHUB_REF_NAME:$path"
          done
          echo "GITHUB_COMMIT_AND_PREMATCH_RECEIPT_VERIFIED"
          echo "pushed=true" >> "$GITHUB_OUTPUT"
      - name: Evidence artifact even if blocked, never triggers an odds request
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: real-three-acceptance3-forecasts-mobile-no-odds
          retention-days: 14
          if-no-files-found: ignore
          path: |
            experiments/263/sabah_batch_reports/acceptance3_*.json
            experiments/263/sabah_acceptance_results/acceptance3_*.json
            experiments/263/sabah_mobile_reports/acceptance3_*/**/*.md
