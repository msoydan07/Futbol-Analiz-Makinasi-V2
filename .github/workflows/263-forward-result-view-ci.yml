name: 263 forward candidate and result view acceptance
on:
  push:
    branches: [experiment/263-toplu-karsilastirma]
    paths:
      - 'experiments/263/forward_decision_candidate_263.py'
      - 'experiments/263/test_forward_decision_candidate_263.py'
      - 'experiments/263/forward_decision_view_263.py'
      - 'experiments/263/test_forward_decision_view_263.py'
      - '.github/workflows/263-forward-result-view-ci.yml'
  workflow_dispatch:
jobs:
  single-batch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Test decision and guarded result view together
        run: |
          python -m unittest discover -s experiments/263 -p 'test_forward_decision_candidate_263.py' -v
          python -m unittest discover -s experiments/263 -p 'test_forward_decision_view_263.py' -v
