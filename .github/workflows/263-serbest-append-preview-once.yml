name: 263 Serbest - 4617 to 2026-11-23 append-only research stage
on:
  push:
    branches: [experiment/p0-oran-hafizasi-22-lig-20261122]
    paths:
      - '.github/workflows/263-serbest-append-preview-once.yml'
      - 'experiments/263/serbest_analiz_v2/APPEND_ONLY_4617_STAGE_V2.py'
permissions:
  contents: read
jobs:
  append_only_preview:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install existing model source parsing dependencies
        run: python -m pip install 'numpy>=1.24,<3' 'scipy>=1.10,<2'
      - name: Collect ten fresh PUBLIC completed-score CSVs - only for stage
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p provider_2026_27_20261123
          python - <<'PY'
          import hashlib, urllib.request
          from urllib.parse import urlsplit
          from pathlib import Path
          codes={'ENG1':'E0','ENG2':'E1','GER1':'D1','ESP1':'SP1','ITA1':'I1',
                 'FRA1':'F1','NED1':'N1','TUR1':'T1','POR1':'P1','BEL1':'B1'}
          for league,s in codes.items():
              url=f'https://www.football-data.co.uk/mmz4281/2627/{s}.csv'
              req=urllib.request.Request(url,headers={'User-Agent':'FootballResearchAudit/263 (append-stage, read-only)'})
              with urllib.request.urlopen(req,timeout=20) as r:
                  u=urlsplit(r.geturl());ref=urlsplit(url)
                  if r.status!=200 or u.scheme!='https' or u.hostname not in ('www.football-data.co.uk','football-data.co.uk') or u.path!=ref.path or u.query or u.fragment:
                      raise RuntimeError('UNTRUSTED_PROVIDER_REDIRECT:'+league)
                  raw=r.read(2_000_001)
              if not 1000<=len(raw)<=2_000_000:raise RuntimeError('BAD_PROVIDER_BYTES:'+league)
              Path('provider_2026_27_20261123',league+'.csv').write_bytes(raw)
              print(league,len(raw),hashlib.sha256(raw).hexdigest())
          PY
      - name: Reconcile all old 4617 IDs and scores; generate UNVERIFIED isolated stage
        shell: bash
        run: |
          set -o pipefail
          python experiments/263/serbest_analiz_v2/APPEND_ONLY_4617_STAGE_V2.py \
            --base data/results_only_263/2026-11-10_completed_4617_scores_only.csv \
            --registry experiments/263/evidence/identity_index_263.json \
            --sources-dir provider_2026_27_20261123 \
            --asof 2026-11-23 --out-dir append_preview_20261123 |& tee append_preview.log
      - if: always()
        uses: actions/upload-artifact@v4
        with:
          name: serbest-4617-append-only-unverified-stage-once
          path: |
            append_preview.log
            append_preview_20261123/*.json
            append_preview_20261123/*.csv
            provider_2026_27_20261123/*.csv
          if-no-files-found: ignore
