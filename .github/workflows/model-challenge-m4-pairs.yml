name: Model challenge - M4 and XGBoost same-fixture historical pair
on:
  push:
    branches: [research/model-challenge]
    paths: ['.github/workflows/model-challenge-m4-pairs.yml']
  workflow_dispatch:
permissions:
  actions: read
  contents: read
jobs:
  pair:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install 'numpy==2.2.6' 'scipy==1.15.3' 'xgboost==3.0.5' 'scikit-learn==1.7.2'
      - uses: actions/download-artifact@v4
        with:
          name: model-challenge-pinned-20league-archive
          run-id: 42532602610
          github-token: ${{ secrets.GITHUB_TOKEN }}
          path: ${{ runner.temp }}/archive
      - name: Reconstruct M4 as-of and XGB same-fixture 2026-27 retrospective pairs
        run: python research/model_challenge/m4_xgb_retro_pairs.py --input "$RUNNER_TEMP/archive/normalized_matches.csv" --lock experiments/263/m4_lock.json --out "$RUNNER_TEMP/pairs/m4_xgb_pairs.json"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: model-challenge-m4-xgb-retrospective-pairs
          path: ${{ runner.temp }}/pairs/
          retention-days: 30
          if-no-files-found: warn
