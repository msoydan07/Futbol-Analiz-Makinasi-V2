name: Model challenge - accepted-history XGB full synthetic integration
on:
  push:
    branches: [research/model-challenge]
    paths:
      - '.github/workflows/model-challenge-263-xgb-integration.yml'
      - 'research/model_challenge/test_263_live_pipeline.py'
      - 'research/model_challenge/trusted_263_snapshot_bridge.py'
      - 'research/model_challenge/official_263_fixture_bridge.py'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  integrate:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install frozen ML dependencies
        run: python -m pip install 'numpy==2.2.6' 'xgboost==3.0.5' 'scikit-learn==1.7.2' 'scipy==1.15.3'
      - name: Real 4518-score archive and explicitly synthetic future fixture end-to-end
        run: python -m unittest discover -s research/model_challenge -p 'test_263_live_pipeline.py' -v
      - name: Do not touch 2.6.3
        run: git diff --exit-code -- data/quad_accepted_263 experiments/263 forward_morning_263 forward_quad_263
