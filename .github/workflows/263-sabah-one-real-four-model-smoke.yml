name: "263 tek gercek mac - 4 model kuru calistirma - oran yok"
on:
  push:
    branches: [experiment/263-toplu-karsilastirma]
    paths:
      - 'experiments/263/sabah_one_real_four_model_smoke_263.py'
      - '.github/workflows/263-sabah-one-real-four-model-smoke.yml'
permissions:
  contents: read
  actions: read
jobs:
  one-actual-nonpilot:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Numerical packages for locked B C2 C3 M4 only
        run: python -m pip install --disable-pip-version-check numpy==2.3.5 scipy==1.17.0
      - name: Download immutable historical baseline artifact - no network odds
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p m4_quad_base
          gh run download 41251343847 --repo "$GITHUB_REPOSITORY" \
            -n team-source-audit -D m4_quad_base
          echo '35c5e7b4e0fad45c592fd51cf094616f2ff60330ce52bcf21cd595968169f5a1  m4_quad_base/historical_results.csv' | sha256sum -c -
      - name: One real Valencia-Real Madrid four-model experimental research test
        shell: bash
        env:
          PYTHONPATH: .:experiments/263
        run: |
          set -euo pipefail
          day="$(TZ=Europe/Istanbul date +%Y-%m-%d)"
          if [ "$day" != "2026-11-07" ]; then
            echo 'TODAY_NOT_PREDECLARED_DAY; no retroactive engine forecasts'
            exit 1
          fi
          python experiments/263/sabah_one_real_four_model_smoke_263.py \
            --out /tmp/263-one-real-smoke.json
      - name: Archive diagnostic research evidence only - not the 96 match pilot
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: one-real-four-model-research-smoke-not-pilot
          retention-days: 10
          if-no-files-found: ignore
          path: /tmp/263-one-real-smoke.json
