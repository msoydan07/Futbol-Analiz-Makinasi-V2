name: "263 team strength 4617 unseen club and home away coverage audit"
on:
  push:
    branches: [research/263-team-coverage-risk-audit-20261111]
    paths:
      - 'research/team_strength/team_coverage_audit_263.py'
      - 'research/team_strength/test_team_coverage_audit_263.py'
      - '.github/workflows/263-team-strength-coverage-4617-readonly-ci.yml'
permissions:
  contents: read
jobs:
  ten-league-coverage-readonly:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Existing numerical requirements only
        run: python -m pip install --disable-pip-version-check numpy==2.3.5 scipy==1.17.0
      - name: Pin immutable original, score-only and M4 code hashes
        shell: bash
        run: |
          set -euo pipefail
          echo '1170ecf9bdc31426e80a069cfc63d7112d0ab0c0c7d527e3bb5daf9b3841ece9  data/quad_accepted_263/extended_history.csv' | sha256sum -c -
          echo '637b8597ac5bf479934a0b66aaed726b5fc30c20d9a5e9b4a770913cf9d68a89  data/results_only_263/2026-11-10_completed_4617_scores_only.csv' | sha256sum -c -
          echo 'eac755e54086738f40d7f30a514b2c9bb789b2c428ffef4ee70bb2fd2b49bc45  experiments/263/m4_integrated.py' | sha256sum -c -
      - name: Run all nine coverage, unseen M4 fallback and leakage tests
        env:
          PYTHONPATH: ".:experiments/263:research/team_strength"
        run: python -m unittest -v research/team_strength/test_team_coverage_audit_263.py
      - name: Produce actual ten-league 4617 team risk census
        env:
          PYTHONPATH: ".:experiments/263:research/team_strength"
        run: python research/team_strength/team_coverage_audit_263.py --asof 2026-11-11 --out /tmp/263-team-strength-coverage-audit.json
      - name: Retain complete flagged team IDs and league counts without training changes
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: 263-team-strength-10league-4617-coverage-risk-research-readonly
          path: /tmp/263-team-strength-coverage-audit.json
          retention-days: 30
          if-no-files-found: warn
