name: "263 main choice layer frozen M4 MS vs KG and O25 research"
on:
  push:
    branches: [research/263-independent-math-audit]
    paths:
      - ".github/workflows/263-independent-main-choice.yml"
  workflow_dispatch:
permissions:
  contents: write
  actions: read
jobs:
  main-choice:
    runs-on: ubuntu-latest
    timeout-minutes: 85
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Pinned numerical tools and source validation
        run: |
          set -euo pipefail
          python -m pip install --disable-pip-version-check numpy==2.3.5 scipy==1.17.0 scikit-learn==1.7.2
          python -m py_compile research/263_independent_audit/audit_main_choice_layer.py
      - name: Download immutable original 4413 league match source
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          mkdir -p m4_quad_base
          gh run download 41251343847 --repo "$GITHUB_REPOSITORY" -n team-source-audit -D m4_quad_base
          echo '35c5e7b4e0fad45c592fd51cf094616f2ff60330ce52bcf21cd595968169f5a1  m4_quad_base/historical_results.csv' | sha256sum -c -
      - name: Rebuild prior-day original 880 evaluation
        run: |
          set -euo pipefail
          PYTHONPATH=.:experiments/263 python experiments/263/chrono_goal_decision_263.py \
            --source m4_quad_base/historical_results.csv \
            --report /tmp/263_main_choice_report.json \
            --predictions /tmp/263_main_choice_preds.csv
      - name: Apply exact M4 August joint goal calibration to historical M4 lambda
        run: |
          set -euo pipefail
          PYTHONPATH=.:experiments/263:research/263_independent_audit python research/263_independent_audit/audit_main_choice_layer.py \
            --history m4_quad_base/historical_results.csv \
            --predictions /tmp/263_main_choice_preds.csv \
            --outdir research/263_independent_audit
          test -s research/263_independent_audit/12_main_choice_layer_result.json
          test -s research/263_independent_audit/13_main_choice_layer_report.md
      - name: Upload evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: 263-main-choice-calibrated-MS-audit
          retention-days: 45
          if-no-files-found: ignore
          path: |
            research/263_independent_audit/12_main_choice_layer_result.json
            research/263_independent_audit/13_main_choice_layer_report.md
      - name: Production protection
        run: |
          set -euo pipefail
          git diff --exit-code origin/experiment/263-toplu-karsilastirma -- experiments/263/m4_integrated.py experiments/263/exp_263_batch.py experiments/263/model_first_decision_263.py experiments/263/model_first_selection_lock_20261120_normal_v3.json data/results_only_263 forward_morning_263 forward_quad_263
      - name: Archive research only
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add research/263_independent_audit/12_main_choice_layer_result.json research/263_independent_audit/13_main_choice_layer_report.md
          git commit -m "research(263): main choice layer calibrated MS results [skip ci]"
          git push origin HEAD:research/263-independent-math-audit

# Re-run after canonical fixture-id loader correction.
# Re-run with corrected nested M4 markets schema.
