name: "263 private 4618 and model-first PDF integration (research only)"
on:
  push:
    branches:
      - research/263-13-lig-22-havuz-20261113
    paths:
      - "experiments/263/private_4618_*.py"
      - "experiments/263/test_private_4618_live_integration_contract_263.py"
      - "experiments/263/test_private_4618_retry_guard_263.py"
      - ".github/workflows/263-private-4618-model-first-integration-ci.yml"
  workflow_dispatch:
permissions:
  contents: read
jobs:
  4618-pipeline-contract:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Compile without any private history or live odds
        run: |
          python -m py_compile \
            experiments/263/private_4618_provider_bundle_263.py \
            experiments/263/private_4618_quad_forward_263.py \
            experiments/263/private_4618_empirical_baseline_263.py \
            experiments/263/private_4618_pdf_session_263.py \
            experiments/263/private_4618_iddaa_model_first_one_step_263.py \
            experiments/263/private_4618_retry_guard_263.py
      - name: Run source/receipt/model isolation tests
        env:
          PYTHONPATH: experiments/263
        run: |
          python -m unittest -v test_private_4618_live_integration_contract_263 test_private_4618_retry_guard_263
      - name: Import actual original math functions and private 4618 adapter
        run: |
          python -m pip install "numpy>=1.26,<3" "scipy>=1.11,<2" "reportlab>=4,<5" "pymupdf>=1.24,<2"
          PYTHONPATH=.:experiments/263 python - <<'PY'
          from private_4618_quad_forward_263 import predict_quad_from_verified_gate
          from private_4618_empirical_baseline_263 import produce
          from private_4618_pdf_session_263 import run_session
          from private_4618_iddaa_model_first_one_step_263 import one_step
          from m4_integrated import fit_m4, predict_m4
          assert all(callable(x) for x in (
              predict_quad_from_verified_gate,produce,run_session,one_step,fit_m4,predict_m4))
          print("RESEARCH IMPORTS LINKED; NO REAL PRIVATE DATA OR PDF RUN")
          PY
      - name: Verify original production model source untouched in this change
        run: |
          python - <<'PY'
          from pathlib import Path
          o=Path("experiments/263/forward_quad.py").read_text()
          p=Path("experiments/263/private_4618_quad_forward_263.py").read_text()
          assert 'PILOT_GOAL=96' in o
          assert 'PILOT_GOAL=300' in p
          assert "from private_4618_provider_bundle_263 import inspect_witness" in p
          assert 'from private_4618_quad_forward_263 import predict_quad_from_verified_gate' in Path("experiments/263/private_4618_pdf_session_263.py").read_text()
          print("OLD M4/QUAD UNMODIFIED; PRIVATE MODE ONLY")
          PY
