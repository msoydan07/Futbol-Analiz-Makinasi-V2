name: "263 real sealed M4 goal error and pregame rival strength -- no refit"
on:
  push:
    branches:
      - research/263-staged99-evidence-join-20261110
    paths:
      - 'research/opponent_goals/m4_sealed_goal_error_matchup_263.py'
      - 'research/opponent_goals/test_m4_sealed_goal_error_matchup_263.py'
      - '.github/workflows/263-actual-sealed-goal-error-diagnostic.yml'
permissions:
  contents: write
jobs:
  bounded_nov8_40_sha:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Independent real SHA-sealed 40, postponed and paired market error checks
        run: python research/opponent_goals/test_m4_sealed_goal_error_matchup_263.py
      - name: One transparent, no-refit M4 goal error and strength diagnosis
        run: |
          python research/opponent_goals/m4_sealed_goal_error_matchup_263.py \
            --root . \
            --out research/opponent_goals/reports/sealed_nov8_goal_error_and_strength_20261110.json
      - name: Archive only new result, original seals and training unchanged
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add research/opponent_goals/reports/sealed_nov8_goal_error_and_strength_20261110.json
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "Research: real Nov 8 sealed goal errors by opponent strength and league, no model refit [skip ci]"
          git push origin HEAD:research/263-staged99-evidence-join-20261110
