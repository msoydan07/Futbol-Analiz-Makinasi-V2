name: Ilk yari korner kimlik eslestirme piloti
on:
  workflow_dispatch:
  push:
    branches: [feature/01-kimlikler]
    paths:
      - '.github/workflows/first-half-corners-identity.yml'
jobs:
  identity:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Tarihsel kimlik ve sonuc tablosunu hazirla
        run: |
          python collect_team_candidates.py
          python prepare_team_identity_review.py
          python audit_season_membership.py
          python import_provisional_teams.py
          python prepare_official_name_review.py
          python apply_official_team_names.py
          python verify_official_mappings.py
          python audit_identity_integrity.py
          python audit_fixture_candidates.py
          python import_real_fixtures.py
          python audit_result_quality.py
          python build_historical_results.py
      - name: Salt okunur ilk yari korner eslestirme raporu
        run: python pilot_first_half_corner_identity.py
      - name: Raporu sakla
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: first-half-corner-identity
          path: |
            data/first_half_corner_match_pilot.json
            data/historical_results_audit.json
          if-no-files-found: warn

