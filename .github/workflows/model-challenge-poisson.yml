name: Model challenge - independent Poisson versus Elo
on:
  push:
    branches: [research/model-challenge]
    paths: ['.github/workflows/model-challenge-poisson.yml']
  workflow_dispatch:
permissions:
  actions: read
  contents: read
jobs:
  benchmark:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Offline independent model unit tests
        run: python -m unittest discover -s research/model_challenge -p 'test_*.py' -v
      - uses: actions/download-artifact@v4
        with:
          name: model-challenge-pinned-20league-archive
          run-id: 42532602610
          github-token: ${{ secrets.GITHUB_TOKEN }}
          path: ${{ runner.temp }}/source
      - uses: actions/download-artifact@v4
        with:
          name: model-challenge-elo-initial-diagnostics
          run-id: 42532664152
          github-token: ${{ secrets.GITHUB_TOKEN }}
          path: ${{ runner.temp }}/elo
      - name: Run predeclared Poisson grid on dev and paired diagnostics
        run: python research/model_challenge/poisson_challenger.py --input "$RUNNER_TEMP/source/normalized_matches.csv" --elo "$RUNNER_TEMP/elo/elo_predictions.csv" --out "$RUNNER_TEMP/poisson/poisson_predictions.csv"
      - uses: actions/upload-artifact@v4
        with:
          name: model-challenge-poisson-paired-elo-diagnostics
          path: ${{ runner.temp }}/poisson/
          retention-days: 30
