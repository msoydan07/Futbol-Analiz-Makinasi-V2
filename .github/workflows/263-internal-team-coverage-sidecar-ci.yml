name: "263 private team coverage sidecar math unchanged integration CI"
on:
  push:
    branches: [experiment/263-toplu-karsilastirma]
    paths:
      - 'research/team_strength/team_coverage_audit_263.py'
      - 'research/team_strength/test_team_coverage_audit_263.py'
      - 'research/team_strength/sabah_internal_coverage_sidecar_263.py'
      - 'research/team_strength/test_sabah_internal_coverage_sidecar_263.py'
      - '.github/workflows/263-sabah-new100-on-request.yml'
      - '.github/workflows/263-internal-team-coverage-sidecar-ci.yml'
permissions:
  contents: read
jobs:
  historical-context-only-not-display:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Existing model dependencies - immutable M4
        run: python -m pip install --disable-pip-version-check numpy==2.3.5 scipy==1.17.0
      - name: Verify frozen 4518, 4617 and M4 checksums
        shell: bash
        run: |
          set -euo pipefail
          echo '1170ecf9bdc31426e80a069cfc63d7112d0ab0c0c7d527e3bb5daf9b3841ece9  data/quad_accepted_263/extended_history.csv' | sha256sum -c -
          echo '637b8597ac5bf479934a0b66aaed726b5fc30c20d9a5e9b4a770913cf9d68a89  data/results_only_263/2026-11-10_completed_4617_scores_only.csv' | sha256sum -c -
          echo 'eac755e54086738f40d7f30a514b2c9bb789b2c428ffef4ee70bb2fd2b49bc45  experiments/263/m4_integrated.py' | sha256sum -c -
      - name: Test 10-league real data, fake receipts, SHA, unseen clubs and silent output
        env:
          PYTHONPATH: .:experiments/263:research/team_strength
        run: |
          python -m unittest -v \
            research/team_strength/test_team_coverage_audit_263.py \
            research/team_strength/test_sabah_internal_coverage_sidecar_263.py
          git diff --quiet
          git diff --cached --quiet
