name: "263 iddaa PDF private M4 xG safety"
on:
  push:
    branches:
      - research/263-iddaa-pdf-private-xg-20261119
  pull_request:
    branches:
      - experiment/263-toplu-karsilastirma
  workflow_dispatch:
permissions:
  contents: read
jobs:
  pdf-xg:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install numerical dependencies
        run: python -m pip install --disable-pip-version-check numpy==2.3.5 scipy==1.17.0
      - name: Syntax check
        run: |
          python -m py_compile experiments/263/iddaa_pdf_session_263.py
          python -m py_compile experiments/263/test_iddaa_pdf_private_xg_263.py
      - name: PDF baseline and private xG bridge regression
        env:
          PYTHONPATH: .:experiments/263
        run: |
          python -m unittest -v \
            experiments/263/test_iddaa_pdf_session_263.py \
            experiments/263/test_iddaa_pdf_private_xg_263.py \
            experiments/263/test_m4_xg_support_263.py \
            experiments/263/test_m4_xg_sidecar_io_263.py
