name: 263 Piyasa besinci referans - tek izole kabul
on:
  push:
    branches: [experiment/263-toplu-karsilastirma]
    paths:
      - 'experiments/263/market_fifth_baseline_263.py'
      - 'experiments/263/test_market_fifth_baseline_263.py'
      - '.github/workflows/263-market-fifth-baseline-ci.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  market-fifth-synthetic-acceptance:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Fixed numerical dependencies for locked forward model import only
        run: python -m pip install --disable-pip-version-check numpy==2.3.5 scipy==1.17.0
      - name: Single new test suite - NEVER a live odds quote
        env:
          PYTHONPATH: experiments/263
        shell: bash
        run: |
          set -euo pipefail
          python -m unittest -v experiments/263/test_market_fifth_baseline_263.py
