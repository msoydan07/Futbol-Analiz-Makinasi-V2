name: "263 historical probability reliability - research gate"
on:
  push:
    branches: [experiment/263-toplu-karsilastirma]
    paths:
      - experiments/263/historical_probability_reliability_263.py
      - experiments/263/test_historical_probability_reliability_263.py
      - docs/263_AKTIF_KARARLAR.json
permissions:
  contents: read
jobs:
  probability-reference:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Synthetic probability-bin and leakage regression
        env:
          PYTHONPATH: experiments/263
        run: python -m unittest -v experiments/263/test_historical_probability_reliability_263.py
