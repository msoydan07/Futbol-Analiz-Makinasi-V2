name: 263 UEFA one-shot transport differential diagnostic
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  diagnostic-only-on-explicit-request:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python experiments/263/europe/uefa_network_diagnostics_263.py
