name: "263 actual SHA sealed pilot B C2 C3 M4 equal-match KG O25 MS audit"
on:
  push:
    branches: [research/263-sealed-legacy96-paired-market-audit-20261111]
    paths:
      - 'research/model_selection/legacy96_sealed_4model_market_pair_audit_263.py'
      - 'research/model_selection/test_legacy96_sealed_4model_market_pair_audit_263.py'
      - '.github/workflows/263-sealed-legacy96-paired-market-decision-audit-ci.yml'
permissions:
  contents: read
jobs:
  frozen-legacy-pilot-exact-sha-join-once:
    runs-on: ubuntu-latest
    timeout-minutes: 14
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Exact preexisting frozen model mathematical requirements
        run: python -m pip install --disable-pip-version-check numpy==2.3.5 scipy==1.17.0
      - name: Verify no mutated 4518 or 4617 archived files
        shell: bash
        run: |
          set -euo pipefail
          echo '1170ecf9bdc31426e80a069cfc63d7112d0ab0c0c7d527e3bb5daf9b3841ece9  data/quad_accepted_263/extended_history.csv' | sha256sum -c -
          echo '637b8597ac5bf479934a0b66aaed726b5fc30c20d9a5e9b4a770913cf9d68a89  data/results_only_263/2026-11-10_completed_4617_scores_only.csv' | sha256sum -c -
          echo 'eac755e54086738f40d7f30a514b2c9bb789b2c428ffef4ee70bb2fd2b49bc45  experiments/263/m4_integrated.py' | sha256sum -c -
      - name: Frozen SHA / exact identity / market Brier / no retrospective guesses tests
        env:
          PYTHONPATH: ".:experiments/263:research/model_selection"
        run: python -m unittest -v research/model_selection/test_legacy96_sealed_4model_market_pair_audit_263.py
      - name: Run one actual three-cohort four-model sealed market outcome audit
        env:
          PYTHONPATH: ".:experiments/263:research/model_selection"
        run: python research/model_selection/legacy96_sealed_4model_market_pair_audit_263.py --out /tmp/263_sealed_actual_pilot_models_markets_once.json
      - name: Confirm ZERO modified old SHA, model, source, quotes, or mobile files
        run: |
          git diff --quiet
          git diff --cached --quiet
      - name: Keep full match by match SHA model market audit research only
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: actual-sealed-legacy96-cohorts-4model-btts-over25-ms-only-research
          retention-days: 30
          if-no-files-found: warn
          path: /tmp/263_sealed_actual_pilot_models_markets_once.json
