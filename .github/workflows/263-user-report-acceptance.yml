name: 263 user friendly single and batch report acceptance - one batch
on:
  push:
    branches: [experiment/263-toplu-karsilastirma]
    paths:
      - 'experiments/263/quad_user_report_263.py'
      - 'experiments/263/test_quad_user_report_263.py'
      - '.github/workflows/263-user-report-acceptance.yml'
permissions:
  contents: read
jobs:
  one-presentation-test:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install --disable-pip-version-check numpy==2.3.5 scipy==1.17.0
      - name: One synthetic multi-match and single-match presentation acceptance
        env:
          PYTHONPATH: experiments/263
        run: python -m unittest -v experiments/263/test_quad_user_report_263.py
