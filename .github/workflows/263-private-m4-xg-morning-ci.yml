name: "263 private M4 xG morning integration safety"
on:
  push:
    branches:
      - research/263-operational-xg-private-bridge-20261119
    paths:
      - 'experiments/263/m4_xg_support_263.py'
      - 'experiments/263/sabah_batch_263.py'
      - 'experiments/263/test_m4_xg_*263.py'
      - '.github/workflows/263-private-m4-xg-morning-ci.yml'
  pull_request:
    branches:
      - experiment/263-toplu-karsilastirma
  workflow_dispatch:
permissions:
  contents: read
jobs:
  safety:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install immutable M4 numerical dependencies
        run: python -m pip install --disable-pip-version-check numpy==2.3.5 scipy==1.17.0
      - name: Syntax checks (no private data)
        run: |
          python -m py_compile experiments/263/m4_xg_support_263.py
          python -m py_compile experiments/263/sabah_batch_263.py
          python -m py_compile experiments/263/test_m4_xg_private_morning_263.py
      - name: Time, identity, source and immutable M4 checks
        env:
          PYTHONPATH: .:experiments/263
        run: |
          python -m unittest -v \
            experiments/263/test_m4_xg_support_263.py \
            experiments/263/test_m4_xg_sidecar_io_263.py \
            experiments/263/test_m4_xg_private_morning_263.py \
            experiments/263/test_sabah_workflow_263.py
