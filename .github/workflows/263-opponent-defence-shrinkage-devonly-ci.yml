name: "263 M4 opponent defence sharpness same-game KG O25 MS DEV-only"
on:
  push:
    branches: [research/263-opponent-defence-shrinkage-20261111]
    paths:
      - 'research/opponent_goals/m4_opponent_defence_shrinkage_263.py'
      - 'research/opponent_goals/test_m4_opponent_defence_shrinkage_263.py'
      - '.github/workflows/263-opponent-defence-shrinkage-devonly-ci.yml'
permissions:
  contents: read
jobs:
  read-only-10-league-four-candidate-batch:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install pinned unchanged numerical dependencies
        run: python -m pip install --disable-pip-version-check numpy==2.3.5 scipy==1.17.0
      - name: Check original data, added 99 scores, and frozen M4 have identical hashes
        shell: bash
        run: |
          set -euo pipefail
          echo '1170ecf9bdc31426e80a069cfc63d7112d0ab0c0c7d527e3bb5daf9b3841ece9  data/quad_accepted_263/extended_history.csv' | sha256sum -c -
          echo '637b8597ac5bf479934a0b66aaed726b5fc30c20d9a5e9b4a770913cf9d68a89  data/results_only_263/2026-11-10_completed_4617_scores_only.csv' | sha256sum -c -
          echo 'eac755e54086738f40d7f30a514b2c9bb789b2c428ffef4ee70bb2fd2b49bc45  experiments/263/m4_integrated.py' | sha256sum -c -
      - name: Eight unit tests without repeatedly rerunning M4 fits
        env:
          PYTHONPATH: ".:experiments/263:research/opponent_goals"
        run: python -m unittest -v research/opponent_goals/test_m4_opponent_defence_shrinkage_263.py
      - name: Run one genuine 10 league batch on historical DEV-only fixed folds
        env:
          PYTHONPATH: ".:experiments/263:research/opponent_goals"
        run: python research/opponent_goals/m4_opponent_defence_shrinkage_263.py --out /tmp/263_opponent_defence_shrinkage_full_10league.json
      - name: Ensure no changed source, model coefficients, markets or SHA seals
        run: |
          git diff --quiet
          git diff --cached --quiet
      - name: Archive actual paired market differences and date clustered intervals
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: 263-opponent-defence-weight-90-80-kg-o25-ms-devonly-no-promotion
          path: /tmp/263_opponent_defence_shrinkage_full_10league.json
          retention-days: 30
          if-no-files-found: warn
