name: 263 Nov 21 fifty prematch SHA inventory for postmatch scoring
on:
  push:
    branches:
      - experiment/20261122-nov21-50-postmatch-audit
    paths:
      - experiments/263/nov21_50_frozen_readonly_inventory_263.py
      - .github/workflows/263-nov21-50-frozen-inventory-readonly.yml
  workflow_dispatch:
permissions:
  contents: read
jobs:
  inventory-only:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Verify 50 pre-KO forecast, baseline and decision SHAs and 12 second-PDF notes
        run: python experiments/263/nov21_50_frozen_readonly_inventory_263.py
      - name: Upload immutable extracted inspection copy, NOT overwrite the underlying seals
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: nov21-50-frozen-sha-readonly-inventory
          path: /tmp/nov21_fifty_frozen_inventory.json
          if-no-files-found: warn
          retention-days: 21
