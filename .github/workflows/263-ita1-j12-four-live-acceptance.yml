name: "263 ITA1 21-Nov Serie A official J12 four fixtures"
on:
  push:
    branches: [fix/263-ita1-j12-legaofficial-20261121]
  pull_request:
    branches: [experiment/263-toplu-karsilastirma]
permissions:
  contents: read
jobs:
  official-j12:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Strict official source parser and previous official gates
        env:
          PYTHONPATH: .:experiments/263
        run: |
          set -euo pipefail
          python -m unittest -v experiments/263/test_ita1_j12_official_four_263.py experiments/263/test_sabah_official_fixture_gateway_263.py
      - name: Live fetch from Lega Serie A J12 official news requires exactly four pregame times
        env:
          PYTHONPATH: .:experiments/263
        run: |
          set -euo pipefail
          python - <<'PY'
          from official_page_lookup_263 import SOURCES,_default_fetch,parse_official_events
          u=SOURCES['ITA1'][0]
          url,html=_default_fetch(u,'ITA1')
          events=parse_official_events('ITA1',html,parser=SOURCES['ITA1'][2])
          actual={(e['home'],e['away'],e['kickoff_utc']) for e in events}
          need={
            ('Como','Cagliari','2026-11-21T14:00:00+00:00'),
            ('Lazio','Lecce','2026-11-21T14:00:00+00:00'),
            ('Parma','Roma','2026-11-21T17:00:00+00:00'),
            ('Napoli','Torino','2026-11-21T19:45:00+00:00')}
          print('OFFICIAL_URL',url,'EXPLICIT_EVENTS',sorted(actual))
          assert need.issubset(actual),'SOURCE_DOES_NOT_EXPLICITLY_CONFIRM_FOUR'
          PY
      - name: Protect M4 C3 core old sealed SHA and history
        run: |
          set -euo pipefail
          git fetch --quiet origin experiment/263-toplu-karsilastirma
          git diff --exit-code origin/experiment/263-toplu-karsilastirma -- \
            experiments/263/m4_integrated.py experiments/263/model_first_decision_263.py \
            experiments/263/model_first_selection_lock_20261121_v4.json \
            data/results_only_263 forward_morning_263
