name: Nov22 23 original PDF matches independent official evidence before kickoff
on:
  push:
    branches:
      - experiment/20261122-prematch-official-23-audit
    paths:
      - experiments/263/nov22_23_source_audit_before_kickoff.py
      - .github/workflows/263-nov22-23-prematch-original-official-evidence.yml
  workflow_dispatch:
permissions:
  contents: read
jobs:
  source-before-kickoff-only:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Official Italian PDF reader when available
        run: python -m pip install --disable-pip-version-check PyMuPDF==1.26.5
      - name: Verify only still-future fixtures live, no fake original PDF seal
        env:
          PYTHONPATH: .:experiments/263
        run: python experiments/263/nov22_23_source_audit_before_kickoff.py
      - name: Preserve source evidence and exclusions
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: nov22-23-source-verification-utc-audit
          path: /tmp/20261122_23_match_original_official_source_evidence.json
          if-no-files-found: warn
          retention-days: 30
