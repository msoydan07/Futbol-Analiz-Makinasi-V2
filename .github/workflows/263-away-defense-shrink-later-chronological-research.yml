name: "263 away defence shrink 2025-26 later time block, locked M4"
on:
  push:
    branches: [research/263-away-defence-shrink-timeholdout-20261111]
    paths:
      - 'research/opponent_goals/m4_away_defense_shrink_laterperiod_263.py'
      - 'research/opponent_goals/test_m4_away_defense_shrink_laterperiod_263.py'
      - '.github/workflows/263-away-defense-shrink-later-chronological-research.yml'
permissions:
  contents: read
jobs:
  chrono-later-10league-kg-o25-ms-no-promotion:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Frozen M4 numerical requirements
        run: python -m pip install --disable-pip-version-check numpy==2.3.5 scipy==1.17.0
      - name: Verify 4518 4617 and original M4 SHA
        shell: bash
        run: |
          set -euo pipefail
          echo '1170ecf9bdc31426e80a069cfc63d7112d0ab0c0c7d527e3bb5daf9b3841ece9  data/quad_accepted_263/extended_history.csv' | sha256sum -c -
          echo '637b8597ac5bf479934a0b66aaed726b5fc30c20d9a5e9b4a770913cf9d68a89  data/results_only_263/2026-11-10_completed_4617_scores_only.csv' | sha256sum -c -
          echo 'eac755e54086738f40d7f30a514b2c9bb789b2c428ffef4ee70bb2fd2b49bc45  experiments/263/m4_integrated.py' | sha256sum -c -
      - name: Run nine frozen-formula and later-only chronological regression tests
        env:
          PYTHONPATH: '.:experiments/263:research/opponent_goals'
        run: python -m unittest -v research/opponent_goals/test_m4_away_defense_shrink_laterperiod_263.py
      - name: Produce single ten-league, same-game KG O25 MS matched output
        env:
          PYTHONPATH: '.:experiments/263:research/opponent_goals'
        run: python research/opponent_goals/m4_away_defense_shrink_laterperiod_263.py --out /tmp/263_away_defense_2025_26_later_period.json
      - name: Preserve evidence without altering existing model or forecasts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: 263-away-defense-shrink-0p75-0p5-later-only-10leagues
          path: /tmp/263_away_defense_2025_26_later_period.json
          retention-days: 30
          if-no-files-found: warn
