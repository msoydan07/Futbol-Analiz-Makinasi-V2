name: 263 Serbest Analiz V2 — moduler test ve tek mac oncesi kayit
on:
  push:
    branches: [experiment/p0-oran-hafizasi-22-lig-20261122]
    paths:
      - 'experiments/263/serbest_analiz_v2/**'
      - '.github/workflows/263-serbest-analiz-v2.yml'
  workflow_dispatch:
    inputs:
      league:
        description: '10 ligden biri: TUR1, ENG1, GER1, vb.'
        type: choice
        required: true
        options: [TUR1, ENG1, ENG2, GER1, ESP1, ITA1, FRA1, NED1, POR1, BEL1]
      home:
        description: 'Ev sahibi (resmi fiksturdeki adi)'
        required: true
        type: string
      away:
        description: 'Deplasman (resmi fiksturdeki adi)'
        required: true
        type: string
permissions:
  contents: write
concurrency:
  group: serbest-v2-${{ github.ref }}
  cancel-in-progress: false
jobs:
  regression:
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install only numerical runtime dependencies
        run: python -m pip install 'numpy>=1.24,<3' 'scipy>=1.10,<2' 'pymupdf>=1.23,<2'
      - name: 9 hard gate regression tests (no fabricated real fixture)
        working-directory: experiments/263/serbest_analiz_v2
        run: python TEST_GUNLUK_KAPI_V2.py
      - name: Compile independent modules
        run: python -m compileall -q experiments/263/serbest_analiz_v2
  named_before_kickoff:
    if: github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          ref: experiment/p0-oran-hafizasi-22-lig-20261122
          fetch-depth: 0
          persist-credentials: true
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install independent M4 C3 math dependencies
        run: python -m pip install 'numpy>=1.24,<3' 'scipy>=1.10,<2' 'pymupdf>=1.23,<2'
      - name: Official independent named fixture check + actual fresh historical M4 C3
        env:
          REQUEST_LEAGUE: ${{ inputs.league }}
          REQUEST_HOME: ${{ inputs.home }}
          REQUEST_AWAY: ${{ inputs.away }}
        shell: bash
        run: |
          set -euo pipefail
          python experiments/263/serbest_analiz_v2/GUNLUK_SERBEST_ANALIZ_KAPISI_V2.py \
            --league "$REQUEST_LEAGUE" --home "$REQUEST_HOME" --away "$REQUEST_AWAY" \
            --rule experiments/263/serbest_analiz_v2/hakem_karar_kurali_v1.json \
            --engine-root . \
            --history data/results_only_263/2026-11-10_completed_4617_scores_only.csv \
            --registry experiments/263/evidence/identity_index_263.json \
            --out-dir experiments/263/serbest_analiz_v2/official_receipts
      - name: Recheck KO before committing -- no backfilled match forecasts
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import json,datetime as dt,glob
          paths=glob.glob('experiments/263/serbest_analiz_v2/official_receipts/*.json')
          if len(paths)!=1:raise SystemExit('EXPECTED_EXACTLY_ONE_NEW_RECEIPT')
          doc=json.load(open(paths[0],encoding='utf-8'))
          ko=dt.datetime.fromisoformat(doc['kickoff_utc'])
          now=dt.datetime.now(dt.timezone.utc)
          if ko.tzinfo is None or not now<ko:raise SystemExit('KICKOFF_REACHED_BEFORE_COMMIT')
          if not dt.datetime.fromisoformat(doc['observed_at_utc'])<ko:raise SystemExit('NOT_PREKO')
          print('OFFICIAL_PREKO_RECHECK_OK',paths[0])
          PY
      - name: Commit newly created immutable research receipt before KO
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'serbest-analiz-v2[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -- experiments/263/serbest_analiz_v2/official_receipts/
          test -n "$(git diff --cached --name-only)"
          git commit -m 'research: independent M4/C3 named pre-kickoff recorded with official gate'
          git push origin HEAD:experiment/p0-oran-hafizasi-22-lig-20261122
