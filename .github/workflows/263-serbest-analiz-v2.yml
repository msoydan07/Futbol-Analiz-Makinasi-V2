name: 263 Serbest Analiz V2 — moduler test ve tek mac oncesi kayit
on:
  push:
    branches: [experiment/p0-oran-hafizasi-22-lig-20261122]
    paths:
      - 'experiments/263/serbest_analiz_v2/**'
      - '.github/workflows/263-serbest-analiz-v2.yml'
  workflow_dispatch:
    inputs:
      league:
        description: '10 ligden biri: TUR1, ENG1, GER1, vb.'
        type: choice
        required: true
        options: [TUR1, ENG1, ENG2, GER1, ESP1, ITA1, FRA1, NED1, POR1, BEL1]
      home:
        description: 'Ev sahibi (resmi fiksturdeki adi)'
        required: true
        type: string
      away:
        description: 'Deplasman (resmi fiksturdeki adi)'
        required: true
        type: string
permissions:
  contents: write
concurrency:
  group: serbest-v2-preko-${{ github.ref }}
  cancel-in-progress: false
jobs:
  regression:
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install only numerical runtime dependencies
        run: python -m pip install 'numpy>=1.24,<3' 'scipy>=1.10,<2' 'pymupdf>=1.23,<2'
      - name: 23 gate, append-only receipt and new research data provenance regression tests (no fabricated real fixture)
        working-directory: experiments/263/serbest_analiz_v2
        run: python -m unittest -v TEST_GUNLUK_KAPI_V2.py TEST_PREKO_KAYIT_GUARD_V2.py TEST_4700_SOURCE_LOCK_V2.py TEST_HAKEM2_GUNLUK_SECICI_V1.py TEST_P0_HAFIZA_MUHUR_SONUC_ZINCIRI_V1.py TEST_PREKO_ORAN_KAYIT_GUARD_V1.py
      - name: Compile independent modules
        run: python -m compileall -q experiments/263/serbest_analiz_v2
  named_before_kickoff:
    if: github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          ref: experiment/p0-oran-hafizasi-22-lig-20261122
          fetch-depth: 0
          persist-credentials: true
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install independent M4 C3 math dependencies
        run: python -m pip install 'numpy>=1.24,<3' 'scipy>=1.10,<2' 'pymupdf>=1.23,<2'
      - name: Official independent named fixture check + actual fresh historical M4 C3
        env:
          REQUEST_LEAGUE: ${{ inputs.league }}
          REQUEST_HOME: ${{ inputs.home }}
          REQUEST_AWAY: ${{ inputs.away }}
        shell: bash
        run: |
          set -euo pipefail
          python experiments/263/serbest_analiz_v2/GUNLUK_SERBEST_ANALIZ_KAPISI_V2.py \
            --league "$REQUEST_LEAGUE" --home "$REQUEST_HOME" --away "$REQUEST_AWAY" \
            --rule experiments/263/serbest_analiz_v2/hakem_karar_kurali_v1.json \
            --engine-root . \
            --history data/research_263/2026-11-23_4700_two_source_research.csv \
            --registry experiments/263/evidence/identity_index_263.json \
            --out-dir experiments/263/serbest_analiz_v2/official_receipts
      - name: Independently verify exactly one NEW SHA-signed pre-kickoff receipt
        shell: bash
        run: |
          set -euo pipefail
          python experiments/263/serbest_analiz_v2/PREKO_KAYIT_GUARD_V2.py
      - name: Commit only the new verified receipt, never touch prior seals
        shell: bash
        run: |
          set -euo pipefail
          receipt="$(python experiments/263/serbest_analiz_v2/PREKO_KAYIT_GUARD_V2.py --path)"
          git config user.name 'serbest-analiz-v2[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -- "$receipt"
          python experiments/263/serbest_analiz_v2/PREKO_KAYIT_GUARD_V2.py --staged "$receipt"
          git commit -m 'research: independent M4/C3 named pre-kickoff recorded with official gate'
          git push origin HEAD:experiment/p0-oran-hafizasi-22-lig-20261122
