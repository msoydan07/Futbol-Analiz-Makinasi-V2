name: "263 4518 accepted versus staged 4617 versus public 99 integrity audit"
on:
  push:
    branches:
      - research/263-staged99-evidence-join-20261110
    paths:
      - 'research/opponent_goals/staged_candidate_99_joint_audit.py'
      - 'research/opponent_goals/test_staged_candidate_99_joint_audit.py'
      - '.github/workflows/263-staged99-public-ledger-join.yml'
permissions:
  contents: write
jobs:
  stage99_source_already_in_git_no_provider_retrieval:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Offline existing public ledger and contradictory score tests
        run: python research/opponent_goals/test_staged_candidate_99_joint_audit.py
      - name: Compare GitHub Tuesday STAGED data to frozen accepted source and 99 published score observations
        run: |
          set -euo pipefail
          git fetch origin +refs/heads/experiment/263-toplu-karsilastirma:refs/remotes/origin/experiment/263-toplu-karsilastirma --quiet
          candidate="$(mktemp)"
          trap 'rm -f "$candidate"' EXIT
          git show origin/experiment/263-toplu-karsilastirma:data/staged_263/extended_history.csv > "$candidate"
          python research/opponent_goals/staged_candidate_99_joint_audit.py \
            --root . --staged "$candidate" \
            --out research/opponent_goals/reports/staged4518_4617_published99_comparison_20261110.json
      - name: Archive only bounded data-consistency report on isolated research branch
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add research/opponent_goals/reports/staged4518_4617_published99_comparison_20261110.json
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "Research: check existing Tuesday staged CSV against previous 99 published results [skip ci]"
          git push origin HEAD:research/263-staged99-evidence-join-20261110
