name: 263 forward decision candidate single acceptance
on:
  push:
    branches: [experiment/263-toplu-karsilastirma]
    paths:
      - 'experiments/263/forward_decision_candidate_263.py'
      - 'experiments/263/test_forward_decision_candidate_263.py'
      - '.github/workflows/263-forward-decision-candidate-ci.yml'
  workflow_dispatch:
jobs:
  contract:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Run one frozen decision contract suite
        run: python -m unittest discover -s experiments/263 -p 'test_forward_decision_candidate_263.py' -v
      - name: Confirm no production paths changed in this workflow
        run: |
          echo 'Experimental read-only contract only; no model refit, pilot write or main branch mutation.'
