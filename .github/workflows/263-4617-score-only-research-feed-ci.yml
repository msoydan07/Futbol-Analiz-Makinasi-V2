name: "263 4617 scored-only M4 four-model experimental feed acceptance"
on:
  push:
    branches:
      - feature/263-enable-4617-results-only-20261110
    paths:
      - 'data/results_only_263/4617_research_input_provenance.json'
      - 'experiments/263/forward_quad.py'
      - 'experiments/263/forward_empirical_baseline_263.py'
      - 'experiments/263/forward_baseline_provenance_263.py'
      - 'experiments/263/sabah_new100_commit_guard_263.py'
      - 'experiments/263/test_4617_results_only_m4_input_263.py'
      - '.github/workflows/263-4617-score-only-research-feed-ci.yml'
      - '.github/workflows/263-sabah-new100-on-request.yml'
      - '.github/workflows/263-quad-forward-on-request.yml'
permissions:
  contents: read
  actions: read
jobs:
  research-only-feed-gate:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Pin numerical packages for unchanged B-C2-C3-M4 models
        run: python -m pip install --disable-pip-version-check numpy==2.3.5 scipy==1.17.0
      - name: Obtain only the immutable 4413 historical baseline
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p m4_quad_base
          gh run download 41251343847 --repo "$GITHUB_REPOSITORY" \
            -n team-source-audit -D m4_quad_base
          echo '35c5e7b4e0fad45c592fd51cf094616f2ff60330ce52bcf21cd595968169f5a1  m4_quad_base/historical_results.csv' | sha256sum -c -
          echo '1170ecf9bdc31426e80a069cfc63d7112d0ab0c0c7d527e3bb5daf9b3841ece9  data/quad_accepted_263/extended_history.csv' | sha256sum -c -
          echo '637b8597ac5bf479934a0b66aaed726b5fc30c20d9a5e9b4a770913cf9d68a89  data/results_only_263/2026-11-10_completed_4617_scores_only.csv' | sha256sum -c -
      - name: Full 4617 history SHA provenance, real fit difference and mock-only pipeline regression
        env:
          PYTHONPATH: .:experiments/263
        run: python -m unittest -v experiments/263/test_4617_results_only_m4_input_263.py
      - name: Confirm no production model coefficients or historical seals changed in this commit
        shell: bash
        run: |
          set -euo pipefail
          git diff --name-only HEAD~1 HEAD > /tmp/changed.txt
          if grep -E '^(experiments/263/m4_integrated\.py|experiments/263/m4_lock\.json|data/quad_accepted_263/extended_history\.csv|forward_morning_263/|forward_acceptance_263/|forward_quad_263/)' /tmp/changed.txt; then
            echo "Original model/history/seal changed in isolated input feed; DENY"
            exit 1
          fi
          echo "FROZEN_ORIGINAL_MODEL_AND_SEALS_REMAIN_UNCHANGED"
