name: 263 Research - First 4505 source-rights and as-of input audit, no old FT QA
on:
  push:
    branches:
      - research/263-13-lig-22-havuz-20261113
    paths:
      - .github/workflows/263-4505-rights-and-asof-temporal-admission-gate-once.yml
permissions:
  contents: write
jobs:
  source-rights-availability-new-dimension-only:
    runs-on: ubuntu-latest
    timeout-minutes: 6
    steps:
      - uses: actions/checkout@v4
      - name: Synthetic feature availability and rights guard tests
        run: python experiments/263/league_expansion/audit_4505_source_rights_and_precise_asof_without_prior_QA_replay_20261114.py --self-test
      - name: Offline SHA-pinned 4505 source rights and actual feature snapshot proof presence only
        run: |
          python experiments/263/league_expansion/audit_4505_source_rights_and_precise_asof_without_prior_QA_replay_20261114.py --report > rights_asof_4505_aggregate.log
          python - <<'PY'
          import json,os
          from pathlib import Path
          path=Path("experiments/263/league_expansion/4505_rights_provenance_and_pre_kickoff_asof_source_gate_20261114.json")
          j=json.loads(path.read_text())
          assert j["status"]=="PASS_4505_LICENSE_AND_ASOF_SOURCE_INVENTORY_ZERO_UNPROVEN_TRAINING_ADMISSIONS"
          assert j["frozen_historical_source_only_fixture_identities"]==4505
          assert j["source_files_examined_offline"]==26
          assert j["newly_promoted_to_training"]==0
          assert j["old_match_score_FT_QA_workflows_reexecuted"]==0
          assert j["source_rights_advertised_not_training_permission"]["PUBLISHER_ODBL_RESEARCH_ONLY"]==467
          with open(os.environ["GITHUB_STEP_SUMMARY"],"a") as f:
            f.write("## New audit: source rights & real before-kickoff feature proof, all 4505 source identities\n")
            f.write("- 26 pinned source files, 4505 source-specific match identities\n")
            f.write("- No synthetic historical feature receipts; 0 model-ready input snapshots, 0 new training approval\n")
            f.write("- Reused old score QA evidence; no previous 1775, 461, 1268, 106 or 8 score checks rerun\n")
            f.write("- Source/provider licenses are NOT themselves point-in-time input feature proofs.\n")
          PY
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: 263-4505-only-rights-and-asof-new-dimension-no-score-rerun
          path: |
            rights_asof_4505_aggregate.log
            experiments/263/league_expansion/4505_rights_provenance_and_pre_kickoff_asof_source_gate_20261114.json
          retention-days: 14
      - name: Preserve only aggregate source rights and temporal readiness report
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -- experiments/263/league_expansion/4505_rights_provenance_and_pre_kickoff_asof_source_gate_20261114.json
          if ! git diff --cached --quiet; then
            git commit -m "research(263): 4505 source-rights and explicit as-of proof gate, no training, no old results QC"
            git push origin HEAD:research/263-13-lig-22-havuz-20261113
          fi
