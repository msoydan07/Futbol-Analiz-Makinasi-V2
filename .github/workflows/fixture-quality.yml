name: Fikstur otomatik kalite kontrolu
on:
  schedule:
    - cron: '20 6 * * 2'
  workflow_dispatch:
  pull_request:
    branches: [main]
  push:
    branches: [main]
    paths:
      - '.github/workflows/fixture-quality.yml'
permissions:
  contents: read
jobs:
  fixture-quality:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.sha || 'feature/01-kimlikler' }}
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      # Parser unit tests run without needing a browser installation. Club fallback enabled.
      - name: Parser ve yedi gun kurallari regresyonu
        run: python -m unittest -v test_official_browser_fixture.py test_verify_match_on_demand.py test_tff_fixture_lookup.py
      - name: Resmi sayfa erisimi icin tarayici kur
        run: |
          python -m pip install playwright
          python -m playwright install chromium
      - name: Uc lig resmi kaynak sagligi
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          from playwright.sync_api import sync_playwright
          from official_browser_fixture import SOURCES,FALLBACK_SOURCES
          out={}
          with sync_playwright() as p:
           browser=p.chromium.launch(headless=True,args=["--no-sandbox"])
           for league,url in SOURCES.items():
            attempts=[]
            for candidate in [url]+FALLBACK_SOURCES.get(league,[]):
             try:
              page=browser.new_page(locale="fr-BE" if league=="BEL1" else "en-GB")
              response=page.goto(candidate,wait_until="domcontentloaded",timeout=20000)
              page.wait_for_timeout(2500)
              body=page.locator("body").inner_text(timeout=10000)
              code=response.status if response else 0
              attempts.append({"url":candidate,"http":code,"visible_chars":len(body),"healthy":code==200 and len(body)>300})
              page.close()
              if attempts[-1]["healthy"]:break
             except Exception as e:attempts.append({"url":candidate,"healthy":False,"error":str(e)[:180]})
            out[league]={"healthy":any(a["healthy"] for a in attempts),"attempts":attempts}
           browser.close()
          Path("data").mkdir(exist_ok=True)
          Path("data/fixture_quality_report.json").write_text(json.dumps(out,ensure_ascii=False,indent=2))
          print(json.dumps(out,ensure_ascii=False,indent=2))
          if not all(v.get("healthy") for v in out.values()):raise SystemExit("Resmi kaynak erisiminde sorun: raporu inceleyin")
          PY
      - name: Farkli takimlarla gercek fikstur kabul denetimi
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          from datetime import datetime,timezone,timedelta
          from playwright.sync_api import sync_playwright
          from official_browser_fixture import SOURCES,FALLBACK_SOURCES,extract
          now=datetime.now(timezone.utc)
          targets={
            "BEL1":[("KV Mechelen","KRC Genk"),("Club Brugge","Anderlecht")],
            "POR1":[("FC Porto","Estoril Praia"),("SL Benfica","SC Braga")],
            "ENG2":[("Blackburn Rovers","Stoke City"),("Preston North End","Sheffield United")],
          }
          out={}
          with sync_playwright() as p:
           browser=p.chromium.launch(headless=True,args=["--no-sandbox"])
           for league,pairs in targets.items():
            sources=[]
            for url in [SOURCES[league]]+FALLBACK_SOURCES.get(league,[]):
             try:
              page=browser.new_page(locale="fr-BE" if league=="BEL1" else "en-GB")
              response=page.goto(url,wait_until="domcontentloaded",timeout=20000)
              if response and response.status==200:
               page.wait_for_timeout(2500)
               lines=[x.strip() for x in page.locator("body").inner_text(timeout=10000).splitlines() if x.strip()]
               found=[]
               for home,away in pairs:
                hits=extract(league,lines,home,away,now)
                found.append({"home":home,"away":away,"kickoffs_utc":[t.isoformat() for t in hits if now<=t<=now+timedelta(days=7)]})
               sources.append({"url":url,"http":200,"fixtures":found})
              else:sources.append({"url":url,"http":response.status if response else None})
              page.close()
             except Exception as e:sources.append({"url":url,"error":str(e)[:160]})
            out[league]={"sources":sources,"verified_distinct_pairs":sum(1 for pair in pairs if any(len(next((f["kickoffs_utc"] for f in src.get("fixtures",[]) if f["home"]==pair[0] and f["away"]==pair[1]),[]))==1 for src in sources))}
           browser.close()
          Path("data").mkdir(exist_ok=True)
          Path("data/fixture_acceptance_report.json").write_text(json.dumps(out,ensure_ascii=False,indent=2))
          print(json.dumps(out,ensure_ascii=False,indent=2))
          total=sum(v["verified_distinct_pairs"] for v in out.values())
          print(f"CANLI_FIKSTUR_DOGRULAMA: {total}/6")
          if total==0:
           raise SystemExit("KABUL BASARISIZ: sifir gercek fikstur dogrulandi; HTTP 200 yeterli degil")
          PY
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: fixture-acceptance-report
          path: data/fixture_acceptance_report.json
          if-no-files-found: warn
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: fixture-quality-report
          path: data/fixture_quality_report.json
          if-no-files-found: warn
