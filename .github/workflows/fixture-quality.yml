name: Fikstur otomatik kalite kontrolu
on:
  schedule:
    - cron: '20 6 * * 2'
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - '.github/workflows/fixture-quality.yml'
permissions:
  contents: read
jobs:
  fixture-quality:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/01-kimlikler
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Parser ve yedi gun kurallari regresyonu
        run: python -m unittest -v test_official_browser_fixture.py test_verify_match_on_demand.py test_tff_fixture_lookup.py
      - name: Resmi sayfa erisimi icin tarayici kur
        run: |
          python -m pip install playwright
          python -m playwright install chromium
      - name: Uc lig resmi kaynak sagligi
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          from playwright.sync_api import sync_playwright
          from official_browser_fixture import SOURCES
          out={}
          with sync_playwright() as p:
           browser=p.chromium.launch(headless=True,args=["--no-sandbox"])
           for league,url in SOURCES.items():
            try:
             page=browser.new_page()
             response=page.goto(url,wait_until="domcontentloaded",timeout=25000)
             page.wait_for_timeout(3500)
             body=page.locator("body").inner_text(timeout=10000)
             code=response.status if response else 0
             out[league]={"http":code,"visible_chars":len(body),"healthy":code==200 and len(body)>300,"url":url}
             page.close()
            except Exception as e:out[league]={"healthy":False,"error":str(e)[:250],"url":url}
           browser.close()
          Path("data").mkdir(exist_ok=True)
          Path("data/fixture_quality_report.json").write_text(json.dumps(out,ensure_ascii=False,indent=2))
          print(json.dumps(out,ensure_ascii=False,indent=2))
          if not all(v.get("healthy") for v in out.values()):raise SystemExit("Resmi kaynak erisiminde sorun: raporu inceleyin")
          PY
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: fixture-quality-report
          path: data/fixture_quality_report.json
          if-no-files-found: warn
