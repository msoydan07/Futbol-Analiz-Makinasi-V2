name: 263 market reference nonpromoting - focused CI
on:
  push:
    branches: [experiment/263-toplu-karsilastirma]
    paths:
      - 'experiments/263/market_benchmark_263.py'
      - 'experiments/263/test_market_benchmark_263.py'
      - '.github/workflows/263-market-benchmark-ci.yml'
permissions:
  contents: read
jobs:
  market-reference-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: One new isolated market-reference suite, no historical backtest
        env:
          PYTHONPATH: experiments/263
        run: python -m unittest -v experiments/263/test_market_benchmark_263.py
