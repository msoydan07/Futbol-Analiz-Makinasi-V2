name: "263 sabah entegre bileşenler - tek offline kabul"
on:
  push:
    branches: [experiment/263-toplu-karsilastirma]
    paths:
      - 'experiments/263/sabah_postmatch_263.py'
      - 'experiments/263/test_sabah_postmatch_263.py'
      - 'experiments/263/sabah_pinnacle_credit_guard_263.py'
      - 'experiments/263/test_sabah_pinnacle_credit_guard_263.py'
      - 'experiments/263/sabah_fixture_rotation_263.py'
      - 'experiments/263/test_sabah_fixture_rotation_263.py'
      - 'experiments/263/sabah_manual_window_263.py'
      - 'experiments/263/test_sabah_manual_window_263.py'
      - 'experiments/263/sabah_batch_263.py'
      - 'experiments/263/sabah_mobile_screens_263.py'
      - 'experiments/263/sabah_mobile_approved_pdf_263.py'
      - 'experiments/263/test_sabah_mobile_approved_pdf_263.py'
      - 'experiments/263/sabah_pinnacle_capture_263.py'
      - 'experiments/263/test_sabah_workflow_263.py'
      - 'experiments/263/sabah_official_fixture_gateway_263.py'
      - 'experiments/263/test_sabah_official_fixture_gateway_263.py'
      - 'experiments/263/sabah_official_coverage_probe_263.py'
      - 'experiments/263/official_page_lookup_263.py'
      - 'experiments/263/test_sabah_lfp_recent_263.py'
      - 'experiments/263/test_sabah_official_nov7_sources_263.py'
      - 'experiments/263/test_sabah_premier_nov2026_263.py'
      - 'experiments/263/test_sabah_44_official_parser_263.py'
      - 'experiments/263/test_sabah_44_named_alias_detail_263.py'
      - 'experiments/263/sabah_named_source_acceptance_263.py'
      - 'experiments/263/test_sabah_named_source_acceptance_263.py'
      - 'experiments/263/sabah_acceptance_commit_guard_263.py'
      - 'experiments/263/test_sabah_acceptance3_263.py'
      - 'experiments/263/sabah_new100_commit_guard_263.py'
      - 'experiments/263/test_sabah_new100_commit_guard_263.py'
      - 'experiments/263/sabah_new100_request_intake_263.py'
      - 'experiments/263/test_sabah_new100_intake_263.py'
      - 'experiments/263/sabah_postmatch_new100_263.py'
      - 'experiments/263/test_sabah_postmatch_new100_263.py'
      - 'experiments/263/pinnacle_market_benchmark_263.py'
      - 'experiments/263/sabah_pinnacle_new100_bridge_263.py'
      - 'experiments/263/test_sabah_pinnacle_new100_bridge_263.py'
      - 'experiments/263/sabah_manual_preflight_bridge_263.py'
      - 'experiments/263/test_sabah_manual_preflight_bridge_263.py'
      - 'experiments/263/sabah_10league_manifest_preflight_263.py'
      - 'experiments/263/test_sabah_10league_manifest_preflight_263.py'
      - 'experiments/263/sabah_portugal_official_news_263.py'
      - 'experiments/263/test_sabah_portugal_official_news_263.py'
      - 'experiments/263/sabah_belgium_official_nextjs_263.py'
      - 'experiments/263/test_sabah_belgium_official_nextjs_263.py'
      - 'experiments/263/sabah_eng2_official_tv_263.py'
      - 'experiments/263/test_sabah_eng2_official_tv_263.py'
      - 'experiments/263/official_page_lookup_263.py'
      - 'experiments/263/sabah_official_fixture_gateway_263.py'
      - '.github/workflows/263-sabah-10lig-fixture-preflight.yml'
      - '.github/workflows/263-sabah-new100-postmatch-readonly.yml'
      - '.github/workflows/263-sabah-new100-on-request.yml'
      - '.github/workflows/263-sabah-acceptance-on-request.yml'
      - '.github/workflows/263-sabah-offline-components.yml'
      - '.github/workflows/263-sabah-live-batch.yml'
      - '.github/workflows/263-pinnacle-free-once.yml'
      - '.github/workflows/263-quad-forward-on-request.yml'
permissions:
  contents: read
jobs:
  accept-offline:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Fixed required numerical packages (not an engine change)
        run: python -m pip install --disable-pip-version-check numpy==2.3.5 scipy==1.17.0
      - name: Install pinned PDF-only report dependencies
        run: python -m pip install --disable-pip-version-check reportlab==4.4.5 pypdf==6.1.3
      - name: Guard new100 against any automated odds or Pinnacle calls
        run: |
          set -euo pipefail
          test "$(git hash-object experiments/263/local_leagues/2026-11-06_09_10_league_date_only_candidates.json)" = "803378e8ef0f1f285a3393a7231567eea8f25e80"
          python experiments/263/check_active_decisions_263.py
          ! grep -q 'THE_ODDS_API_KEY' .github/workflows/263-sabah-new100-on-request.yml
          ! grep -q 'sabah_pinnacle_capture_263.py' .github/workflows/263-sabah-new100-on-request.yml
          ! grep -q 'sabah_pinnacle_new100_bridge_263.py' .github/workflows/263-sabah-new100-on-request.yml
          grep -q 'sabah_mobile_model_only_263.py' .github/workflows/263-sabah-new100-on-request.yml
          grep -q 'from model_first_decision_263 import select' experiments/263/model_first_iddaa_bridge_263.py
          echo "USER_IDDAA_PDF_EXCLUSIVE_PRICE_SOURCE_MODEL_ONLY_NEW100"
      - name: Parse live new100 workflow YAML and require one executable per step
        run: |
          python -m pip install --disable-pip-version-check PyYAML==6.0.3
          python - <<'PY'
          import yaml
          from pathlib import Path
          path=Path(".github/workflows/263-sabah-new100-on-request.yml")
          workflow=yaml.safe_load(path.read_text(encoding="utf-8"))
          steps=workflow["jobs"]["append-only-new100"]["steps"]
          assert len(steps)>=11, "NEW100_STEPS_MISSING"
          for step in steps:
              assert isinstance(step,dict)
              assert ("run" in step)!=("uses" in step), "INVALID_STEP_RUN_USES_COLLISION"
              assert isinstance(step.get("run",step.get("uses")),str)
          assert not any("sabah_pinnacle_capture_263.py" in step.get("run","") for step in steps)
          assert not any("THE_ODDS_API_KEY" in step.get("run","") for step in steps)
          assert any("sabah_mobile_model_only_263.py" in step.get("run","") for step in steps)
          print("NEW100_WORKFLOW_YAML_VALID",len(steps))
          preview=yaml.safe_load(Path(".github/workflows/263-sabah-10lig-fixture-preflight.yml").read_text(encoding="utf-8"))
          preview_steps=preview["jobs"]["ten-league-diagnostic"]["steps"]
          assert len(preview_steps)>=4
          assert all(("run" in s)!=("uses" in s) for s in preview_steps)
          assert any("sabah_10league_manifest_preflight_263.py" in s.get("run","") for s in preview_steps)
          print("TEN_LEAGUE_PREFLIGHT_WORKFLOW_YAML_OK",len(preview_steps))
          PY
      - name: Syntax check of new modules (no key or live calls)
        run: |
          python -m py_compile experiments/263/sabah_manual_window_263.py experiments/263/sabah_batch_263.py experiments/263/sabah_mobile_screens_263.py experiments/263/sabah_mobile_approved_pdf_263.py experiments/263/sabah_pinnacle_capture_263.py experiments/263/sabah_official_fixture_gateway_263.py experiments/263/sabah_official_coverage_probe_263.py experiments/263/sabah_named_source_acceptance_263.py experiments/263/sabah_acceptance_commit_guard_263.py experiments/263/sabah_new100_commit_guard_263.py experiments/263/sabah_new100_request_intake_263.py experiments/263/sabah_postmatch_new100_263.py experiments/263/sabah_manual_preflight_bridge_263.py experiments/263/sabah_10league_manifest_preflight_263.py experiments/263/sabah_portugal_official_news_263.py experiments/263/sabah_belgium_official_nextjs_263.py experiments/263/sabah_eng2_official_tv_263.py experiments/263/official_page_lookup_263.py experiments/263/sabah_official_fixture_gateway_263.py experiments/263/sabah_pinnacle_new100_bridge_263.py experiments/263/pinnacle_market_benchmark_263.py
      # These four old new100 test modules asserted the superseded
      # "no odds => forced PAS" contract. Keep them in Git history, but
      # do not gate new model-first recordings with obsolete assertions.
      # New operational model/receipt/mobile/no-odds tests below replace them.
      - name: One integrated synthetic test batch - no live odds or fixture calls
        env:
          PYTHONPATH: .:experiments/263
        run: |
          python -m unittest -v \
            experiments/263/test_current_new100_263.py \
            experiments/263/test_sabah_postmatch_263.py \
            experiments/263/test_sabah_pinnacle_credit_guard_263.py \
            experiments/263/test_sabah_fixture_rotation_263.py \
            experiments/263/test_sabah_manual_window_263.py \
            experiments/263/test_sabah_official_fixture_gateway_263.py \
            experiments/263/test_sabah_lfp_recent_263.py \
            experiments/263/test_sabah_official_nov7_sources_263.py \
            experiments/263/test_sabah_premier_nov2026_263.py \
            experiments/263/test_sabah_44_official_parser_263.py \
            experiments/263/test_sabah_44_named_alias_detail_263.py \
            experiments/263/test_sabah_named_source_acceptance_263.py \
            experiments/263/test_sabah_acceptance3_263.py \
            experiments/263/test_sabah_new100_intake_263.py \
            experiments/263/test_sabah_postmatch_new100_263.py \
            experiments/263/test_pinnacle_market_benchmark_263.py \
            experiments/263/test_sabah_10league_manifest_preflight_263.py \
            experiments/263/test_sabah_manual_preflight_bridge_263.py \
            experiments/263/test_sabah_portugal_official_news_263.py \
            experiments/263/test_sabah_belgium_official_nextjs_263.py \
            experiments/263/test_sabah_eng2_official_tv_263.py
      - name: Render pinned 44-candidate preparation without claiming kickoff verification
        env:
          PYTHONPATH: .:experiments/263
        run: |
          python experiments/263/sabah_fixture_rotation_263.py \
            --candidates experiments/263/local_leagues/2026-11-06_09_10_league_date_only_candidates.json \
            --day 2026-11-07 --out /tmp/263-prep-nov7.md
          grep -q '44 sabit kohort adayı' /tmp/263-prep-nov7.md
