name: "263 ten-league morning official fixture preflight - read-only ZERO ODDS"
on:
  push:
    branches: [experiment/263-toplu-karsilastirma]
    paths:
      - 'experiments/263/sabah_preflight_requests/*.json'
  workflow_dispatch:
permissions:
  # Write only an append-only source preflight receipt, never a pilot/odds request.
  contents: write
concurrency:
  group: quad-263-append-only
  cancel-in-progress: false
jobs:
  ten-league-diagnostic:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Only exact same-Turkey-day requested run, no hardcoded fixtures
        id: requested
        shell: bash
        env:
          PYTHONPATH: .:experiments/263
        run: |
          set -euo pipefail
          python - <<'PY'
          import json,os,subprocess,re
          from datetime import datetime
          from zoneinfo import ZoneInfo
          if os.environ.get("GITHUB_EVENT_NAME")=="workflow_dispatch":
              day=datetime.now(ZoneInfo("Europe/Istanbul")).date().isoformat()
          else:
              rows=subprocess.check_output(["git","diff-tree","--no-commit-id",
                                            "--name-status","-r","HEAD","--",
                                            "experiments/263/sabah_preflight_requests/"],text=True).splitlines()
              if len(rows)!=1:raise SystemExit("ONE_FRESH_PREFLIGHT_REQUEST_ONLY")
              status,path=rows[0].split("\t",1)
              if status!="A" or not re.fullmatch(r"experiments/263/sabah_preflight_requests/[A-Za-z0-9_-]+\.json",path):
                  raise SystemExit("NOT_AN_ADDED_PREFLIGHT_JSON")
              x=json.load(open(path,encoding="utf-8"))
              if set(x)!={"schema","day_turkey"} or x["schema"]!="263_TEN_LEAGUE_PREFLIGHT_REQUEST_V1":
                  raise SystemExit("PREFLIGHT_REQUEST_SCHEMA_INVALID")
              day=x["day_turkey"]
          if day!=datetime.now(ZoneInfo("Europe/Istanbul")).date().isoformat():
              raise SystemExit("CURRENT_TURKEY_DAY_ONLY_NO_BACKDATED_REQUEST")
          with open(os.environ["GITHUB_OUTPUT"],"a",encoding="utf-8") as f:
              f.write("day="+day+"\n")
          print("OFFICIAL_SAME_DAY_ONLY_ALL_TEN",day)
          PY
      - name: One live official-page fetch per league; do not use Pinnacle API
        shell: bash
        env:
          PYTHONPATH: .:experiments/263
          DAY: ${{ steps.requested.outputs.day }}
        run: |
          set -euo pipefail
          python experiments/263/sabah_10league_manifest_preflight_263.py \
            --day "$DAY" --out /tmp/263-ten-league-official-preflight.json \
            --mobile /tmp/263-ten-league-official-preflight.md \
            --candidate-manifest /tmp/263-ten-league-CANDIDATES-NOT-SEALED.json
          git diff --quiet
          git diff --cached --quiet
          echo 'NO_MODEL_NO_BETTING_NO_PILOT_NO_ODDS_NO_GITHUB_COMMIT'
      - name: Diagnose three official HTML shapes read-only; never Pinnacle
        shell: bash
        env:
          PYTHONPATH: .:experiments/263
        run: |
          set -euo pipefail
          python experiments/263/sabah_three_official_source_probe_263.py \
            --out /tmp/263-three-official-HTML-source-diagnosis.json
          git diff --quiet
          git diff --cached --quiet
      - name: Archive immutable same-day source preflight for the chat command router
        if: github.event_name == 'push'
        shell: bash
        env:
          DAY: ${{ steps.requested.outputs.day }}
        run: |
          set -euo pipefail
          target="experiments/263/sabah_preflight_results/$DAY/preflight_$GITHUB_RUN_ID"
          test -n "$DAY"
          test ! -e "$target.json"
          test ! -e "$target.md"
          test ! -e "$target"_candidates_not_sealed.json
          mkdir -p "$(dirname "$target")"
          cp /tmp/263-ten-league-official-preflight.json "$target.json"
          cp /tmp/263-ten-league-official-preflight.md "$target.md"
          cp /tmp/263-ten-league-CANDIDATES-NOT-SEALED.json "$target"_candidates_not_sealed.json
          python - <<'PY'
          import json,os
          from pathlib import Path
          day=os.environ["DAY"]
          p=Path("experiments/263/sabah_preflight_results")/day/("preflight_"+os.environ["GITHUB_RUN_ID"]+".json")
          x=json.loads(p.read_text(encoding="utf-8"))
          assert x["schema"]=="263_10_LEAGUE_SAME_DAY_OFFICIAL_MANIFEST_PREFLIGHT_V1"
          assert x["day_turkey"]==day
          assert x["league_count"]==len(x["source_coverage"])==10
          assert x["candidate_count"]==len(x["candidates"])
          assert x["does_not_write_pilot_or_place_bets"] is True
          assert x["new100_pilot_count_change"]==x["bookmaker_api_calls"]==0
          assert x["all_ten_leagues_claimed_fully_covered"] is False
          print("STORED_TEN_LEAGUE_READONLY_PREFLIGHT_ONLY")
          PY
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -- "$target.json" "$target.md" "$target"_candidates_not_sealed.json
          python - <<'PY'
          import subprocess,os
          prefix="experiments/263/sabah_preflight_results/"+os.environ["DAY"]+"/preflight_"+os.environ["GITHUB_RUN_ID"]
          expected={prefix+".json",prefix+".md",prefix+"_candidates_not_sealed.json"}
          staged=subprocess.check_output(["git","diff","--cached","--name-status"],text=True)
          rows=[line.split("\t",1) for line in staged.strip().splitlines()]
          assert len(rows)==3 and all(v=="A" for v,_ in rows)
          assert {name for _,name in rows}==expected
          print("ONLY_THREE_NEW_PREFLIGHT_FILES_NO_PILOT_NO_ODDS")
          PY
          git commit -m "Archive one fresh official ten-league fixture preflight receipt, not a forecast"
          git pull --rebase origin "$GITHUB_REF_NAME"
          git push origin "HEAD:$GITHUB_REF_NAME"
          git fetch origin "$GITHUB_REF_NAME"
          for path in "$target.json" "$target.md" "$target"_candidates_not_sealed.json; do
            git cat-file -e "origin/$GITHUB_REF_NAME:$path"
          done
          echo "SAME_DAY_CHAT_PREFLIGHT_RECEIPT_VERIFIED_NO_NEW100_TRIGGER"
      - name: Upload exact source-mapped readiness report, not an approved pilot
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ten-league-source-preflight-readonly-no-api-credits
          retention-days: 10
          if-no-files-found: ignore
          path: |
            /tmp/263-ten-league-official-preflight.json
            /tmp/263-ten-league-official-preflight.md
            /tmp/263-ten-league-CANDIDATES-NOT-SEALED.json
            /tmp/263-three-official-HTML-source-diagnosis.json
            /tmp/263-proleague-official-raw.html
