name: Model challenge - full 263 ten league weekly cutoff 1X2
on:
  push:
    branches: [research/model-challenge]
    paths:
      - '.github/workflows/model-challenge-263-weekly-full.yml'
      - 'research/model_challenge/ten_league_weekly_full_eval.py'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  evaluate:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Pin dependencies
        run: python -m pip install 'numpy==2.2.6' 'scipy==1.15.3' 'xgboost==3.0.5' 'scikit-learn==1.7.2'
      - name: Verify research snapshot
        run: python research/model_challenge/trusted_263_snapshot_bridge.py --out "$RUNNER_TEMP/accepted"
      - name: Compare all 2026/27 matches under shared prior-week cutoff
        run: python research/model_challenge/ten_league_weekly_full_eval.py --source "$RUNNER_TEMP/accepted/normalized_263_research.csv" --lock experiments/263/m4_lock.json --out "$RUNNER_TEMP/weekly/full_weekly_comparison.json"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: model-challenge-263-tenleague-weekly-all
          path: ${{ runner.temp }}/weekly/
          retention-days: 30
          if-no-files-found: warn
      - name: Protect production artifacts
        run: git diff --exit-code -- data/quad_accepted_263 experiments/263 forward_morning_263 forward_quad_263
