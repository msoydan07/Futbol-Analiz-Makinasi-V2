name: "263 10 leagues data strength goals independent research"
on:
  push:
    branches:
      - research/263-opponent-goals-20261110
    paths:
      - 'research/opponent_goals/**'
      - '.github/workflows/263-opponent-goals-research.yml'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  one-batch-opponent-goals:
    if: github.ref == 'refs/heads/research/263-opponent-goals-20261110'
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Frozen 4518 source SHA + 10 league source inventory / opponent strength
        shell: bash
        run: |
          set -euo pipefail
          python research/opponent_goals/test_data_opponent_goal_audit.py
          python research/opponent_goals/data_opponent_goal_audit.py \
            --out research/opponent_goals/reports/source_and_opponent_inventory_20261110.json
      - name: Install numerical requirements only for existing M4 runner
        run: python -m pip install --disable-pip-version-check numpy==2.3.5 scipy==1.17.0
      - name: Deterministic Poisson DC bivariate adversarial tests
        env:
          PYTHONPATH: experiments/263:research/opponent_goals
        run: python research/opponent_goals/test_opponent_goal_model_stress.py
      - name: One full frozen retrospective GOALS and opponent strength comparison
        env:
          PYTHONPATH: experiments/263:research/opponent_goals
        run: |
          python research/opponent_goals/opponent_goal_model_stress.py \
            --source data/quad_accepted_263/extended_history.csv \
            --lock experiments/263/m4_lock.json \
            --out research/opponent_goals/reports/goals_weekly_2026_27_exploratory.json
      - name: Save only research report immutable snapshots on isolated branch
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add research/opponent_goals/reports/source_and_opponent_inventory_20261110.json \
                  research/opponent_goals/reports/goals_weekly_2026_27_exploratory.json
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "Research: source coverage and shared-score hypothesis results [skip ci]"
          git push origin HEAD:research/263-opponent-goals-20261110
