name: 263 Research - Only 106 NEW phase match results second witness
on:
  push:
    branches:
      - research/263-13-lig-22-havuz-20261113
    paths:
      - .github/workflows/263-second-provider-106-phase-only-once.yml
permissions:
  contents: write
jobs:
  only_106_new_phase_results:
    runs-on: ubuntu-latest
    timeout-minutes: 7
    steps:
      - uses: actions/checkout@v4
      - name: Verify SHA-pinned 106 new stage result key scopes
        run: python experiments/263/league_expansion/verify_106_NEW_phase_only_FT_second_source_once.py --self-test
      - name: One second source CSV per league in-memory, compare ONLY 106 new keys
        shell: bash
        run: |
          python experiments/263/league_expansion/verify_106_NEW_phase_only_FT_second_source_once.py --run > second_phase106_only.log
          python - <<'PY'
          import json,os
          from pathlib import Path
          s=Path("second_phase106_only.log").read_text()
          d=json.loads(s.split("NEW_PHASE_106_QA_START",1)[1].split("NEW_PHASE_106_QA_END",1)[0])
          with open(os.environ["GITHUB_STEP_SUMMARY"],"a") as f:
            f.write("## Only 106 NEW 2025/26 playoff, second stage and post-split match facts\n")
            f.write("- Status: "+d["status"]+"\n")
            f.write("- Second source exact date/home/away/FT: "+str(d.get("new_only_second_source_exact_same_date_home_away_FT",0))+"\n")
            f.write("- HOLD missing/conflicting/blocked: "+str(d.get("new_only_second_source_missing_different_or_unavailable_HOLD",0))+"\n")
            f.write("- No previous already verified match keys rechecked. No model training.\n")
          assert d["status"]=="TARGET_ONLY_106_SEPARATE_SECOND_PHASE_FT_FACT_QA_FINISHED_PER_LEAGUE",d
          assert d["new_only_second_phase_fixture_keys_checked"]==106
          assert d["new_only_second_source_exact_same_date_home_away_FT"]+d["new_only_second_source_missing_different_or_unavailable_HOLD"]==106
          assert d["model_training_rows_approved"]==0
          Path("experiments/263/league_expansion/ccby_footballcharts_2025_26_106_separate_secondary_phase/new106_only_playoffs_and_second_phase_FT_second_witness_20261114.json").write_text(json.dumps(d,ensure_ascii=False,indent=2)+"\n")
          PY
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: 263-new-only-106-second-phase-score-witness-report
          path: |
            second_phase106_only.log
            experiments/263/league_expansion/ccby_footballcharts_2025_26_106_separate_secondary_phase/new106_only_playoffs_and_second_phase_FT_second_witness_20261114.json
          retention-days: 14
      - name: Commit only targeted fact witness report, no secondary provider scores
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -- experiments/263/league_expansion/ccby_footballcharts_2025_26_106_separate_secondary_phase/new106_only_playoffs_and_second_phase_FT_second_witness_20261114.json
          if ! git diff --cached --quiet; then
            git commit -m "research(263): targeted 106 NEW second-phase FT witnesses only; no older match QA or training"
            git push origin HEAD:research/263-13-lig-22-havuz-20261113
          fi
