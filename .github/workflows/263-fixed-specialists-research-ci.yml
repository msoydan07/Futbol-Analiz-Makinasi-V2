name: "263 fixed market specialists MS100 research safety checks"
on:
  push:
    branches:
      - research/263-fixed-specialists-100pct-ms-20261120
    paths:
      - experiments/263/four_model_value_policy_263.py
      - experiments/263/test_fixed_specialists_263.py
      - experiments/263/test_four_model_value_policy_263.py
      - .github/workflows/263-fixed-specialists-research-ci.yml
permissions:
  contents: read
jobs:
  fixed-experts:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install pinned math dependencies
        run: python -m pip install --disable-pip-version-check numpy==2.3.5 scipy==1.17.0
      - name: Original research decision regression and new strict market-family tests
        env:
          PYTHONPATH: .:experiments/263
        run: |
          set -euo pipefail
          python -m unittest -v \
            experiments/263/test_four_model_value_policy_263.py \
            experiments/263/test_fixed_specialists_263.py
          git diff --exit-code
      - name: Do not ever change frozen models, historical hashes, live forecast seals or xG
        run: |
          set -euo pipefail
          test "$(git diff --name-only origin/experiment/263-toplu-karsilastirma HEAD -- experiments/263/m4_integrated.py experiments/263/exp_263_batch.py experiments/263/analysis_math_core.py forward_morning_263 forward_quad_263 data/results_only_263 | wc -l)" -eq 0
