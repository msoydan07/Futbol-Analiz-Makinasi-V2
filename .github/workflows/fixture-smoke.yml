name: Fikstur hizli resmi kaynak testi
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/fixture-smoke.yml'
  workflow_dispatch:
jobs:
  fixture:
    runs-on: ubuntu-latest
    timeout-minutes: 4
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/01-kimlikler
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Yedi gun kural testleri
        run: python -m unittest -q test_verify_match_on_demand.py test_tff_fixture_lookup.py
      - name: TFF haftalik program gercek okuma testi
        run: python smoke_tff_official_detail.py
      - name: Genel mac arama canli deneme
        run: |
          python tff_fixture_lookup.py Kasımpaşa Beşiktaş | tee data/tff_lookup_live.json
          grep -q '"status": "VERIFIED_OFFICIAL_FIXTURE"' data/tff_lookup_live.json
          grep -q '"kickoff_turkey": "2026-11-01T19:00:00+03:00"' data/tff_lookup_live.json
      - name: Bundesliga gercek mac eslestirme
        run: |
          python bundesliga_fixture_lookup.py 'FC Bayern München' 'Borussia Dortmund' | tee data/bundesliga_lookup_live.json
          grep -q '"status": "VERIFIED_OFFICIAL_FIXTURE"' data/bundesliga_lookup_live.json
          grep -q '"kickoff_utc": "2026-10-31T17:30:00+00:00"' data/bundesliga_lookup_live.json
      - name: Premier League resmi canli mac testi
        run: |
          python premier_league_fixture_lookup.py Liverpool Arsenal | tee data/premier_league_lookup_live.json
          grep -q '"status": "VERIFIED_OFFICIAL_FIXTURE"' data/premier_league_lookup_live.json
          grep -q '"kickoff_utc": "2026-11-01T16:30:00+00:00"' data/premier_league_lookup_live.json
      - name: LaLiga gercek mac ve saat zorunlu testi
        run: |
          python laliga_fixture_lookup.py 'Athletic Club' 'Real Sociedad' | tee data/laliga_lookup_live.json
          grep -q '"status": "VERIFIED_OFFICIAL_FIXTURE"' data/laliga_lookup_live.json
          grep -q '"kickoff_utc": "2026-11-01T20:00:00+00:00"' data/laliga_lookup_live.json
      - name: Serie A resmi mac ve saat testi
        run: |
          python serie_a_fixture_lookup.py Atalanta Parma | tee data/serie_a_lookup_live.json
          grep -q '"status": "VERIFIED_OFFICIAL_FIXTURE"' data/serie_a_lookup_live.json
          grep -q '"kickoff_utc": "2026-11-02T19:45:00+00:00"' data/serie_a_lookup_live.json
      - name: LaLiga resmi sayfa eslestirme yapisi
        run: python probe_laliga_structure.py
      - name: KNVB Hollanda resmi canli mac testi
        run: |
          python eredivisie_fixture_lookup.py Feyenoord 'Fortuna Sittard' | tee data/eredivisie_lookup_live.json
          grep -q '"status": "VERIFIED_OFFICIAL_FIXTURE"' data/eredivisie_lookup_live.json
          grep -q '"kickoff_utc": "2026-10-31T15:30:00+00:00"' data/eredivisie_lookup_live.json
      - name: Fransa Belcika Portekiz Championship resmi canli mac testleri
        run: |
          set -o pipefail
          python ligue1_fixture_lookup.py 'RC Strasbourg Alsace' 'AJ Auxerre' | tee data/ligue1_lookup_live.json
          grep -q '"status": "VERIFIED_OFFICIAL_FIXTURE"' data/ligue1_lookup_live.json
          grep -q '"kickoff_utc": "2026-11-01T14:00:00+00:00"' data/ligue1_lookup_live.json
          python - <<'PY'
          import json,subprocess
          checks=[
            ("BEL1",["python","belgium_fixture_lookup.py","KV Mechelen","KRC Genk"],"2026-10-31T15:00:00+00:00","data/belgium_lookup_live.json"),
            ("POR1",["python","portugal_fixture_lookup.py","FC Porto","Estoril Praia"],"2026-10-31T20:30:00+00:00","data/portugal_lookup_live.json"),
            ("ENG2",["python","championship_fixture_lookup.py","Blackburn Rovers","Stoke City"],"2026-11-03T19:45:00+00:00","data/championship_lookup_live.json"),
          ]
          summary={}
          for league,cmd,expected,path in checks:
            r=subprocess.run(cmd,capture_output=True,text=True)
            try:data=json.loads(r.stdout)
            except Exception:data={"status":"INVALID_OUTPUT","stdout":r.stdout[:500],"stderr":r.stderr[:500]}
            with open(path,"w") as f:json.dump(data,f,ensure_ascii=False,indent=2)
            ok=(r.returncode==0 and data.get("status")=="VERIFIED_OFFICIAL_FIXTURE" and data.get("kickoff_utc")==expected)
            summary[league]={"accepted":ok,"status":data.get("status"),"reason":data.get("reason"),"kickoff_utc":data.get("kickoff_utc"),"source_url":data.get("source_url")}
            print(league,json.dumps(summary[league],ensure_ascii=False),flush=True)
          with open("data/remaining_three_acceptance.json","w") as f:json.dump(summary,f,indent=2)
          # Always collect all three diagnostics; individual acceptance is visible in JSON.
          PY
      - name: Belcika Fransa en guncel resmi sayfa denetimi
        run: python probe_belgium_france_latest.py
      - name: Kalan bes lig tek seferlik toplu resmi kaynak denetimi
        run: python probe_remaining_leagues_batch.py
      - name: Dokuz lig resmi kaynak toplu denetimi
        run: python probe_official_league_fixtures.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: fixture-smoke-proof
          path: |
            data/tff_official_detail_smoke.json
            data/tff_lookup_live.json
            data/official_league_probe.json
            data/bundesliga_lookup_live.json
            data/premier_league_lookup_live.json
            data/laliga_structure_probe.json
            data/laliga_lookup_live.json
            data/serie_a_lookup_live.json
            data/remaining_leagues_batch_probe.json
            data/eredivisie_lookup_live.json
            data/belgium_france_latest_probe.json
            data/ligue1_lookup_live.json
            data/belgium_lookup_live.json
            data/portugal_lookup_live.json
            data/championship_lookup_live.json
            data/remaining_three_acceptance.json
          if-no-files-found: warn
