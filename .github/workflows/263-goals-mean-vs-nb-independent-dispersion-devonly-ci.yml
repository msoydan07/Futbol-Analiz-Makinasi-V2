name: "263 KG and O2.5 frozen M4 goal mean versus independent NB DEV-only"
on:
  push:
    branches: [research/263-goals-marginal-dispersion-20261111]
    paths:
      - 'research/opponent_goals/goal_distribution_challenger_263.py'
      - 'research/opponent_goals/test_goal_distribution_challenger_263.py'
      - '.github/workflows/263-goals-mean-vs-nb-independent-dispersion-devonly-ci.yml'
permissions:
  contents: read
jobs:
  full-10-league-2025-26-dev-control:
    runs-on: ubuntu-latest
    timeout-minutes: 17
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Original locked M4 numeric requirements
        run: python -m pip install --disable-pip-version-check numpy==2.3.5 scipy==1.17.0
      - name: Confirm immutable 4518 4617 historical score source and frozen M4
        shell: bash
        run: |
          set -euo pipefail
          echo '1170ecf9bdc31426e80a069cfc63d7112d0ab0c0c7d527e3bb5daf9b3841ece9  data/quad_accepted_263/extended_history.csv' | sha256sum -c -
          echo '637b8597ac5bf479934a0b66aaed726b5fc30c20d9a5e9b4a770913cf9d68a89  data/results_only_263/2026-11-10_completed_4617_scores_only.csv' | sha256sum -c -
          echo 'eac755e54086738f40d7f30a514b2c9bb789b2c428ffef4ee70bb2fd2b49bc45  experiments/263/m4_integrated.py' | sha256sum -c -
      - name: Test exact original Poisson, NB moments, no 2026-27 leak and three folds
        env:
          PYTHONPATH: ".:experiments/263:research/opponent_goals"
        run: python -m unittest -v research/opponent_goals/test_goal_distribution_challenger_263.py
      - name: Save DEV-only unchanged-engine KG O25 MS paired loss results
        env:
          PYTHONPATH: ".:experiments/263:research/opponent_goals"
        run: python research/opponent_goals/goal_distribution_challenger_263.py --out /tmp/263_goals_m4_nb_vs_lambda_dev_only.json
      - name: Archive audit no pilot or model promotion
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: 263-kg-o25-goal-mean-vs-nb-dev-only-not-pilot-or-model
          retention-days: 30
          if-no-files-found: warn
          path: /tmp/263_goals_m4_nb_vs_lambda_dev_only.json
