name: "263 today 10-league B C2 C3 M4 read-only screener - no pilot/no odds"
on:
  push:
    branches: [experiment/263-toplu-karsilastirma]
    paths:
      - 'experiments/263/sabah_today_scope_readonly_263.py'
      - '.github/workflows/263-sabah-today-scope-readonly.yml'
permissions:
  contents: read
  actions: read
jobs:
  day-only-analysis-not-a-pilot:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Locked B C2 C3 M4 numerical dependencies
        run: python -m pip install --disable-pip-version-check numpy==2.3.5 scipy==1.17.0
      - name: Pinned historical archive download (read-only, not bookmaker)
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p m4_quad_base
          gh run download 41251343847 --repo "$GITHUB_REPOSITORY" \
            -n team-source-audit -D m4_quad_base
          echo '35c5e7b4e0fad45c592fd51cf094616f2ff60330ce52bcf21cd595968169f5a1  m4_quad_base/historical_results.csv' | sha256sum -c -
          echo '1170ecf9bdc31426e80a069cfc63d7112d0ab0c0c7d527e3bb5daf9b3841ece9  data/quad_accepted_263/extended_history.csv' | sha256sum -c -
      - name: Exact 18 official-candidate selected names, one live named gate per fixture
        shell: bash
        env:
          PYTHONPATH: .:experiments/263
        run: |
          set -euo pipefail
          if [ "$(TZ=Europe/Istanbul date +%Y-%m-%d)" != "2026-11-07" ]; then
            echo "NOT_THE_REQUESTED_DAY_NO_BACKDATED_FORECAST"
            exit 1
          fi
          python experiments/263/sabah_today_scope_readonly_263.py \
            --out /tmp/sabah_today_10_leagues_263.json \
            --mobile /tmp/sabah_today_10_leagues_263_mobile.md
          git diff --quiet
          git diff --cached --quiet
          echo "WORKSPACE_PREVIEW_NEVER_PUSHED_TO_ANY_PILOT"
      - name: Report evidence only, no pilot commit, no bookmaker
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: today-10-leagues-real-models-readonly-not-forward-pilot
          retention-days: 14
          if-no-files-found: ignore
          path: |
            /tmp/sabah_today_10_leagues_263.json
            /tmp/sabah_today_10_leagues_263_mobile.md
