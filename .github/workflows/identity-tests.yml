name: Kimlik sistemi testleri
on:
  push:
    branches: [main, feature/01-kimlikler]
  pull_request:
    branches: [main]
jobs:
  identity:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Birim testleri
        run: python -m unittest -v test_identity.py
