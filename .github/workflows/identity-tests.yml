name: Kimlik sistemi testleri
on:
  push:
    branches: [main, feature/01-kimlikler]
  pull_request:
    branches: [main]
jobs:
  identity:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Birim testleri
        run: python -m unittest -v test_identity.py test_verify_match_on_demand.py test_analyze_named_match_gate.py test_manual_match_intake.py
      - name: Tek mac Model B smoke testi
        run: python test_single_match_model_b.py
