name: 263 Research - One ODbL metadata discovery for missing old league seasons
on:
  push:
    branches:
      - research/263-13-lig-22-havuz-20261113
    paths:
      - .github/workflows/263-old-remaining-leagues-ODbL-list-once.yml
permissions:
  contents: write
jobs:
  old-history-sources-two-index-reads-only:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - name: Target league metadata-only safety test
        run: python experiments/263/league_expansion/check_other_planned_leagues_ODbL_coverage_once.py --self-test
      - name: Two small historical ODbL league lists only, no score imports
        shell: bash
        run: |
          python experiments/263/league_expansion/check_other_planned_leagues_ODbL_coverage_once.py --live | tee odbl_league_discovery.log
          python - <<'PY'
          import json,os
          from pathlib import Path
          s=Path("odbl_league_discovery.log").read_text()
          r=json.loads(s.split("ODBL_LEAGUES_START",1)[1].split("ODBL_LEAGUES_END",1)[0])
          with open(os.environ["GITHUB_STEP_SUMMARY"],"a",encoding="utf-8") as f:
            f.write("## Source discovery for remaining historical research leagues\n")
            f.write("- Status: "+r["status"]+"\n")
            for y,rows in r.get("keyword_candidates_NOT_VALIDATED",{}).items():
              f.write("- "+y+": "+", ".join(x["shortcut"]+"="+x["name"] for x in rows[:20])+"\n")
            f.write("- Candidate list does not prove source match suitability or license independence.\n")
          assert r["status"]=="ODBL_OTHER_SEVEN_LEAGUES_METADATA_SOURCE_DISCOVERY_ONLY",r
          assert r["source_requests"]==2
          assert r["new_training_rows"]==0
          PY
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: 263-ODbL-2025-2026-historic-league-shortcut-candidates
          path: |
            odbl_league_discovery.log
            experiments/263/league_expansion/odbl_openligadb_germany2/odbl_other_planned_leagues_source_catalog_once_20261114.json
          retention-days: 14
      - name: Commit only source metadata candidate report
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -- experiments/263/league_expansion/odbl_openligadb_germany2/odbl_other_planned_leagues_source_catalog_once_20261114.json
          if ! git diff --cached --quiet; then
            git commit -m "research(263): one-time ODbL old league index shortlist, no match predictions"
            git push origin HEAD:research/263-13-lig-22-havuz-20261113
          fi
