name: 263 UEFA requested named-match official gate - new focused acceptance
on:
  push:
    branches: [experiment/263-toplu-karsilastirma]
    paths:
      - experiments/263/europe/uefa_requested_match_entry_263.py
      - experiments/263/europe/test_uefa_requested_match_entry_263.py
      - .github/workflows/263-uefa-named-entry-check.yml
  workflow_dispatch:
permissions:
  contents: read
jobs:
  scope-first-then-official-uefa:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Only new requested-match entry boundary tests
        env:
          PYTHONPATH: experiments/263/europe
        run: python -m unittest -v experiments/263/europe/test_uefa_requested_match_entry_263.py
      - name: Manual ONLY official-site diagnostic - no repeated timeout on push
        if: github.event_name == 'workflow_dispatch'
        run: |
          python experiments/263/europe/uefa_requested_match_entry_263.py \
            --competition UEFA_CL --home Barcelona --away "Aston Villa" > /tmp/uefa_live.json
          cat /tmp/uefa_live.json
          python -c 'import json; r=json.load(open("/tmp/uefa_live.json")); assert r["fixture_verified"] is True, "OFFICIAL_UEFA_LIVE_NOT_VERIFIED: do not promote model"'
