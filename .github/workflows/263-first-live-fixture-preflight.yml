name: 263 first real TFF fixture gate and pinned canonical IDs
on:
  push:
    branches: [experiment/263-toplu-karsilastirma]
    paths:
      - 'analyze_named_match_gate.py'
      - 'experiments/263/test_current_named_match_bridge.py'
      - 'experiments/263/first_live_fixture_probe_263.py'
      - '.github/workflows/263-first-live-fixture-preflight.yml'
permissions:
  contents: read
jobs:
  first-real-fixture-lookup:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Single identity and source acceptance bridge targeted tests
        run: python -m unittest -v test_analyze_named_match_gate.py experiments/263/test_current_named_match_bridge.py
      - name: TFF real named-match live lookup ONCE, no future odds or prediction
        shell: bash
        run: |
          set -euo pipefail
          PYTHONPATH=. python experiments/263/first_live_fixture_probe_263.py
      - name: Preserve fixture gate findings
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: 263-first-tff-live-fixture-gate
          if-no-files-found: warn
          path: /tmp/263_first_real_fixture_gate_status.json
