name: 263 UEFA prematch phase context safeguards - new tests
on:
  push:
    branches: [experiment/263-toplu-karsilastirma]
    paths:
      - experiments/263/europe/uefa_match_context_263.py
      - experiments/263/europe/test_uefa_match_context_263.py
      - .github/workflows/263-uefa-match-context-check.yml
permissions:
  contents: read
jobs:
  isolated-uefa-context:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Only new prematch-context tests; NO prior models or backtest
        env:
          PYTHONPATH: experiments/263/europe
        run: python -m unittest -v experiments/263/europe/test_uefa_match_context_263.py
