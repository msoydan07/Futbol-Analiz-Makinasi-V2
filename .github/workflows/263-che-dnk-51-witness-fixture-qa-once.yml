name: 263 Research - 51 independent Swiss Danish result witnesses

on:
  push:
    branches:
      - research/263-13-lig-22-havuz-20261113
    paths:
      - .github/workflows/263-che-dnk-51-witness-fixture-qa-once.yml

permissions:
  contents: read

jobs:
  witness-audit:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - name: Match 51 independently sourced single-match score facts to original CSV
        shell: bash
        run: |
          python - <<'PY'
          import hashlib,json,re,sys,urllib.request,collections,datetime,os
          from pathlib import Path
          sys.path.insert(0,'experiments/263/league_expansion')
          from verify_public_season_csv_2526 import csv_rows, name_map, norm
          fixture_witness_path='experiments/263/league_expansion/che_dnk_2526_51_independent_match_score_witnesses_20261114.json'
          witnesses=json.loads(Path(fixture_witness_path).read_text())
          assert witnesses['match_count']==51
          by_league=collections.defaultdict(list)
          for x in witnesses['checks']:
              by_league[x['league']].append(x)
          report={'phase':'INDEPENDENT_SINGLE_MATCH_SCORE_WITNESS_COMPARE','date_utc':datetime.datetime.now(datetime.timezone.utc).isoformat(),'witness_coverage':'NON_REPRESENTATIVE_SELECTION','raw_source_csv_persisted':False,'matches_added_to_quarantine':0,'training_admitted':0,'main_M4_modified':False,'sources':[]}
          for league,slug in (('CHE1','swiss-super-league'),('DNK1','danish-superliga')):
              url=f'https://matchdaysync.com/api/public/csv/{slug}/2025-26/matches'
              cfg={'league':league,'expected_witnesses':len(by_league[league]),'state':'NOT_VERIFIED'}
              try:
                  req=urllib.request.Request(url,headers={'User-Agent':'Research-Source-Witness-QA/1.0','Accept':'text/csv'})
                  with urllib.request.urlopen(req, timeout=15) as res:
                      raw=res.read(2000001)
                      if len(raw)>2000000: raise ValueError('TOO_LARGE')
                  sha=hashlib.sha256(raw).hexdigest()
                  cfg['observed_csv_sha256']=sha
                  if sha!=witnesses['source_digests_to_check'][league]:
                      raise ValueError('SOURCE_HASH_DRIFT')
                  recs=csv_rows(raw.decode('utf-8-sig'))
                  club=name_map(league)
                  matches={}
                  collisions=0
                  for r in recs:
                      home=club.get(norm(r['home']));away=club.get(norm(r['away']))
                      k=(r['date'][:10],home,away)
                      if None in k or r['status'].lower() not in ('finished','completed','ft','full-time','full time'):
                          continue
                      try: goals=(int(r['home_goals']),int(r['away_goals']))
                      except Exception:continue
                      if k in matches:collisions+=1
                      matches[k]=goals
                  good=[];diff=[];missing=[]
                  for w in by_league[league]:
                      k=(w['date'],w['home'],w['away'])
                      found=matches.get(k)
                      if found is None:missing.append(w)
                      else:
                          expect=tuple(map(int,w['score'].split('-')))
                          if found==expect:good.append(w)
                          else:diff.append({'date':w['date'],'home':w['home'],'away':w['away'],'observed':list(found),'independent':list(expect),'source_url':w['source_url']})
                  cfg.update({'file_rows':len(recs),'source_unique_fixtures':len(matches),'fixture_collisions':collisions,'matched_witnesses':len(good),'contradicted_witnesses':len(diff),'missing_witnesses':len(missing),'contradiction_examples':diff[:10],'missing_examples':[{'date':w['date'],'home':w['home'],'away':w['away'],'source_url':w['source_url']} for w in missing[:10]],'state':'COMPLETE_WITNESS_CHECK'})
              except Exception as e:
                  cfg['state']='FAILED_CLOSED'
                  cfg['error_class']=type(e).__name__
              report['sources'].append(cfg)
          report['witnessed_source_matches']=sum(r.get('matched_witnesses',0) for r in report['sources'])
          report['fully_checked_total_season_matches']=0
          report['independent_status']='PARTIAL_SPOT_CHECK_ONLY__NO_TRAINING_ADMISSION'
          out=json.dumps(report,ensure_ascii=False,indent=2)+'\n'
          Path('51_witness_audit_aggregate.json').write_text(out,encoding='utf-8')
          print('SOURCE_WITNESS_CHECK_START')
          print(out)
          print('SOURCE_WITNESS_CHECK_END')
          with open(os.environ['GITHUB_STEP_SUMMARY'],'a',encoding='utf-8') as f:
              f.write('## 51 independently sourced factual score spot checks (no training admission)\n')
              f.write('| League | Witnesses | Match | Conflict | Missing | Status |\n|---|---:|---:|---:|---:|---|\n')
              for e in report['sources']:
                  f.write('| {} | {} | {} | {} | {} | {} |\n'.format(e['league'],e['expected_witnesses'],e.get('matched_witnesses','?'),e.get('contradicted_witnesses','?'),e.get('missing_witnesses','?'),e['state']))
          PY
      - name: Save summary evidence, no raw dataset
        uses: actions/upload-artifact@v4
        with:
          name: 263-51-independent-score-witness-aggregate
          path: 51_witness_audit_aggregate.json
          retention-days: 14
