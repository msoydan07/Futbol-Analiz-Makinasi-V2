name: 263 single end-to-end research integration acceptance
on:
  push:
    branches: [experiment/263-toplu-karsilastirma]
    paths:
      - 'experiments/263/forward_integrated_research_263.py'
      - 'experiments/263/test_forward_integrated_research_263.py'
      - '.github/workflows/263-forward-integrated-research-ci.yml'
  workflow_dispatch:
jobs:
  accept:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Single planned full-chain acceptance test
        env:
          PYTHONPATH: experiments/263
        run: |
          python -m unittest discover -s experiments/263 -p 'test_forward_integrated_research_263.py' -v
