name: "263 active decision policy guard"
on:
  push:
    branches:
      - experiment/263-toplu-karsilastirma
    paths:
      - docs/263_AKTIF_KARARLAR.json
      - experiments/263/check_active_decisions_263.py
      - experiments/263/test_check_active_decisions_263.py
      - experiments/263/iddaa_pdf_one_step_263.py
      - experiments/263/model_first_iddaa_bridge_263.py
      - experiments/263/model_first_decision_263.py
      - experiments/263/model_first_selection_lock_20261120.json
      - experiments/263/m4_integrated.py
      - .github/workflows/263-active-decision-guard.yml
  pull_request:
    paths:
      - docs/263_AKTIF_KARARLAR.json
      - experiments/263/check_active_decisions_263.py
      - experiments/263/test_check_active_decisions_263.py
      - experiments/263/iddaa_pdf_one_step_263.py
      - experiments/263/model_first_iddaa_bridge_263.py
      - experiments/263/model_first_decision_263.py
      - experiments/263/model_first_selection_lock_20261120.json
      - experiments/263/m4_integrated.py
      - .github/workflows/263-active-decision-guard.yml
  workflow_dispatch:
permissions:
  contents: read
jobs:
  guard:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Check exactly one active decision per topic and current PDF route
        run: python experiments/263/check_active_decisions_263.py
      - name: Fail-closed supersession regression (5 tests)
        run: python -m unittest discover -s experiments/263 -p 'test_check_active_decisions_263.py' -v
