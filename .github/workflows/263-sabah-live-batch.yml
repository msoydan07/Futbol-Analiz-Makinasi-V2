name: 263 sabah toplu + kalici Pinnacle gunluk kilit (deney)
on:
  workflow_dispatch:
    inputs:
      cohort:
        description: "legacy96 (yalniz 6-8 Kasim sabit liste) veya new100 (yeni adlandirilmis istek)"
        required: true
        type: choice
        options:
          - legacy96
          - new100
      day_turkey:
        description: "YYYY-MM-DD (bugun, Turkiye saati)"
        required: true
        type: string
      request_path:
        description: "new100 icin onceden commit edilmis sabah_requests dosyasi"
        required: false
        type: string
      with_pinnacle:
        description: "Mevcut gizli API anahtariyla lig basina 1 kredi kullan (varsayilan KAPALI)"
        required: false
        type: boolean
        default: false
permissions:
  contents: write
  actions: read
concurrency:
  group: quad-263-append-only
  cancel-in-progress: false
jobs:
  morning:
    if: github.ref_name == 'experiment/263-toplu-karsilastirma'
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Fixed dependencies only
        run: python -m pip install --disable-pip-version-check numpy==2.3.5 scipy==1.17.0
      - name: Validate same-day cohort input; never invent a kickoff
        id: prepare
        env:
          COHORT: "${{ inputs.cohort }}"
          USER_DAY: "${{ inputs.day_turkey }}"
          USER_PATH: "${{ inputs.request_path }}"
        shell: bash
        run: |
          set -euo pipefail
          git pull --ff-only origin "$GITHUB_REF_NAME"
          python - <<'PY'
          import os,re
          from datetime import datetime
          from pathlib import Path
          from zoneinfo import ZoneInfo
          day=os.environ["USER_DAY"];cohort=os.environ["COHORT"]
          if not re.fullmatch(r"\d{4}-\d{2}-\d{2}",day):
              raise SystemExit("DAY_FORMAT_INVALID")
          if datetime.now(ZoneInfo("Europe/Istanbul")).date().isoformat()!=day:
              raise SystemExit("CANNOT_MAKE_HISTORICAL_OR_FUTURE_FORECAST")
          if cohort=="legacy96":
              source="experiments/263/local_leagues/2026-11-06_09_10_league_date_only_candidates.json"
          elif cohort=="new100":
              source=os.environ["USER_PATH"]
              if not re.fullmatch(r"experiments/263/sabah_requests/[A-Za-z0-9_-]+\.json",source):
                  raise SystemExit("NAMED_REQUEST_PATH_NOT_ACCEPTED")
          else:raise SystemExit("COHORT_INVALID")
          if not Path(source).is_file():raise SystemExit("COHORT_SOURCE_MISSING")
          with open("/tmp/sabah_input","w") as f:f.write(source)
          PY
          echo "report=experiments/263/sabah_batch_reports/$GITHUB_RUN_ID.json" >> "$GITHUB_OUTPUT"
          echo "mobile=experiments/263/sabah_mobile_reports/$GITHUB_RUN_ID" >> "$GITHUB_OUTPUT"
      - name: Obtain PINNED immutable 4,413 base input
        env:
          GH_TOKEN: "${{ github.token }}"
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p m4_quad_base
          gh run download 41251343847 --repo "$GITHUB_REPOSITORY" -n team-source-audit -D m4_quad_base
          echo '35c5e7b4e0fad45c592fd51cf094616f2ff60330ce52bcf21cd595968169f5a1  m4_quad_base/historical_results.csv' | sha256sum -c -
      - name: One morning four-model batch, source-verified separately per match
        env:
          PYTHONPATH: .:experiments/263
          COHORT: "${{ inputs.cohort }}"
          DAY: "${{ inputs.day_turkey }}"
          REPORT: "${{ steps.prepare.outputs.report }}"
          MOBILE: "${{ steps.prepare.outputs.mobile }}"
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$(dirname "$REPORT")"
          python experiments/263/sabah_batch_263.py \
            --cohort "$COHORT" --day "$DAY" --input "$(cat /tmp/sabah_input)" \
            --history data/quad_accepted_263/extended_history.csv \
            --baseline m4_quad_base/historical_results.csv \
            --source-acceptance data/quad_accepted_263/source_acceptance.json \
            --report "$REPORT" \
            --mobile /tmp/sabah_placeholder.md
          python experiments/263/sabah_mobile_screens_263.py \
            --report "$REPORT" --output-dir "$MOBILE"
      - name: Verify pre-KO SHA and commit actual records before opening any API access
        id: committed
        env:
          PYTHONPATH: .:experiments/263
          COHORT: "${{ inputs.cohort }}"
          DAY: "${{ inputs.day_turkey }}"
          REPORT: "${{ steps.prepare.outputs.report }}"
          MOBILE: "${{ steps.prepare.outputs.mobile }}"
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          python experiments/263/sabah_batch_263.py \
            --cohort "$COHORT" --day "$DAY" --input "$(cat /tmp/sabah_input)" \
            --history data/quad_accepted_263/extended_history.csv \
            --baseline m4_quad_base/historical_results.csv \
            --source-acceptance data/quad_accepted_263/source_acceptance.json \
            --report "$REPORT" --mobile /tmp/sabah_placeholder.md --verify-precommit
          for dir in forward_morning_263 forward_quad_263 \
            experiments/263/sabah_research experiments/263/sabah_batch_reports \
            experiments/263/sabah_mobile_reports; do
            if [ -d "$dir" ]; then git add -A -- "$dir"; fi
          done
          if ! git diff --cached --quiet; then
            git commit -m "Seal independent morning B/C2/C3/M4 records with mobile views"
            git pull --rebase origin "$GITHUB_REF_NAME"
            python experiments/263/sabah_batch_263.py \
              --cohort "$COHORT" --day "$DAY" --input "$(cat /tmp/sabah_input)" \
              --history data/quad_accepted_263/extended_history.csv \
              --baseline m4_quad_base/historical_results.csv \
              --source-acceptance data/quad_accepted_263/source_acceptance.json \
              --report "$REPORT" --mobile /tmp/sabah_placeholder.md --verify-precommit
            git push origin "HEAD:$GITHUB_REF_NAME"
          fi
          echo "sealed=true" >> "$GITHUB_OUTPUT"
      - name: One persistent reservation per league BEFORE each external call
        if: steps.committed.outputs.sealed == 'true' && inputs.with_pinnacle
        env:
          PYTHONPATH: .:experiments/263
          THE_ODDS_API_KEY: "${{ secrets.THE_ODDS_API_KEY }}"
          REPORT: "${{ steps.prepare.outputs.report }}"
          DAY: "${{ inputs.day_turkey }}"
        shell: bash
        run: |
          set -euo pipefail
          if [ -z "$THE_ODDS_API_KEY" ]; then
            echo "NO_THE_ODDS_API_KEY: zero credits, no reservation"
            exit 0
          fi
          python experiments/263/sabah_pinnacle_capture_263.py eligible --report "$REPORT" > /tmp/sabah_eligible_leagues
          while IFS= read -r league; do
            [ -n "$league" ] || continue
            reservation="experiments/263/pinnacle_daily_reservations/$DAY/"$league"_pinnacle_h2h.json"
            snapshot="experiments/263/pinnacle_daily_snapshots/$DAY/$league.json"
            if [ -e "$reservation" ] || [ -e "$snapshot" ]; then
              echo "SAME_DAY_LEAGUE_ALREADY_RESERVED_OR_SNAPSHOTTED: $league"
              continue
            fi
            python experiments/263/sabah_pinnacle_capture_263.py reserve --league "$league" --day "$DAY"
            git add -- "$reservation"
            git commit -m "Reserve Pinnacle daily h2h credit for $league $DAY BEFORE request"
            git push origin "HEAD:$GITHUB_REF_NAME"
            git fetch origin "$GITHUB_REF_NAME"
            git cat-file -e "origin/$GITHUB_REF_NAME:$reservation"
            # No retry on HTTP 401/403/429/network failure. Reservation persists.
            python experiments/263/sabah_pinnacle_capture_263.py capture \
              --league "$league" --day "$DAY" --out "$snapshot"
            git add -- "$snapshot"
            git commit -m "Cache single Pinnacle daily h2h attempt for $league $DAY"
            git push origin "HEAD:$GITHUB_REF_NAME"
          done < /tmp/sabah_eligible_leagues
      - name: Read-only mobile reference display from immutable daily snapshots
        if: steps.committed.outputs.sealed == 'true' && inputs.with_pinnacle
        env:
          PYTHONPATH: .:experiments/263
          REPORT: "${{ steps.prepare.outputs.report }}"
          MOBILE: "${{ steps.prepare.outputs.mobile }}"
        shell: bash
        run: |
          set -euo pipefail
          python experiments/263/sabah_pinnacle_capture_263.py mobile \
            --report "$REPORT" --out "$MOBILE/pinnacle_reference.md"
          git add -- "$MOBILE/pinnacle_reference.md"
          git commit -m "Record read-only independent Pinnacle reference mobile screen"
          git push origin "HEAD:$GITHUB_REF_NAME"
      - name: Archive run evidence without invoking Pinnacle
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: sabah-263-batch-evidence
          if-no-files-found: ignore
          path: |
            experiments/263/sabah_batch_reports/*.json
            experiments/263/sabah_mobile_reports/**/*.md
