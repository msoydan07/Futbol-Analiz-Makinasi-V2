name: "263 older manual morning route - fail closed, use named new100 push"
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  disabled-unsafe-legacy-dispatch:
    runs-on: ubuntu-latest
    timeout-minutes: 2
    steps:
      - name: Legacy manual branch-only dispatch cannot bypass new100 SHA/mobile gate
        run: |
          echo "LEGACY_SABAH_MANUAL_DISABLED_NO_FORECAST_NO_ODDS"
          echo "Use .github/workflows/263-sabah-new100-on-request.yml"
          echo "Only NEW experiments/263/sabah_requests/*.json explicitly named fixtures."
          exit 1
