name: "263 PDF-first read-only 7-day rotation sidecar"
on:
  push:
    branches:
      - fix/263-live-fixture-break-gates-20261111
    paths:
      - 'experiments/263/iddaa_pdf_live_official_263.py'
      - 'experiments/263/iddaa_pdf_workload_263.py'
      - 'experiments/263/iddaa_pdf_session_263.py'
      - 'experiments/263/iddaa_pdf_report_263.py'
      - 'experiments/263/test_iddaa_pdf_session_263.py'
      - 'experiments/263/test_iddaa_pdf_report_263.py'
      - 'experiments/263/test_iddaa_pdf_workload_263.py'
      - '.github/workflows/263-pdf-7day-sidecar-ci.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  pdf-workload-only:
    runs-on: ubuntu-latest
    timeout-minutes: 7
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install PDF and model dependencies
        run: python -m pip install --disable-pip-version-check numpy==2.3.5 scipy==1.17.0 PyMuPDF reportlab
      - name: Run same-page 7day + current PDF regression without a bookmaker or extra official call
        env:
          PYTHONPATH: .:experiments/263
        run: |
          python -m unittest -v \
            experiments/263/test_iddaa_pdf_workload_263.py \
            experiments/263/test_iddaa_pdf_session_263.py \
            experiments/263/test_iddaa_pdf_report_263.py \
            experiments/263/test_sabah_fixture_rotation_263.py \
            experiments/263/test_sabah_official_fixture_gateway_263.py
      - name: Confirm frozen model source and original historical seals untouched
        shell: bash
        run: |
          set -euo pipefail
          base=f548b61480310e52f060c4be5904cf944bd3b020
          for p in experiments/263/m4_integrated.py experiments/263/m4_lock.json \
                   data/quad_accepted_263/extended_history.csv; do
            test "$(git rev-parse "$base:$p")" = "$(git rev-parse "HEAD:$p")"
          done
          echo 'FROZEN_MODELS_AND_BASE_HISTORY_IDENTICAL'
