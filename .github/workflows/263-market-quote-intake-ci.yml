name: 263 manuel oran gozetimi - tek sentetik kabul
on:
  push:
    branches: [experiment/263-toplu-karsilastirma]
    paths:
      - 'experiments/263/market_quote_intake_263.py'
      - 'experiments/263/test_market_quote_intake_263.py'
      - '.github/workflows/263-market-quote-intake-ci.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  safe-manual-quote-intake-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Locked numerical dependencies only to import quad modules
        run: python -m pip install --disable-pip-version-check numpy==2.3.5 scipy==1.17.0
      - name: Single synthetic intake + existing market compatibility test
        env:
          PYTHONPATH: experiments/263
        run: python -m unittest -v experiments/263/test_market_quote_intake_263.py
