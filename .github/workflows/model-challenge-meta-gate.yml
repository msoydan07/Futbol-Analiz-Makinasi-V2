name: Model challenge - meta-gate safety
on:
  push:
    branches: [research/model-challenge]
    paths: ['.github/workflows/model-challenge-meta-gate.yml']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  gate-qa:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install 'numpy==2.2.6' 'scipy==1.15.3'
      - name: Test out-of-fold and match-specific gate safety
        run: python -m unittest discover -s research/model_challenge -p 'test_meta_gate.py' -v
      - name: Confirm existing production records untouched
        run: test -z "$(git status --porcelain -- experiments/263 forward_morning_263 forward_quad_263)"
