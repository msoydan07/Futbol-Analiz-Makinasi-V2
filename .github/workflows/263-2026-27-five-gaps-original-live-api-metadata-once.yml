name: 263 Research - Only five 2026/27 missing league live API scope, metadata no raw
on:
  push:
    branches:
      - research/263-13-lig-22-havuz-20261113
    paths:
      - .github/workflows/263-2026-27-five-gaps-original-live-api-metadata-once.yml
      - experiments/263/league_expansion/probe_five_2026_27_personal_API_rights_no_raw_20261114.py
permissions:
  contents: write
jobs:
  no_external_raw_data_republication:
    runs-on: ubuntu-latest
    timeout-minutes: 7
    steps:
      - uses: actions/checkout@v4
      - name: Pure tests for five scopes, source date and no match-score report
        run: python experiments/263/league_expansion/probe_five_2026_27_personal_API_rights_no_raw_20261114.py --self-test
      - name: Max six keyless personal research API reads; only aggregate metadata retained
        shell: bash
        run: |
          python experiments/263/league_expansion/probe_five_2026_27_personal_API_rights_no_raw_20261114.py --run > five_current_league_metadata_probe.log
          python - <<'PY'
          from pathlib import Path
          import json,os
          s=Path("five_current_league_metadata_probe.log").read_text()
          d=json.loads(s.split("FIVE_LEAGUE_PERSONAL_API_START",1)[1].split("FIVE_LEAGUE_PERSONAL_API_END",1)[0])
          assert d["new_raw_source_match_rows_rehosted"]==0
          assert d["new_model_training_rows_approved"]==0
          assert d["old_pinned_4505_research_fixture_rows_unchanged"]
          with open(os.environ["GITHUB_STEP_SUMMARY"],"a") as f:
            f.write("## 2026/27 missing five leagues: rights-aware LIVE personal research metadata test\n")
            f.write("- Rights: free personal research only; NO raw data redistribution. Snapshot CC BY != live API rights.\n")
            for lg,res in d["by_league"].items():
              f.write("- "+lg+": "+res["status"]+", score-field matches in memory="+str(res.get("derived_metadata_only",{}).get("matched_completed_historical_result_field_rows",0))+"\n")
            f.write("- GitHub source archive added: ZERO. Old 4505 and sealed M4 unchanged.\n")
          PY
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: 263-five-current-league-live-API-metadata-only-no-provider-raw
          path: |
            five_current_league_metadata_probe.log
            experiments/263/league_expansion/current_2026_27_five_leagues_footballcharts_personal_research_API_rights_probe_20261114.json
          retention-days: 14
      - name: Persist only independent coverage statistics and source-rights metadata
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -- experiments/263/league_expansion/current_2026_27_five_leagues_footballcharts_personal_research_API_rights_probe_20261114.json
          if ! git diff --cached --quiet; then
            git commit -m "research(263): 2026-27 five source gaps live API personal research metadata, zero raw data redistribution"
            git push origin HEAD:research/263-13-lig-22-havuz-20261113
          fi
