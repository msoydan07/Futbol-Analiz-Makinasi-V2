name: "263 M4 opponent strength & recent-five form goal residual audit"
on:
  push:
    branches: [research/263-opponent-form-residual-20261111]
    paths:
      - 'research/opponent_goals/m4_opponent_form_diagnostic_263.py'
      - 'research/opponent_goals/test_m4_opponent_form_diagnostic_263.py'
      - '.github/workflows/263-m4-opponent-form-goal-error-devonly-ci.yml'
permissions:
  contents: read
jobs:
  ten-league-frozen-2025-26-dev-form-audit:
    runs-on: ubuntu-latest
    timeout-minutes: 14
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Existing frozen M4 dependencies
        run: python -m pip install --disable-pip-version-check numpy==2.3.5 scipy==1.17.0
      - name: Pinned archived data and frozen engine, no 2026-27 target leakage
        shell: bash
        run: |
          set -euo pipefail
          echo '1170ecf9bdc31426e80a069cfc63d7112d0ab0c0c7d527e3bb5daf9b3841ece9  data/quad_accepted_263/extended_history.csv' | sha256sum -c -
          echo '637b8597ac5bf479934a0b66aaed726b5fc30c20d9a5e9b4a770913cf9d68a89  data/results_only_263/2026-11-10_completed_4617_scores_only.csv' | sha256sum -c -
          echo 'eac755e54086738f40d7f30a514b2c9bb789b2c428ffef4ee70bb2fd2b49bc45  experiments/263/m4_integrated.py' | sha256sum -c -
      - name: Run opponent form leak checks plus ten-league actual chronological study
        env:
          PYTHONPATH: .:experiments/263:research/opponent_goals
        run: |
          python -m unittest -v research/opponent_goals/test_m4_opponent_form_diagnostic_263.py
          git diff --quiet
          git diff --cached --quiet
      - name: Emit same-match goal errors, opponent strata and market-loss contrasts
        env:
          PYTHONPATH: .:experiments/263:research/opponent_goals
        run: python research/opponent_goals/m4_opponent_form_diagnostic_263.py --out /tmp/263_opponent_form_m4_10league_readonly.json
      - name: Preserve research-only evidence never model promotion
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: 263-opponent-form-10-league-goal-error-no-model-change
          retention-days: 30
          if-no-files-found: warn
          path: /tmp/263_opponent_form_m4_10league_readonly.json
