name: 263 Serbest — istekten resmi maca ve Git oncesi kayda
on:
  push:
    branches: [experiment/p0-oran-hafizasi-22-lig-20261122]
    paths:
      - 'experiments/263/serbest_analiz_v2/requests/*.json'
permissions:
  contents: write
concurrency:
  group: serbest-v2-named-${{ github.ref }}
  cancel-in-progress: false
jobs:
  named_single:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          ref: experiment/p0-oran-hafizasi-22-lig-20261122
          fetch-depth: 2
          persist-credentials: true
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Check exactly one new verified-user request; not a generated fixture
        id: request
        shell: bash
        run: |
          set -euo pipefail
          changed=$(git diff --name-only HEAD^ HEAD -- 'experiments/263/serbest_analiz_v2/requests/*.json')
          count=$(printf '%s\n' "$changed" | grep -cve '^$' || true)
          if [ "$count" -ne 1 ]; then echo 'Exactly one changed request is required'; exit 1; fi
          export REQUEST_PATH="$changed"
          python - <<'PY'
          import json,os,re
          p=os.environ['REQUEST_PATH'];d=json.load(open(p,encoding='utf-8'))
          if set(d)!={'schema','league','home','away'} or d['schema']!='SERBEST_NAMED_REQUEST_V2':
              raise SystemExit('MALFORMED_REQUEST')
          if d['league'] not in ('ENG1','ENG2','GER1','ESP1','ITA1','FRA1','NED1','TUR1','POR1','BEL1'):
              raise SystemExit('NOT_TEN_LEAGUE')
          if any(not isinstance(d[x],str) or not 2<=len(d[x])<=100 or '\n' in d[x] for x in ('home','away')):
              raise SystemExit('INVALID_TEAM_NAME')
          with open(os.environ['GITHUB_OUTPUT'],'a') as f:
              for k in ('league','home','away'):
                  f.write(k+'='+d[k]+'\n')
          PY
      - name: Install original model numerical runtime
        run: python -m pip install 'numpy>=1.24,<3' 'scipy>=1.10,<2' 'pymupdf>=1.23,<2'
      - name: Independent official fixture lookup, current history lock, M4/C3 prediction
        env:
          REQUEST_LEAGUE: ${{ steps.request.outputs.league }}
          REQUEST_HOME: ${{ steps.request.outputs.home }}
          REQUEST_AWAY: ${{ steps.request.outputs.away }}
        shell: bash
        run: |
          set -euo pipefail
          python experiments/263/serbest_analiz_v2/GUNLUK_SERBEST_ANALIZ_KAPISI_V2.py \
            --league "$REQUEST_LEAGUE" --home "$REQUEST_HOME" --away "$REQUEST_AWAY" \
            --rule experiments/263/serbest_analiz_v2/hakem_karar_kurali_v1.json \
            --engine-root . \
            --history data/results_only_263/2026-11-10_completed_4617_scores_only.csv \
            --registry experiments/263/evidence/identity_index_263.json \
            --out-dir experiments/263/serbest_analiz_v2/official_receipts
      - name: Reverify that match has not started before Git commit
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import json,datetime as dt,glob
          paths=glob.glob('experiments/263/serbest_analiz_v2/official_receipts/*.json')
          if len(paths)!=1:raise SystemExit('ONE_NEW_RECEIPT_REQUIRED')
          r=json.load(open(paths[0],encoding='utf-8'))
          ko=dt.datetime.fromisoformat(r['kickoff_utc']);now=dt.datetime.now(dt.timezone.utc)
          if ko.tzinfo is None or now>=ko:raise SystemExit('MATCH_KICKOFF_PASSED')
          if dt.datetime.fromisoformat(r['observed_at_utc'])>=ko:raise SystemExit('NOT_PREMATCH')
          PY
      - name: Write-once Git commit (no old seals rewritten)
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'serbest-analiz-v2[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -- experiments/263/serbest_analiz_v2/official_receipts/
          test -n "$(git diff --cached --name-only)"
          git commit -m 'research: official before-kickoff named M4/C3 receipt'
          git push origin HEAD:experiment/p0-oran-hafizasi-22-lig-20261122
