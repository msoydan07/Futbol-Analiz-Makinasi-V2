name: "263 Nov7 18 official web-reviewed fixture shadows - NOT machine reverified"
on:
  push:
    branches: [experiment/263-toplu-karsilastirma]
    paths:
      - 'experiments/263/sabah_18_human_official_shadow_263.py'
      - '.github/workflows/263-sabah-18-human-official-shadow.yml'
permissions:
  contents: read
  actions: read
jobs:
  human-attested-experimental-only:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Pinned original B C2 C3 M4 numerical dependencies
        run: python -m pip install --disable-pip-version-check numpy==2.3.5 scipy==1.17.0
      - name: Fetch immutable source archive without bookmaker API
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p m4_quad_base
          gh run download 41251343847 --repo "$GITHUB_REPOSITORY" \
            -n team-source-audit -D m4_quad_base
          echo '35c5e7b4e0fad45c592fd51cf094616f2ff60330ce52bcf21cd595968169f5a1  m4_quad_base/historical_results.csv' | sha256sum -c -
          echo '1170ecf9bdc31426e80a069cfc63d7112d0ab0c0c7d527e3bb5daf9b3841ece9  data/quad_accepted_263/extended_history.csv' | sha256sum -c -
      - name: One time-limited human-reviewed official web source, research only
        shell: bash
        env:
          PYTHONPATH: .:experiments/263
        run: |
          set -euo pipefail
          python experiments/263/sabah_18_human_official_shadow_263.py \
            --out /tmp/263_18_human_official_nonpilot.json \
            --mobile /tmp/263_18_human_official_nonpilot.md
          git diff --quiet
          git diff --cached --quiet
          echo 'NO_NEW100_FORECAST_NO_OFFICIAL_MACHINE_REVERIFY_NO_BET'
      - name: Upload human-attested classification and model research results only
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: 18-human-official-schedule-evidence-research-NOT-machine-reverified
          retention-days: 7
          if-no-files-found: ignore
          path: |
            /tmp/263_18_human_official_nonpilot.json
            /tmp/263_18_human_official_nonpilot.md
