name: Model challenge - weekend source score probe for sealed goals forecasts
on:
  push:
    branches: [research/model-challenge]
    paths:
      - '.github/workflows/model-challenge-weekend-results-probe.yml'
      - 'research/model_challenge/weekend_external_results_probe.py'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Read-only weekend external scored matches / SHA-sealed research comparison
        run: python research/model_challenge/weekend_external_results_probe.py --root . --out "$RUNNER_TEMP/thirdparty/weekend_score_candidates.json"
      - name: Save third-party candidate evidence only
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: model-challenge-weekend-thirdparty-results-probe
          path: ${{ runner.temp }}/thirdparty/
          retention-days: 30
          if-no-files-found: warn
      - name: Do not alter production or its results ledger
        run: git diff --exit-code -- data/quad_accepted_263 experiments/263 forward_morning_263 forward_quad_263
