name: 263 Serbest — ten-league live data freshness one-shot diagnosis
on:
  push:
    branches: [experiment/p0-oran-hafizasi-22-lig-20261122]
    paths:
      - '.github/workflows/263-serbest-kaynak-hazirlik-ci.yml'
permissions:
  contents: read
jobs:
  live_provider_read_only:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Read-only provider freshness gap; no forecast, no history write
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import csv, io, json, hashlib, urllib.request
          from datetime import date, datetime, timezone
          from pathlib import Path
          from urllib.parse import urlsplit

          codes={'ENG1':'E0','ENG2':'E1','GER1':'D1','ESP1':'SP1','ITA1':'I1',
                 'FRA1':'F1','NED1':'N1','TUR1':'T1','POR1':'P1','BEL1':'B1'}
          old='data/results_only_263/2026-11-10_completed_4617_scores_only.csv'
          expected='637b8597ac5bf479934a0b66aaed726b5fc30c20d9a5e9b4a770913cf9d68a89'
          b=Path(old).read_bytes()
          if hashlib.sha256(b).hexdigest()!=expected:raise SystemExit('SOURCE_SNAPSHOT_SHA_MISMATCH')
          old_rows=list(csv.DictReader(io.StringIO(b.decode('utf-8-sig'))))
          latest={league:max(row['match_date'] for row in old_rows if row['league']==league)
                  for league in codes}
          today=datetime.now(timezone.utc).date()
          def day(s):
              for f in ('%d/%m/%Y','%d/%m/%y','%Y-%m-%d'):
                  try:return datetime.strptime(s.strip(),f).date().isoformat()
                  except ValueError:pass
              raise ValueError('BAD_DATE')
          def get_score(s):
              t=(s or '').strip()
              return int(t) if t.isascii() and t.isdigit() else None
          findings=[]
          for league,short in codes.items():
              url=f'https://www.football-data.co.uk/mmz4281/2627/{short}.csv'
              item={'league':league,'source_url':url,'snapshot_latest':latest[league],
                    'snapshot_age_days':(today-date.fromisoformat(latest[league])).days,
                    'status':'NO_NETWORK_OR_BAD_SOURCE','source_grade':'PUBLIC_SECONDARY_NOT_OFFICIAL'}
              try:
                  req=urllib.request.Request(url,headers={'User-Agent':'FootballResearchAudit/263 (one-shot, read-only)'})
                  with urllib.request.urlopen(req,timeout=14) as resp:
                      u=urlsplit(resp.geturl())
                      if resp.status!=200 or u.scheme!='https' or (u.hostname or '').lower() not in ('football-data.co.uk','www.football-data.co.uk') or u.path!=urlsplit(url).path:
                          raise ValueError('REDIRECT_OR_HTTP_NOT_APPROVED')
                      raw=resp.read(2_000_001)
                  if len(raw)>2_000_000 or len(raw)<1000:raise ValueError('INVALID_SIZE')
                  inp=csv.DictReader(io.StringIO(raw.decode('utf-8-sig')))
                  if not inp.fieldnames or not {'Date','HomeTeam','AwayTeam','FTHG','FTAG','FTR'}<=set(inp.fieldnames):
                      raise ValueError('REQUIRED_COLUMNS_MISSING')
                  completed=[];bad=0
                  for r in inp:
                      if not (r.get('HomeTeam') and r.get('AwayTeam')):continue
                      h=get_score(r.get('FTHG'));a=get_score(r.get('FTAG'));res=(r.get('FTR') or '').strip()
                      if h is None and a is None and not res:continue
                      if h is None or a is None or res!=('H' if h>a else 'A' if h<a else 'D'):
                          bad+=1;continue
                      d=day(r.get('Date',''))
                      if d<today.isoformat():completed.append(d)
                  if not completed:raise ValueError('NO_COMPLETED_ROWS')
                  newest=max(completed)
                  item.update(status='SOURCE_HAS_NEW_COMPLETED_SCORES' if newest>latest[league] else 'NO_NEW_COMPLETED_SCORES',
                              fetched_sha256=hashlib.sha256(raw).hexdigest(),
                              provider_latest_before_today=newest,
                              provider_completed_before_today=len(completed),
                              completed_dates_newer_than_snapshot=sum(x>latest[league] for x in completed),
                              bad_completed_rows=bad)
              except Exception as exc:
                  item['reason']=type(exc).__name__+':'+str(exc)[:120]
              findings.append(item)
              print(league,item['status'],'old',latest[league],
                    'new',item.get('provider_latest_before_today'),
                    'added',item.get('completed_dates_newer_than_snapshot'),
                    'reason',item.get('reason',''))
          report={'schema':'263_SERBEST_TEN_LEAGUE_SOURCE_READINESS_20261123_V1',
                  'created_at_utc':datetime.now(timezone.utc).isoformat(),
                  'historical_source_sha256':expected,
                  'historical_snapshot_rows':len(old_rows),
                  'no_changes_to_history':True,
                  'not_acceptance_or_source_identity_validation':True,
                  'leagues':findings}
          Path('ten_league_live_source_readiness.json').write_text(json.dumps(report,ensure_ascii=False,indent=2)+'\n')
          print('SOURCE_READINESS_RESEARCH_ONLY',sum(x['status']=='SOURCE_HAS_NEW_COMPLETED_SCORES' for x in findings),'/10',
                'NEED_REAL_DATA_ACCEPTANCE_AND_IDENTITY_CHECK_BEFORE_USE')
          PY
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: serbest-ten-league-source-readiness-one-shot
          path: ten_league_live_source_readiness.json
          if-no-files-found: ignore
