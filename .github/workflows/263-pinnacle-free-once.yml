name: 263 Pinnacle free REAL API one-shot probe
on:
  push:
    branches: [experiment/263-toplu-karsilastirma]
    paths:
      - 'experiments/263/pinnacle_trial_requests/*.json'
permissions:
  contents: read
jobs:
  real-research:
    runs-on: ubuntu-latest
    timeout-minutes: 6
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 2
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Validate one new request
        shell: bash
        run: |
          set -euo pipefail
          git diff-tree --no-commit-id --name-status -r HEAD -- experiments/263/pinnacle_trial_requests/ > /tmp/pinnacle_delta.tsv
          if grep -Ev '^A[[:space:]]+experiments/263/pinnacle_trial_requests/[A-Za-z0-9_-]+\.json$' /tmp/pinnacle_delta.tsv | grep -q .; then
            echo "ONE_NEW_REQUEST_ONLY"; exit 2
          fi
          grep -E '^A[[:space:]]+experiments/263/pinnacle_trial_requests/[A-Za-z0-9_-]+\.json$' /tmp/pinnacle_delta.tsv | cut -f2 > /tmp/pinnacle_paths
          if [ "$(wc -l < /tmp/pinnacle_paths)" -ne 1 ]; then
            echo "ONE_REQUEST_REQUIRED"; exit 2
          fi
          python - "$(cat /tmp/pinnacle_paths)" <<'PY'
          import json,sys
          from datetime import datetime,date,timedelta
          from zoneinfo import ZoneInfo
          with open(sys.argv[1],encoding="utf-8") as source:
              v=json.load(source)
          if set(v)!={"schema","day_turkey"} or v["schema"]!="263_pinnacle_once_request_v1":
              raise SystemExit("INVALID_ONE_SHOT_REQUEST")
          d=date.fromisoformat(v["day_turkey"])
          today=datetime.now(ZoneInfo("Europe/Istanbul")).date()
          if d not in (today,today+timedelta(days=1)):
              raise SystemExit("DATE_NOT_TODAY_OR_TOMORROW")
          with open("/tmp/pinnacle_day","w") as out:out.write(d.isoformat())
          PY
      - name: Read-only Pinnacle 1X2 probe at most 3 calls
        shell: bash
        env:
          THE_ODDS_API_KEY: ${{ secrets.THE_ODDS_API_KEY }}
        run: |
          set -euo pipefail
          if [ -z "$THE_ODDS_API_KEY" ]; then
            echo "NO_FREE_THE_ODDS_API_KEY_CONFIGURED"; exit 2
          fi
          mkdir -p pinnacle_trial
          python experiments/263/pinnacle_real_access_probe_263.py \
            --day-turkey "$(cat /tmp/pinnacle_day)" \
            --output pinnacle_trial/market.json
      - if: always()
        uses: actions/upload-artifact@v4
        with:
          name: pinnacle-one-shot-research-not-betting
          path: pinnacle_trial/market.json
          if-no-files-found: ignore
          retention-days: 7
