name: "263 Bayern Nov20 B and C3 root cause readonly diagnostic"
on:
  push:
    branches: [experiment/263-toplu-karsilastirma]
    paths:
      - experiments/263/diagnose_bayern_b_c3_20261120.py
      - .github/workflows/263-bayern-b-c3-root-cause.yml
permissions:
  contents: read
jobs:
  b-c3:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Frozen model dependencies
        run: python -m pip install --disable-pip-version-check numpy==2.3.5 scipy==1.17.0
      - name: Exact Bayern original model evaluation with original GER1 history
        env:
          PYTHONPATH: .:experiments/263
        run: python experiments/263/diagnose_bayern_b_c3_20261120.py
      - name: Past original models and forecasts unchanged
        run: git diff --exit-code
