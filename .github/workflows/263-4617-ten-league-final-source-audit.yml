name: "263 4617 finalized 10 league results-only M4 all-model gate"
on:
  push:
    branches:
      - experiment/263-toplu-karsilastirma
    paths:
      - 'experiments/263/test_4617_ten_league_live_route_readiness_263.py'
      - 'experiments/263/test_4617_results_only_m4_input_263.py'
      - 'experiments/263/forward_quad.py'
      - 'experiments/263/forward_empirical_baseline_263.py'
      - 'experiments/263/forward_baseline_provenance_263.py'
      - 'experiments/263/sabah_new100_commit_guard_263.py'
      - '.github/workflows/263-4617-ten-league-final-source-audit.yml'
permissions:
  contents: read
  actions: read
jobs:
  exact-10-league-no-live-bets:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Frozen engine dependencies
        run: python -m pip install --disable-pip-version-check numpy==2.3.5 scipy==1.17.0
      - name: Fetch immutable 4413 seed and check all three historical sources
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p m4_quad_base
          gh run download 41251343847 --repo "$GITHUB_REPOSITORY" -n team-source-audit -D m4_quad_base
          echo '35c5e7b4e0fad45c592fd51cf094616f2ff60330ce52bcf21cd595968169f5a1  m4_quad_base/historical_results.csv' | sha256sum -c -
          echo '1170ecf9bdc31426e80a069cfc63d7112d0ab0c0c7d527e3bb5daf9b3841ece9  data/quad_accepted_263/extended_history.csv' | sha256sum -c -
          echo '637b8597ac5bf479934a0b66aaed726b5fc30c20d9a5e9b4a770913cf9d68a89  data/results_only_263/2026-11-10_completed_4617_scores_only.csv' | sha256sum -c -
      - name: Compare M4 model, M4 lock, old 4518 source and old sealed forecast trees
        shell: bash
        run: |
          set -euo pipefail
          base=f548b61480310e52f060c4be5904cf944bd3b020
          for item in experiments/263/m4_integrated.py experiments/263/m4_lock.json \
            data/quad_accepted_263/extended_history.csv \
            forward_morning_263 forward_acceptance_263 forward_quad_263; do
            older="$(git rev-parse "$base:$item")"
            current="$(git rev-parse "HEAD:$item")"
            test "$older" = "$current" || {
              echo "IMMUTABLE_M4_OR_OLD_FORECAST_CHANGED $item"
              exit 1
            }
          done
          echo "ORIGINAL_M4_LOCK_HISTORY_AND_SEALED_TREES_IDENTICAL"
      - name: Check all 10 league full model market probability chains
        env:
          PYTHONPATH: .:experiments/263
        run: |
          python -m unittest -v \
            experiments/263/test_4617_results_only_m4_input_263.py \
            experiments/263/test_4617_ten_league_live_route_readiness_263.py
