name: "263 NED1 accepted source vs eligible full-match regression"
on:
  push:
    branches: [fix/263-ned1-gap-verify-raw-vs-eligible-20261121]
  pull_request:
    branches: [experiment/263-toplu-karsilastirma]
permissions:
  contents: read
jobs:
  source-versus-fit:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Pinned historical numerical dependencies
        run: python -m pip install --disable-pip-version-check numpy==2.3.5 scipy==1.17.0
      - name: Strict source-identity and training exposure acceptance
        env:
          PYTHONPATH: .:experiments/263
        run: |
          set -euo pipefail
          python -m unittest -v experiments/263/test_full_match_eligibility_263.py experiments/263/test_freshness_gap_guard_263.py
          python - <<'PY'
          from exp_263_batch import clean_rows
          from freshness_gap_guard_263 import review_gap
          from full_match_eligibility_263 import full_match_rows
          import hashlib
          from pathlib import Path
          from datetime import datetime,timezone
          p=Path('data/results_only_263/2026-11-10_completed_4617_scores_only.csv')
          before=hashlib.sha256(p.read_bytes()).hexdigest()
          assert before=='637b8597ac5bf479934a0b66aaed726b5fc30c20d9a5e9b4a770913cf9d68a89'
          raw=[r for r in clean_rows(p) if r['league']=='NED1']
          fit,exclude,digest=full_match_rows(raw)
          assert len(exclude)==1 and len(fit)==len(raw)-1
          proof=review_gap(raw,'NED1','2026-11-21',now=datetime.now(timezone.utc))
          assert proof['status']=='BOUNDED_GAP_NO_MISSING_RESULTS_IN_PUBLIC_FEED_RESEARCH_ONLY',proof
          assert proof['historical_overlap_matches_verified']==32,proof
          assert hashlib.sha256(p.read_bytes()).hexdigest()==before
          print('NED1_SOURCE_CHECK_PASS',proof['historical_overlap_matches_verified'],
                 'model_excluded',exclude,'source_SHA_preserved',before)
          PY
      - name: M4 model and old seals remain untouched
        run: |
          set -euo pipefail
          git fetch --quiet origin experiment/263-toplu-karsilastirma
          git diff --exit-code origin/experiment/263-toplu-karsilastirma -- \
            experiments/263/m4_integrated.py experiments/263/exp_263_batch.py \
            experiments/263/model_first_decision_263.py \
            experiments/263/model_first_selection_lock_20261121_v4.json \
            data/results_only_263 forward_morning_263
