name: "263 Nov20 user evening 3-match research ONLY (not sealed)"
on:
  push:
    branches: [experiment/263-toplu-karsilastirma]
    paths:
      - experiments/263/nov20_evening_run_trigger_20261120.json
permissions:
  contents: read
  actions: read
jobs:
  nov20-exact-three:
    runs-on: ubuntu-latest
    timeout-minutes: 14
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install pinned numerical code dependencies
        run: python -m pip install --disable-pip-version-check numpy==2.3.5 scipy==1.17.0
      - name: Fetch previously pinned 4413 historical base for accepted quad provenance
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir -p m4_quad_base
          gh run download 41251343847 --repo "$GITHUB_REPOSITORY" -n team-source-audit -D m4_quad_base
          echo '35c5e7b4e0fad45c592fd51cf094616f2ff60330ce52bcf21cd595968169f5a1  m4_quad_base/historical_results.csv' | sha256sum -c -
          echo '637b8597ac5bf479934a0b66aaed726b5fc30c20d9a5e9b4a770913cf9d68a89  data/results_only_263/2026-11-10_completed_4617_scores_only.csv' | sha256sum -c -
      - name: Verify current expert policy and 2026 Nov20 official parser gates
        env:
          PYTHONPATH: .:experiments/263
        run: |
          python experiments/263/check_active_decisions_263.py
          python -m unittest -v experiments/263/test_nov20_official_adapters_263.py
      - name: Compute exact three user-named real fixtures using frozen B/C2/C3/M4
        env:
          PYTHONPATH: .:experiments/263
        run: |
          python experiments/263/nov20_evening_user_research_263.py --out /tmp/nov20_user_research
          git diff --exit-code
      - name: Upload audit-only output - never an official pilot seal
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: nov20_user_evening_three_model_first_research
          path: /tmp/nov20_user_research/
          if-no-files-found: warn
          retention-days: 30
