name: Nov22 user-iddaa PDF fixture research M4 C3 without false official SHA
on:
  push:
    branches:
      - experiment/20261122-eight-league-25-pdf-probe
    paths:
      - experiments/p1_market_intelligence/nov22_eight_pdf_model_first_from_user_bulletin.py
      - .github/workflows/nov22-eight-pdf-fixture-research-no-official-gate.yml
  workflow_dispatch:
permissions:
  contents: read
  actions: read
jobs:
  pdf-list-only-research:
    runs-on: ubuntu-latest
    timeout-minutes: 18
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Use frozen 2.6.3 numerical dependencies
        run: python -m pip install --disable-pip-version-check numpy==2.3.5 scipy==1.17.0 PyMuPDF==1.26.5 reportlab
      - name: Restore historical 4413 base SHA-checked
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          mkdir -p m4_quad_base
          gh run download 41251343847 --repo "$GITHUB_REPOSITORY" -n team-source-audit -D m4_quad_base
          echo '35c5e7b4e0fad45c592fd51cf094616f2ff60330ce52bcf21cd595968169f5a1  m4_quad_base/historical_results.csv' | sha256sum -c -
      - name: PDF-bulletin club-ID and data gates, then exact frozen fit/calibration
        env:
          PYTHONPATH: .:experiments/263:experiments/p1_market_intelligence
        run: python experiments/p1_market_intelligence/nov22_eight_pdf_model_first_from_user_bulletin.py
      - name: Upload transparent full row report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: nov22-eight-PDF-fixtures-no-official-source-research
          path: /tmp/eight_league_25_pdf_model_research_no_official_gate.json
          if-no-files-found: warn
          retention-days: 7
