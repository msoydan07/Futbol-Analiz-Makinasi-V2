name: 263 P0 Hafiza read-only outcome research
on:
  push:
    branches: [experiment/p0-oran-hafizasi-22-lig-20261122]
    paths:
      - '.github/workflows/263-p0-hafiza-outcome-research.yml'
      - 'experiments/263/serbest_analiz_v2/outcome_requests/*.json'
  workflow_dispatch:
permissions:
  contents: read
  actions: read
concurrency:
  group: p0-hafiza-outcome-research
  cancel-in-progress: false
jobs:
  research-outcome:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          ref: experiment/p0-oran-hafizasi-22-lig-20261122
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install 'numpy>=1.24,<3' 'scipy>=1.10,<2' 'pymupdf>=1.23,<2'
      - name: Check accepted receipts and two-source final scores, no repository writes
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: python experiments/263/serbest_analiz_v2/P0_HAFIZA_OTOMATIK_SONUC_V1.py --root . --out "$RUNNER_TEMP/p0_hafiza_outcome.json"
      - uses: actions/upload-artifact@v4
        with:
          name: p0-hafiza-outcome-research
          path: ${{ runner.temp }}/p0_hafiza_outcome.json
          if-no-files-found: error
          retention-days: 30

  publish-verified-results:
    needs: research-outcome
    if: github.ref == 'refs/heads/experiment/p0-oran-hafizasi-22-lig-20261122'
    permissions:
      contents: write
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: experiment/p0-oran-hafizasi-22-lig-20261122
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - uses: actions/download-artifact@v4
        with:
          name: p0-hafiza-outcome-research
          path: ${{ runner.temp }}/verified-report
      - run: python -m pip install 'numpy>=1.24,<3' 'scipy>=1.10,<2' 'pymupdf>=1.23,<2'
      - name: Append only verified public score metadata; never change any receipt
        shell: bash
        run: |
          set -euo pipefail
          dir=experiments/263/serbest_analiz_v2/verified_results
          python experiments/263/serbest_analiz_v2/P0_HAFIZA_PUBLIC_RESULT_V1.py --root . --report "$RUNNER_TEMP/verified-report/p0_hafiza_outcome.json"
          git add -- "$dir"
          if git diff --cached --quiet; then exit 0; fi
          python -c 'import re,subprocess; rows=subprocess.check_output(["git","diff","--cached","--name-status"],text=True).splitlines(); assert rows and all(re.fullmatch(r"A\texperiments/263/serbest_analiz_v2/verified_results/[a-f0-9]{64}\.json",r) for r in rows)'
          git config user.name 'p0-hafiza-results[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'research: append verified P0 Hafiza score metadata'
          git push origin HEAD:experiment/p0-oran-hafizasi-22-lig-20261122
