name: "263 source-gap freshness fail-closed research CI"
on:
  push:
    branches:
      - research/263-source-gap-evidence-20261120
    paths:
      - experiments/263/freshness_gap_guard_263.py
      - experiments/263/forward_quad.py
      - experiments/263/test_freshness_gap_guard_263.py
      - experiments/263/audit_real_ten_league_gap_263.py
      - experiments/263/test_gap_real_model_temporary_263.py
      - .github/workflows/263-source-gap-freshness-research-ci.yml
permissions:
  contents: read
  actions: read
jobs:
  historical-gap:
    runs-on: ubuntu-latest
    timeout-minutes: 18
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install pinned legacy math packages
        run: python -m pip install --disable-pip-version-check numpy==2.3.5 scipy==1.17.0
      - name: Offline gap/no-result-bypass rejection unit tests
        env:
          PYTHONPATH: .:experiments/263
        run: |
          set -euo pipefail
          python -m unittest -v experiments/263/test_freshness_gap_guard_263.py
      - name: "Live public source read-only gap status for 10 leagues - BLOCKED is a safe finding"
        env:
          PYTHONPATH: .:experiments/263
        run: |
          set -euo pipefail
          python experiments/263/audit_real_ten_league_gap_263.py
          git diff --exit-code
      - name: Download pinned 4413 snapshot ONLY for temporary integration test
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          mkdir -p m4_quad_base
          gh run download 41251343847 --repo "$GITHUB_REPOSITORY" -n team-source-audit -D m4_quad_base
          echo '35c5e7b4e0fad45c592fd51cf094616f2ff60330ce52bcf21cd595968169f5a1  m4_quad_base/historical_results.csv' | sha256sum -c -
      - name: "Synthetic fixture temp-folder only - actual original four models with live verified public gap"
        env:
          PYTHONPATH: .:experiments/263
        run: |
          set -euo pipefail
          python experiments/263/test_gap_real_model_temporary_263.py
          git diff --exit-code
      - name: Frozen math models and previous SHA seals remain unchanged
        run: |
          set -euo pipefail
          test "$(git diff --name-only origin/experiment/263-toplu-karsilastirma HEAD -- experiments/263/m4_integrated.py experiments/263/exp_263_batch.py experiments/263/analysis_math_core.py forward_morning_263 forward_quad_263 data/results_only_263 | wc -l)" -eq 0
