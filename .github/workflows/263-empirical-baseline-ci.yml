name: 263 empirical baseline integrated acceptance
on:
  push:
    branches: [experiment/263-toplu-karsilastirma]
    paths:
      - 'experiments/263/forward_empirical_baseline_263.py'
      - 'experiments/263/test_forward_empirical_baseline_263.py'
      - '.github/workflows/263-empirical-baseline-ci.yml'
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Single batch — empirical baseline to candidate decision
        env:
          PYTHONPATH: experiments/263
        run: |
          python -m unittest discover -s experiments/263 -p 'test_forward_empirical_baseline_263.py' -v
          python -m unittest discover -s experiments/263 -p 'test_forward_baseline_provenance_263.py' -v
          python -m unittest discover -s experiments/263 -p 'test_forward_calibration_bridge_263.py' -v
