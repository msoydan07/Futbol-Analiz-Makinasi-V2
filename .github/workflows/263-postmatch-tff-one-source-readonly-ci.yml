name: "263 Nov8 pinned TFF results reuse archived source proof, no repeat HTTP"
on:
  push:
    branches:
      - research/263-tff-corum-postmatch-readonly-20261112
    paths:
      - 'experiments/263/postmatch_tff_one_match_263.py'
      - 'experiments/263/postmatch_csv_bridge_263.py'
      - 'experiments/263/test_postmatch_tff_one_match_263.py'
      - 'experiments/263/postmatch_tff_remaining_two_263.py'
      - 'experiments/263/test_postmatch_tff_remaining_two_263.py'
      - '.github/workflows/263-postmatch-tff-one-source-readonly-ci.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  official-single-source-audit:
    runs-on: ubuntu-latest
    timeout-minutes: 7
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Existing CSV isolation tests plus six source-conflict and sealed SHA tests
        env:
          PYTHONPATH: .:experiments/263
        run: |
          python -m unittest -v \
            experiments/263/test_postmatch_csv_bridge_263.py \
            experiments/263/test_postmatch_tff_one_match_263.py \
            experiments/263/test_postmatch_tff_remaining_two_263.py
      - name: Reuse the already-verified pinned TFF source records from terminal archive, no new HTTP
        env:
          PYTHONPATH: .:experiments/263
        run: |
          python - <<'PY'
          from postmatch_csv_bridge_263 import ROOT,sealed,registered_names,evaluate
          from postmatch_terminal_archive_263 import checked
          doc=checked(ROOT,sealed(ROOT),registered_names(ROOT))
          verified=[r for r in doc["rows"] if r["evidence_grade"]=="TFF_NETWORK_VERIFIED"]
          assert len(verified)==3
          assert {r["home"] for r in verified}=={"Çaykur Rizespor","Çorum FK","Beşiktaş"}
          assert all(r["official_network_verified"] for r in verified)
          assert all(not r["human_attestation"] for r in verified)
          result=evaluate()
          assert result["archive_closed"] and result["daily_external_csv_calls"]==0
          assert (result["registered"],result["provisional_scored"],result["pending"])==(40,39,1)
          assert result["independent_federation_verified"]==3
          print("TFF_THREE_PINNED_SOURCE_PROOFS_ARCHIVED_NO_REPEAT_HTTP_PASS")
          PY
      - name: No frozen models or sealed forecasts touched
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD:experiments/263/m4_lock.json)" = "$(git rev-parse 2542bda79918f296f71d1a145768f408ca5a538b:experiments/263/m4_lock.json)"
          test "$(git rev-parse HEAD:forward_morning_263/2026-11-08/f0a7dd75ba79329ab6e1bff1.json)" = "$(git rev-parse 2542bda79918f296f71d1a145768f408ca5a538b:forward_morning_263/2026-11-08/f0a7dd75ba79329ab6e1bff1.json)"
          test "$(git rev-parse HEAD:forward_morning_263/2026-11-08/ef6d6dbdb8075839cda5abbd.json)" = "$(git rev-parse 2542bda79918f296f71d1a145768f408ca5a538b:forward_morning_263/2026-11-08/ef6d6dbdb8075839cda5abbd.json)"
          test "$(git rev-parse HEAD:forward_morning_263/2026-11-08/8730c98b5070ec379d653b5d.json)" = "$(git rev-parse 2542bda79918f296f71d1a145768f408ca5a538b:forward_morning_263/2026-11-08/8730c98b5070ec379d653b5d.json)"
          echo "LOCKED_MODELS_AND_REAL_MATCH_SHA_UNCHANGED"
