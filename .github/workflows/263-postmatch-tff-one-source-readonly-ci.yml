name: "263 Nov8 pinned TFF official postmatch source read-only check"
on:
  push:
    branches:
      - research/263-tff-corum-postmatch-readonly-20261112
    paths:
      - 'experiments/263/postmatch_tff_one_match_263.py'
      - 'experiments/263/postmatch_csv_bridge_263.py'
      - 'experiments/263/test_postmatch_tff_one_match_263.py'
      - '.github/workflows/263-postmatch-tff-one-source-readonly-ci.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  official-single-source-audit:
    runs-on: ubuntu-latest
    timeout-minutes: 7
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Existing CSV isolation tests plus six source-conflict and sealed SHA tests
        env:
          PYTHONPATH: .:experiments/263
        run: |
          python -m unittest -v \
            experiments/263/test_postmatch_csv_bridge_263.py \
            experiments/263/test_postmatch_tff_one_match_263.py
      - name: Live CSV plus independent TFF one missing match (no model/forecast rewrite)
        env:
          PYTHONPATH: .:experiments/263
        run: |
          python - <<'PY'
          import json
          from datetime import datetime,timezone
          from postmatch_csv_bridge_263 import ROOT,sealed,registered_names,evaluate
          from postmatch_tff_one_match_263 import verify_one,FORECAST_SHA
          result=evaluate(now=datetime.now(timezone.utc))
          assert result["registered"]==40
          row=next(x for x in result["rows"] if x["forecast_sha256"]==FORECAST_SHA)
          assert row["score"]==[0,5], "TFF_CSV_SOURCE_CONFLICT"
          assert result["human_attestations_written"]==0
          assert not result["forecast_modified"] and not result["models_retrained"]
          if not row["official_network_evidence"]:
              # If the CSV later catches up, still independently read the
              # pinned actual TFF source; never confuse CSV with federation.
              row["official_network_evidence"]=verify_one(
                  sealed(ROOT)[FORECAST_SHA],registered_names(ROOT)[FORECAST_SHA],
                  now=datetime.now(timezone.utc))
          proof=row["official_network_evidence"]
          assert proof["score"]==[0,5] and proof["federation_page_read"] is True
          print("TFF_PINNED_OFFICIAL_NETWORK_READ="+json.dumps(proof,ensure_ascii=False,sort_keys=True))
          print("RESEARCH_POSTMATCH_SUMMARY="+json.dumps({
              "registered":result["registered"],
              "provisional_scored":result["provisional_scored"],
              "pending":result["pending"],
              "source_classes":result["status_counts"],
              "independent_official_page_count":result["independent_federation_verified"],
              "human_attestations_written":0,
              "not_betting_performance_proof":True},ensure_ascii=False))
          PY
      - name: No frozen models or sealed forecasts touched
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD:experiments/263/m4_lock.json)" = "$(git rev-parse 2542bda79918f296f71d1a145768f408ca5a538b:experiments/263/m4_lock.json)"
          test "$(git rev-parse HEAD:forward_morning_263/2026-11-08/f0a7dd75ba79329ab6e1bff1.json)" = "$(git rev-parse 2542bda79918f296f71d1a145768f408ca5a538b:forward_morning_263/2026-11-08/f0a7dd75ba79329ab6e1bff1.json)"
          echo "LOCKED_MODELS_AND_REAL_MATCH_SHA_UNCHANGED"
