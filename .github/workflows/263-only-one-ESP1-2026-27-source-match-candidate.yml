name: 263 Research - Only 1 LaLiga source result identity still missing old 119
on:
  push:
    branches:
      - research/263-13-lig-22-havuz-20261113
    paths:
      - .github/workflows/263-only-one-ESP1-2026-27-source-match-candidate.yml
      - experiments/263/league_expansion/probe_only_one_remaining_ESP1_2026_27_identity_candidate.py
permissions:
  contents: write
jobs:
  only_remaining_ESP1_candidate_not_old_119_score_QA:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - name: Identify only one missing scored fixture source date plus final score, no raw results
        run: |
          python experiments/263/league_expansion/probe_only_one_remaining_ESP1_2026_27_identity_candidate.py
          python - <<'PY'
          import json
          from pathlib import Path
          d=json.loads(Path("experiments/263/league_expansion/esp1_2026_27_official_2026_nov8_gap_only/one_rest_ESP1_2026_27_source_only_candidate_before_nov6_20261114.json").read_text())
          assert d["old_core_119_not_rewritten"] and d["model_training_approved"]==0 and d["raw_provider_result_rows_archived"]==0
          PY
      - name: Persist only source candidate report for subsequent official corroboration
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add experiments/263/league_expansion/esp1_2026_27_official_2026_nov8_gap_only/one_rest_ESP1_2026_27_source_only_candidate_before_nov6_20261114.json
          git commit -m "research(263): isolate only one LaLiga older missing fixture candidate, no raw API results and no M4 change"
          git push origin HEAD:research/263-13-lig-22-havuz-20261113
