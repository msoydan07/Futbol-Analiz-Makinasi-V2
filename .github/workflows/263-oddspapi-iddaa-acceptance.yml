name: 263 OddsPapi iddaa API adapter ONE isolated acceptance
on:
  push:
    branches: [experiment/263-toplu-karsilastirma]
    paths:
      - 'experiments/263/odds_provider_oddspapi_263.py'
      - 'experiments/263/test_odds_provider_oddspapi_263.py'
      - 'experiments/263/classification_odds_263.py'
      - 'experiments/263/four_model_value_policy_263.py'
      - '.github/workflows/263-oddspapi-iddaa-acceptance.yml'
permissions:
  contents: read
jobs:
  one-source-contract:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Existing numerical dependencies only
        run: python -m pip install --disable-pip-version-check numpy==2.3.5 scipy==1.17.0
      - name: Single new source API contract plus existing odds/decision regression
        env:
          PYTHONPATH: experiments/263
        run: |
          python -m unittest -v \
            experiments/263/test_odds_provider_oddspapi_263.py \
            experiments/263/test_four_model_value_policy_263.py \
            experiments/263/test_market_quote_intake_263.py
