name: "263 Research - 118 possible gaps source identity reconciliation; aggregate only"
on:
  push:
    branches:
      - research/263-13-lig-22-havuz-20261113
    paths:
      - .github/workflows/263-four-118-source-identity-aggregate-only.yml
      - experiments/263/league_expansion/resolve_118_four_2026_27_identities_personal_metadata_only.py
permissions:
  contents: write
jobs:
  identity-qa-only:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - name: Test frozen 118 counts and strict-versus-alias comparator
        run: python experiments/263/league_expansion/resolve_118_four_2026_27_identities_personal_metadata_only.py --self-test
      - name: Compare four current source fixture identities to SHA-locked local research records
        run: python experiments/263/league_expansion/resolve_118_four_2026_27_identities_personal_metadata_only.py --run
      - name: Fail closed on unknown output format or rights/mathematics promotion
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          p=Path("experiments/263/league_expansion/2026_27_FOUR_118_SCOPED_CROSS_SOURCE_FIXTURE_IDENTITY_METADATA_20261114.json")
          r=json.loads(p.read_text())
          assert len(r["league_results"])==4
          assert r["new_model_training_rows"]==0
          assert r["source_raw_rows_rehosted"]==0
          assert r["source_match_urls_published"]==0
          assert not r["main_M4_or_xG_file_modified"]
          assert r["source_successful"]+r["source_access_blocked"]==4
          assert set(r["league_results"])=={"SCO1","CHE1","GRE1","AUT1"}
          print("PASS metadata-only, 4 leagues, 0 raw source republication and 0 training")
          PY
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: 263-four-possible-118-identity-metadata-only
          path: experiments/263/league_expansion/2026_27_FOUR_118_SCOPED_CROSS_SOURCE_FIXTURE_IDENTITY_METADATA_20261114.json
      - name: Commit only aggregate league-specific QA result in research branch
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -- experiments/263/league_expansion/2026_27_FOUR_118_SCOPED_CROSS_SOURCE_FIXTURE_IDENTITY_METADATA_20261114.json
          if ! git diff --cached --quiet; then
            git commit -m "research(263): annotate four league 118 source count gaps by ephemeral identity QA, no raw archive"
            git push origin HEAD:research/263-13-lig-22-havuz-20261113
          fi
