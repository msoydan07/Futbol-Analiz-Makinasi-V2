name: Basketbol V1 independent historical backtest
on:
  workflow_dispatch:
  push:
    branches: [basketbol-v1-bagimsiz-arastirma]
    paths:
      - 'basketbol_v1/**'
      - '.github/workflows/basketbol-v1-backtest.yml'
permissions:
  contents: read
jobs:
  test-and-backtest:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Chronological leakage and probability offline acceptance
        run: python -m unittest -v basketbol_v1/test_engine.py
      - name: Offline pregame anti-backdating test
        run: python -m unittest -v basketbol_v1/test_predict.py
      - name: Fetch genuine past NBA, EuroLeague and EuroCup finals and score holdout
        run: |
          set -euo pipefail
          python basketbol_v1/benchmark.py --fail-if-empty --out /tmp/basketbol-v1.json --mobile /tmp/basketbol-v1.md
      - name: Future-date forecast scenario smoke, NOT an official fixture
        run: |
          set -euo pipefail
          DAY="$(TZ=Europe/Istanbul date -d '+3 days' +%Y-%m-%d)"
          python basketbol_v1/predict.py --league NBA --day "$DAY" --home DEN --away LAL \
            --total-line 224.5 --home-handicap -4.5 --out /tmp/basketbol-v1-example.json
      - name: Package portable basketball-only source code
        if: always()
        run: |
          zip -r -q /tmp/basketbol-v1-source.zip basketbol_v1 .github/workflows/basketbol-v1-backtest.yml
      - name: Research artifact only, no historical prediction rewrite
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: basketbol-v1-test-kaniti
          retention-days: 30
          if-no-files-found: ignore
          path: |
            /tmp/basketbol-v1.json
            /tmp/basketbol-v1.md
            /tmp/basketbol-v1-example.json
            /tmp/basketbol-v1-source.zip
