name: Basketbol V1 independent historical backtest
on:
  workflow_dispatch:
  push:
    branches: [basketbol-v1-bagimsiz-arastirma]
    paths:
      - 'basketbol_v1/**'
      - '.github/workflows/basketbol-v1-backtest.yml'
permissions:
  contents: read
jobs:
  test-and-backtest:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Chronological leakage and probability offline acceptance
        run: python -m unittest -v basketbol_v1/test_engine.py
      - name: Fetch genuine past NBA and EuroLeague finals and score holdout
        run: |
          set -euo pipefail
          python basketbol_v1/benchmark.py --fail-if-empty --out /tmp/basketbol-v1.json --mobile /tmp/basketbol-v1.md
      - name: Research artifact only, no historical prediction rewrite
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: basketbol-v1-test-kaniti
          retention-days: 30
          if-no-files-found: ignore
          path: |
            /tmp/basketbol-v1.json
            /tmp/basketbol-v1.md
