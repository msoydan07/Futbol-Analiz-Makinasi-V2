name: Gercek tek mac uctan uca deneme
on:
  push:
    branches: [feature/01-kimlikler]
    paths: ['.github/workflows/real-single-match.yml']
  workflow_dispatch:
    inputs:
      league:
        description: 'League code e.g. ENG1 TUR1'
        required: true
        default: 'ENG1'
      home:
        description: 'Home team official name'
        required: true
      away:
        description: 'Away team official name'
        required: true
jobs:
  real-match:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Generate current historical identity data
        run: |
          python collect_team_candidates.py
          python prepare_team_identity_review.py
          python audit_season_membership.py
          python import_provisional_teams.py
          python prepare_official_name_review.py
          python apply_official_team_names.py
          python verify_official_mappings.py
          python audit_identity_integrity.py
          python audit_fixture_candidates.py
          python import_real_fixtures.py
          python audit_result_quality.py
          python build_historical_results.py
          python audit_single_match_generated_identity.py
      - name: Check official fixture and run Model B only when verified
        env:
          MATCH_LEAGUE: ${{ inputs.league || 'TUR1' }}
          MATCH_HOME: ${{ inputs.home || 'Kasımpaşa' }}
          MATCH_AWAY: ${{ inputs.away || 'Beşiktaş' }}
        run: |
          python - <<'PY'
          import json,os
          from pathlib import Path
          from analyze_verified_match import run
          result=run(os.environ["MATCH_LEAGUE"],os.environ["MATCH_HOME"],os.environ["MATCH_AWAY"])
          Path("data/real_single_match_report.json").write_text(json.dumps(result,ensure_ascii=False,indent=2)+"\n",encoding="utf-8")
          print(json.dumps({"status":result["status"],"reason":result.get("reason"),"fixture_verification":result.get("fixture_verification")},ensure_ascii=False))
          PY
      - name: Store evidence even if fixture not verified
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: real-single-match-evidence
          if-no-files-found: warn
          path: |
            data/real_single_match_report.json
            data/single_match_identity_integration_audit.json
            data/historical_results_audit.json
