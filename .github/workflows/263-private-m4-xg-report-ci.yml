name: "263 private M4 xG as-of report acceptance"
on:
  push:
    branches:
      - research/263-private-m4-xg-user-report-20261119
  pull_request:
    branches:
      - experiment/263-toplu-karsilastirma
  workflow_dispatch:
permissions:
  contents: read
jobs:
  private-xg-prekickoff:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install frozen M4 dependencies
        run: python -m pip install --disable-pip-version-check numpy==2.3.5 scipy==1.17.0
      - name: Syntax and private as-of functionality tests
        env:
          PYTHONPATH: .:experiments/263
        run: |
          python -m py_compile experiments/263/m4_xg_private_report_263.py
          python -m unittest -v experiments/263/test_m4_xg_private_report_263.py
      - name: Existing source and M4 immutability regression tests
        env:
          PYTHONPATH: .:experiments/263
        run: |
          python experiments/263/test_m4_xg_support_263.py
          python experiments/263/test_m4_xg_sidecar_io_263.py
