name: 263 dort model analizi ve piyasa rapor birlestirme - yeni kontrol
on:
  push:
    branches: [experiment/263-toplu-karsilastirma]
    paths:
      - 'experiments/263/readonly_quad_models_263.py'
      - 'experiments/263/readonly_quad_market_report_263.py'
      - 'experiments/263/test_readonly_quad_market_report_263.py'
      - 'experiments/263/test_quad_full_report_e2e_263.py'
      - 'experiments/263/requested_match_runner_263.py'
      - '.github/workflows/263-quad-market-report-check.yml'
permissions:
  contents: read
jobs:
  no-ledger-report-integration:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install existing required numerical libraries
        run: python -m pip install --disable-pip-version-check numpy==2.3.5 scipy==1.17.0
      - name: Verify original SHA-locked 4413-match source
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/263-base"
          gh run download 41251343847 --repo "$GITHUB_REPOSITORY" \
            -n team-source-audit -D "$RUNNER_TEMP/263-base"
          echo '35c5e7b4e0fad45c592fd51cf094616f2ff60330ce52bcf21cd595968169f5a1  '"$RUNNER_TEMP/263-base/historical_results.csv" | sha256sum --check
      - name: New pure model and one real-archive report integration acceptance; no backtest
        env:
          PYTHONPATH: experiments/263
        run: |
          export M263_FROZEN_HISTORY="$RUNNER_TEMP/263-base/historical_results.csv"
          python -m unittest -v experiments/263/test_readonly_quad_market_report_263.py experiments/263/test_quad_full_report_e2e_263.py
